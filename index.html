'},\n{s:'S',zh:'我通常能保持耐心，不會因為別人需要時間就急著催促。',th:'ฉันมักอดทนและไม่เร่งผู้อื่นเพียงเพราะเขาต้องใช้เวลา'},\n{s:'S',zh:'我喜歡讓工作夥伴知道，他們可以依靠我完成約定的工作。',th:'ฉันชอบให้เพื่อนร่วมงานรู้ว่าสามารถไว้วางใจให้ฉันทำงานตามที่ตกลงได้'},\n{s:'S',zh:'團隊有變動時，我會幫忙說明流程並支持同事度過過渡期。',th:'เมื่อทีมมีการเปลี่ยนแปลง ฉันช่วยอธิบายขั้นตอนและสนับสนุนเพื่อนร่วมงานในช่วงเปลี่ยนผ่าน'},\n{s:'S',zh:'我在意工作成果，也在意合作過程是否互相尊重。',th:'ฉันใส่ใจทั้งผลงานและการให้เกียรติกันระหว่างทำงานร่วมกัน'},\n{s:'S',zh:'我會用穩定、持續的方式維護客戶或夥伴的信任。',th:'ฉันรักษาความไว้วางใจของลูกค้าหรือคู่ร่วมงานด้วยการดูแลอย่างต่อเนื่อง'},\n{s:'C',zh:'開始工作前，我會確認要求、標準和完成條件是否明確。',th:'ก่อนเริ่มงาน ฉันตรวจสอบว่าข้อกำหนด มาตรฐาน และเงื่อนไขการเสร็จงานชัดเจนหรือไม่'},\n{s:'C',zh:'我會依據資料和證據做判斷，而不是只憑印象。',th:'ฉันตัดสินใจจากข้อมูลและหลักฐาน ไม่ใช่อาศัยความรู้สึกเพียงอย่างเดียว'},\n{s:'C',zh:'我習慣檢查數字、文件或細節，避免小錯誤變成大問題。',th:'ฉันมักตรวจตัวเลข เอกสาร หรือรายละเอียดเพื่อไม่ให้ข้อผิดพลาดเล็ก ๆ กลายเป็นปัญหาใหญ่'},\n{s:'C',zh:'遇到複雜問題時，我會先拆解原因並確認哪些資訊仍不足。',th:'เมื่อพบปัญหาซับซ้อน ฉันจะแยกสาเหตุและตรวจสอบว่าข้อมูลส่วนใดยังไม่เพียงพอ'},\n{s:'C',zh:'如果發現流程沒有依規範執行，我會提出來並確認如何修正。',th:'หากพบว่าขั้นตอนไม่เป็นไปตามข้อกำหนด ฉันจะหยิบยกขึ้นมาและยืนยันวิธีแก้ไข'},\n{s:'C',zh:'我喜歡把重要決定的依據記錄下來，讓後續可以追溯。',th:'ฉันชอบบันทึกเหตุผลของการตัดสินใจสำคัญเพื่อให้ตรวจสอบย้อนหลังได้'},\n{s:'C',zh:'我會比較不同方案的風險、成本和效益，再推薦做法。',th:'ฉันเปรียบเทียบความเสี่ยง ต้นทุน และประโยชน์ของแต่ละทางเลือกก่อนเสนอแนวทาง'},\n{s:'C',zh:'我傾向先把必要資訊整理好，再向團隊提出結論。',th:'ฉันมักจัดเตรียมข้อมูลที่จำเป็นก่อน แล้วจึงเสนอข้อสรุปต่อทีม'},\n{s:'C',zh:'我重視工作的一致性，會留意不同人是否使用相同標準。',th:'ฉันให้ความสำคัญกับความสม่ำเสมอและสังเกตว่าทุกคนใช้มาตรฐานเดียวกันหรือไม่'},\n{s:'C',zh:'收到模糊的任務時，我會先提出問題釐清範圍和預期結果。',th:'เมื่อได้รับงานที่ไม่ชัดเจน ฉันจะถามเพื่อกำหนดขอบเขตและผลลัพธ์ที่คาดหวัง'},\n{s:'C',zh:'我會在交付前做一次有系統的自我檢查。',th:'ก่อนส่งมอบงาน ฉันตรวจทานด้วยตนเองอย่างเป็นระบบหนึ่งรอบ'},\n{s:'C',zh:'我能指出資料中的矛盾或不一致，並追問它對結論的影響。',th:'ฉันสังเกตความขัดแย้งหรือความไม่สอดคล้องในข้อมูลและสอบถามผลที่มีต่อข้อสรุปได้'},\n];\n\nconst ALT_FORMS={\n1:{\nD:[\n['面對緊急問題，我會先設定最重要的目標，再安排立即行動。','เมื่อเกิดปัญหาเร่งด่วน ฉันกำหนดเป้าหมายสำคัญที่สุดก่อนแล้วจัดการลงมือทันที'],\n['若責任分工不清，我會主動確認負責人與決策權限。','หากแบ่งหน้าที่ไม่ชัด ฉันยืนยันผู้รับผิดชอบและอำนาจตัดสินใจด้วยตนเอง'],\n['當方案可能達不到要求時，我會直接指出並提出替代做法。','เมื่อแนวทางอาจไม่ถึงเป้าหมาย ฉันชี้ให้เห็นตรง ๆ และเสนอวิธีอื่น'],\n['我願意承接具挑戰性的任務，並對最後成果負責。','ฉันพร้อมรับงานที่ท้าทายและรับผิดชอบต่อผลงานสุดท้าย'],\n['我會追蹤期限，並要求延誤工作提出清楚的補救步驟。','ฉันติดตามกำหนดเวลาและขอขั้นตอนแก้ไขที่ชัดเจนเมื่องานล่าช้า'],\n['意見僵持時，我能選定方向並承擔決定帶來的結果。','เมื่อความเห็นขัดแย้งกัน ฉันเลือกทิศทางและรับผิดชอบผลจากการตัดสินใจได้'],\n['時間和資源有限時，我會優先投入影響最大的任務。','เมื่อเวลาและทรัพยากรจำกัด ฉันจัดลำดับงานที่มีผลกระทบมากที่สุดก่อน'],\n['若舊方法持續拖累成果，我會要求重新檢討流程。','หากวิธีเดิมทำให้ผลงานแย่ลงต่อเนื่อง ฉันขอทบทวนขั้นตอนใหม่'],\n['我用清楚可衡量的目標檢視進度，不只看忙碌程度。','ฉันตรวจความคืบหน้าจากเป้าหมายที่วัดได้ ไม่ใช่ดูเพียงความยุ่ง'],\n['即使別人反對，我仍能說明立場並維持必要的決策方向。','แม้ผู้อื่นไม่เห็นด้วย ฉันอธิบายจุดยืนและรักษาทิศทางที่จำเป็นได้'],\n['專案遇到阻礙時，我會尋找突破方式，而不只等待指示。','เมื่อโครงการติดขัด ฉันมองหาทางฝ่าอุปสรรคแทนการรอคำสั่ง'],\n['我會清楚要求自己與團隊對承諾的結果負責。','ฉันกำหนดความรับผิดชอบต่อผลลัพธ์ที่ตกลงไว้ให้ตนเองและทีมอย่างชัดเจน']\n],\nI:[\n['新同事加入時，我會主動介紹大家並幫助彼此熟悉。','เมื่อเพื่อนร่วมงานใหม่เข้าทีม ฉันแนะนำทุกคนและช่วยให้รู้จักกัน'],\n['我能以有感染力的方式介紹方案，邀請他人支持。','ฉันนำเสนอแนวทางอย่างน่าสนใจและชวนผู้อื่นให้การสนับสนุนได้'],\n['在會議中，我會分享想法並帶動大家參與討論。','ในการประชุม ฉันแบ่งปันแนวคิดและกระตุ้นให้ทุกคนร่วมพูดคุย'],\n['我喜歡透過合作認識夥伴，發掘未來的合作機會。','ฉันชอบทำความรู้จักผู้ร่วมงานผ่านการทำงานและมองหาโอกาสร่วมมือ'],\n['我會具體肯定同事的貢獻，鼓勵他們繼續投入。','ฉันชื่นชมผลงานของเพื่อนร่วมงานอย่างเจาะจงเพื่อกระตุ้นให้มีส่วนร่วมต่อ'],\n['我擅長把改變說成清楚且令人期待的方向。','ฉันอธิบายการเปลี่ยนแปลงให้เป็นทิศทางที่ชัดเจนและน่าตื่นเต้นได้'],\n['我能從對話中看出誰有興趣，並邀請對方加入。','ฉันสังเกตได้จากการสนทนาว่าใครสนใจและชวนคนนั้นเข้าร่วม'],\n['團隊士氣低落時，我會主動帶來鼓勵和正面氣氛。','เมื่อกำลังใจของทีมลดลง ฉันนำคำให้กำลังใจและบรรยากาศเชิงบวกเข้ามา'],\n['我喜歡坦然表達熱情，讓別人感受到我對工作的投入。','ฉันชอบแสดงความกระตือรือร้นให้ผู้อื่นเห็นว่าทุ่มเทกับงาน'],\n['我會用故事或比喻讓抽象概念容易理解。','ฉันใช้เรื่องเล่าหรืออุปมาเพื่อทำให้แนวคิดนามธรรมเข้าใจง่าย'],\n['我常協助不同部門找到共同點並建立聯繫。','ฉันช่วยให้แผนกต่าง ๆ มองเห็นจุดร่วมและสร้างความสัมพันธ์กัน'],\n['我能在即時交流中快速產生新點子。','ฉันคิดแนวทางใหม่ได้รวดเร็วระหว่างการแลกเปลี่ยนสด']\n],\nS:[\n['我能耐心完成重複且細碎的工作，直到交接完整。','ฉันทำงานซ้ำและงานย่อยอย่างอดทนจนส่งมอบครบถ้วน'],\n['即使進展緩慢，我通常也能保持穩定的工作節奏。','แม้งานคืบหน้าช้า ฉันยังรักษาจังหวะการทำงานให้สม่ำเสมอได้'],\n['我會留意同事是否需要協助，並提供具體支援。','ฉันสังเกตว่าเพื่อนร่วมงานต้องการความช่วยเหลือหรือไม่และช่วยอย่างเป็นรูปธรรม'],\n['面對新流程，我會先了解對團隊日常工作的影響再適應。','เมื่อมีขั้นตอนใหม่ ฉันทำความเข้าใจผลต่อการทำงานประจำวันของทีมก่อนปรับตัว'],\n['即使沒有即時回饋，我仍會持續履行自己答應的工作。','แม้ไม่ได้รับคำตอบกลับทันที ฉันยังทำงานที่รับปากไว้อย่างต่อเนื่อง'],\n['我擅長維持團隊穩定、可預期的日常運作。','ฉันเก่งในการรักษาการทำงานประจำวันของทีมให้มั่นคงและคาดการณ์ได้'],\n['衝突升高時，我會先聽取各方，再協助大家冷靜溝通。','เมื่อความขัดแย้งรุนแรงขึ้น ฉันฟังทุกฝ่ายก่อนแล้วช่วยให้พูดคุยอย่างใจเย็น'],\n['我重視長期可靠的合作，不喜歡頻繁更換約定。','ฉันให้ความสำคัญกับความร่วมมือระยะยาวที่ไว้ใจได้และไม่ชอบเปลี่ยนข้อตกลงบ่อย'],\n['同事需要適應改變時，我願意留出足夠時間和支持。','เมื่อเพื่อนร่วมงานต้องปรับตัวกับการเปลี่ยนแปลง ฉันพร้อมให้เวลาและแรงสนับสนุนเพียงพอ'],\n['若有人落後進度，我會先了解困難並商量可行的協助。','หากมีคนทำงานล่าช้า ฉันถามถึงอุปสรรคก่อนและหารือวิธีช่วยที่ทำได้'],\n['做決定時，我會考慮對團隊日常節奏和成員的影響。','เมื่อตัดสินใจ ฉันคำนึงถึงผลต่อจังหวะงานประจำวันและสมาชิกในทีม'],\n['工作繁忙時，我仍能以平穩方式逐步完成重要事項。','แม้งานยุ่ง ฉันยังทำเรื่องสำคัญให้เสร็จทีละขั้นอย่างมั่นคง']\n],\nC:[\n['開始前，我會核對作業標準和文件版本是否正確。','ก่อนเริ่มงาน ฉันตรวจสอบมาตรฐานและเวอร์ชันเอกสารให้ถูกต้อง'],\n['我習慣用紀錄或清單追蹤多步驟的工作。','ฉันมักใช้บันทึกหรือรายการตรวจสอบติดตามงานหลายขั้นตอน'],\n['我會確認證據是否足以支持目前的判斷。','ฉันตรวจว่าหลักฐานเพียงพอที่จะสนับสนุนข้อสรุปปัจจุบันหรือไม่'],\n['發現數據異常時，我會回頭核對量測方法和原始記錄。','เมื่อพบข้อมูลผิดปกติ ฉันย้อนตรวจวิธีวัดและบันทึกต้นฉบับ'],\n['我會先定義驗收條件，再判斷工作是否完成。','ฉันกำหนดเงื่อนไขการยอมรับก่อนตัดสินว่างานเสร็จหรือยัง'],\n['交付前，我會依照要求逐項檢查內容。','ก่อนส่งมอบ ฉันตรวจเนื้อหาทีละข้อเทียบกับข้อกำหนด'],\n['我比較信任可重複執行並能驗證效果的改善方法。','ฉันเชื่อมั่นในวิธีปรับปรุงที่ทำซ้ำและตรวจสอบผลได้'],\n['我會預想可能失效的環節，並提前安排預防措施。','ฉันคาดการณ์จุดที่อาจล้มเหลวและวางมาตรการป้องกันล่วงหน้า'],\n['若缺少關鍵資料，我會暫緩結論並說明資訊缺口。','หากขาดข้อมูลสำคัญ ฉันชะลอข้อสรุปและอธิบายช่องว่างของข้อมูล'],\n['我希望重要決策留下依據、負責人和後續追蹤方式。','ฉันต้องการให้การตัดสินใจสำคัญมีเหตุผล ผู้รับผิดชอบ และวิธีติดตามต่อ'],\n['我會觀察不同班別或人員是否依相同流程執行。','ฉันสังเกตว่ากะหรือพนักงานต่างคนปฏิบัติตามขั้นตอนเดียวกันหรือไม่'],\n['我較依賴可追溯的資料，而不是憑第一印象下結論。','ฉันพึ่งพาข้อมูลที่ตรวจสอบย้อนหลังได้มากกว่าการสรุปจากความประทับใจแรก']\n]},\n2:{\nD:[\n['若討論始終沒有決議，我會整理選項、選定方案並推動下一步。','หากการหารือไม่มีข้อสรุป ฉันสรุปทางเลือก เลือกแนวทางและผลักดันขั้นต่อไป'],\n['我願意在關鍵時刻作出必要決定，即使有人不喜歡。','ฉันพร้อมตัดสินใจเรื่องจำเป็นในช่วงสำคัญแม้อาจมีคนไม่พอใจ'],\n['遇到具競爭性的目標時，我會設定進度並積極追趕。','เมื่อมีเป้าหมายที่แข่งขันกัน ฉันกำหนดความคืบหน้าและเร่งผลักดัน'],\n['我會直接指出影響成果的問題，不刻意迴避難談的議題。','ฉันชี้ปัญหาที่กระทบผลงานตรง ๆ โดยไม่หลีกเลี่ยงประเด็นที่พูดยาก'],\n['任務沒有明確負責人時，我通常會先承接並建立方向。','เมื่องานไม่มีเจ้าของชัดเจน ฉันมักรับหน้าที่ก่อนและกำหนดทิศทาง'],\n['我會要求討論聚焦在決定和可執行的行動上。','ฉันพยายามให้การหารือมุ่งที่การตัดสินใจและการลงมือที่ทำได้จริง'],\n['面對突發變化，我能快速重新排定優先順序。','เมื่อต้องเผชิญการเปลี่ยนแปลงกะทันหัน ฉันจัดลำดับความสำคัญใหม่ได้รวดเร็ว'],\n['我會積極爭取完成目標所需的資源與支持。','ฉันพยายามขอทรัพยากรและแรงสนับสนุนที่จำเป็นต่อเป้าหมาย'],\n['我傾向用明確標準要求進度，不只等待情況自然改善。','ฉันมักกำหนดมาตรฐานความคืบหน้าให้ชัด แทนการรอให้สถานการณ์ดีขึ้นเอง'],\n['我能在壓力下保持果斷，讓團隊知道先做什麼。','ภายใต้แรงกดดัน ฉันยังเด็ดขาดและช่วยให้ทีมรู้ว่าควรทำอะไรก่อน'],\n['我會提出具體挑戰，促使團隊突破目前成果。','ฉันเสนอความท้าทายที่เป็นรูปธรรมเพื่อผลักดันให้ทีมยกระดับผลงาน'],\n['我認為清楚的責任和成果標準能加快執行。','ฉันเชื่อว่าความรับผิดชอบและมาตรฐานผลลัพธ์ที่ชัดช่วยให้งานเดินเร็วขึ้น']\n],\nI:[\n['我容易與陌生人開始交談，並建立友善的第一印象。','ฉันเริ่มคุยกับคนที่ไม่คุ้นเคยได้ง่ายและสร้างความประทับใจแรกที่เป็นมิตร'],\n['我喜歡把熱情帶進團隊，讓工作氣氛更活躍。','ฉันชอบนำความกระตือรือร้นเข้าทีมเพื่อทำให้บรรยากาศการทำงานมีชีวิตชีวา'],\n['面對新提案，我能正向說明它的吸引力。','เมื่อมีข้อเสนอใหม่ ฉันอธิบายจุดน่าสนใจด้วยมุมมองเชิงบวกได้'],\n['我常能在非正式交流中獲得有用的想法或合作線索。','ฉันมักได้แนวคิดหรือเบาะแสความร่วมมือจากการพูดคุยไม่เป็นทางการ'],\n['我喜歡和不同的人互動，而不只專注自己的工作範圍。','ฉันชอบมีปฏิสัมพันธ์กับคนหลากหลายมากกว่าจำกัดอยู่ในขอบเขตงานตัวเอง'],\n['我會用鼓舞人心的方式邀請同事投入共同目標。','ฉันชวนเพื่อนร่วมงานร่วมเป้าหมายด้วยน้ำเสียงที่สร้างแรงบันดาลใจ'],\n['我能用簡潔的例子讓聽眾快速掌握重點。','ฉันใช้ตัวอย่างสั้น ๆ ช่วยให้ผู้ฟังเข้าใจประเด็นได้รวดเร็ว'],\n['我會主動在公開場合代表團隊表達成果或想法。','ฉันอาสาเป็นตัวแทนทีมเพื่อนำเสนอผลงานหรือแนวคิดในที่สาธารณะ'],\n['別人提出新點子時，我容易接續發想並擴大討論。','เมื่อผู้อื่นเสนอแนวคิดใหม่ ฉันต่อยอดและขยายการพูดคุยได้ง่าย'],\n['我善於讓人感到被接納，願意加入團隊活動。','ฉันทำให้ผู้คนรู้สึกได้รับการยอมรับและอยากเข้าร่วมกิจกรรมทีม'],\n['需要凝聚共識時，我會先找出大家認同的部分。','เมื่อต้องสร้างฉันทามติ ฉันมองหาส่วนที่ทุกคนเห็นพ้องก่อน'],\n['我喜歡分享工作進展，讓團隊看見階段成果。','ฉันชอบแบ่งปันความคืบหน้าเพื่อให้ทีมเห็นผลงานในแต่ละช่วง']\n],\nS:[\n['我會提前確認交接內容，避免工作在不同人之間中斷。','ฉันยืนยันเนื้อหาการส่งต่องานล่วงหน้าเพื่อไม่ให้งานสะดุดระหว่างคน'],\n['工作方式改變時，我會協助同事逐步熟悉新的安排。','เมื่อวิธีทำงานเปลี่ยน ฉันช่วยให้เพื่อนร่วมงานคุ้นเคยกับแผนใหม่ทีละขั้น'],\n['我能在長時間的例行工作中維持專注和耐性。','ฉันรักษาสมาธิและความอดทนกับงานประจำที่ใช้เวลานานได้'],\n['我通常先找雙方都能接受的解法，而不是加深衝突。','ฉันมักหาทางออกที่ทั้งสองฝ่ายยอมรับได้แทนการเพิ่มความขัดแย้ง'],\n['我會記得團隊成員的需要，並在適當時候提供幫助。','ฉันจำความต้องการของสมาชิกทีมและให้ความช่วยเหลือในเวลาที่เหมาะสม'],\n['我偏好穩定的合作關係，並透過持續跟進建立信任。','ฉันชอบความร่วมมือที่มั่นคงและสร้างความไว้วางใจด้วยการติดตามต่อเนื่อง'],\n['面對急迫要求，我仍會確認品質和同事負荷是否可維持。','เมื่อต้องเร่งงาน ฉันยังตรวจว่าคุณภาพและภาระของเพื่อนร่วมงานยังรับไหวหรือไม่'],\n['我會在會議中給較安靜的人時間表達意見。','ฉันให้เวลาคนที่พูดน้อยได้แสดงความคิดเห็นในการประชุม'],\n['我做事不急於求成，願意一步步建立穩定成果。','ฉันไม่เร่งให้สำเร็จทันทีและพร้อมสร้างผลงานที่มั่นคงทีละขั้น'],\n['同事需要支持時，我通常願意陪他一起處理。','เมื่อเพื่อนร่วมงานต้องการแรงสนับสนุน ฉันมักลงมือช่วยด้วยกัน'],\n['我會確認團隊每個人都清楚新的工作安排。','ฉันตรวจให้แน่ใจว่าสมาชิกทุกคนเข้าใจแผนงานใหม่ตรงกัน'],\n['我在意工作的連續性，會避免不必要的突然變動。','ฉันใส่ใจความต่อเนื่องของงานและหลีกเลี่ยงการเปลี่ยนแปลงกะทันหันที่ไม่จำเป็น']\n],\nC:[\n['我會確認最新規範已核准，再依此安排工作。','ฉันตรวจว่าข้อกำหนดล่าสุดได้รับอนุมัติแล้วก่อนวางแผนงาน'],\n['解決問題時，我會蒐集資料並比較可能的原因。','เมื่อต้องแก้ปัญหา ฉันรวบรวมข้อมูลและเปรียบเทียบสาเหตุที่เป็นไปได้'],\n['我會檢查計算、單位和資料來源，避免分析基礎出錯。','ฉันตรวจการคำนวณ หน่วย และแหล่งข้อมูลเพื่อป้องกันพื้นฐานการวิเคราะห์ผิดพลาด'],\n['我偏好有明確規格和檢查點的工作安排。','ฉันชอบแผนงานที่มีข้อกำหนดและจุดตรวจสอบชัดเจน'],\n['提出建議前，我會衡量可能的風險和副作用。','ก่อนเสนอแนะ ฉันประเมินความเสี่ยงและผลข้างเคียงที่อาจเกิดขึ้น'],\n['我會確認每項偏差都有紀錄、分析和處置結果。','ฉันตรวจว่าความเบี่ยงเบนแต่ละรายการมีบันทึก วิเคราะห์ และผลการจัดการ'],\n['我願意花時間完善報告，讓內容完整且容易追溯。','ฉันยินดีใช้เวลาปรับรายงานให้ครบถ้วนและตรวจสอบย้อนหลังได้ง่าย'],\n['若會議資訊不足，我會提出問題補足判斷依據。','หากข้อมูลในการประชุมไม่พอ ฉันถามเพื่อเติมหลักฐานประกอบการตัดสินใจ'],\n['我會留意小幅偏差，因為它可能預示較大風險。','ฉันใส่ใจความเบี่ยงเบนเล็กน้อยเพราะอาจบ่งชี้ความเสี่ยงที่ใหญ่กว่า'],\n['我重視跨班別或跨部門使用一致的定義和標準。','ฉันให้ความสำคัญกับการใช้คำจำกัดความและมาตรฐานเดียวกันข้ามกะหรือแผนก'],\n['我會比較改善前後的數據，確認措施是否有效。','ฉันเปรียบเทียบข้อมูลก่อนและหลังการปรับปรุงเพื่อยืนยันว่ามาตรการได้ผลหรือไม่'],\n['面對不確定的結論，我會區分事實、推論和假設。','เมื่อข้อสรุปยังไม่แน่นอน ฉันแยกข้อเท็จจริง การอนุมาน และสมมติฐานให้ชัดเจน']\n]}\n};\n\nconst ORDER=['D','I','S','C'],FIELD_KEYS=['strength','blind','values','communication','relationships','work','pressure','growth'],STORE_KEY='discWorkStyleExplorerV2',REPEAT_KEY='discWorkStyleExplorerV2Previous',TOTAL=48,$=id=>document.getElementById(id);let lang='zh',order=[],answers=[],index=0,resultState=null,previousResult=null,activeFormIndex=0,participantKey='guest';\nfunction t(){return UI[lang]}function scopedKey(key){return key+'::'+encodeURIComponent(participantKey)}function esc(value){return String(value??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]))}\nfunction readProgress(){try{const value=JSON.parse(localStorage.getItem(scopedKey(STORE_KEY))||'null');return value&&Array.isArray(value.order)&&Array.isArray(value.answers)&&value.order.length===TOTAL&&[0,1,2].includes(value.formIndex)?value:null}catch{return null}}\nfunction readPrevious(){try{const value=JSON.parse(localStorage.getItem(scopedKey(REPEAT_KEY))||'n "quiz-meta\"><span id=\"form-label\"><\/span><br><span id=\"progress-label\"><\/span><\/div><\/div>\n  <div class=\"progress-track\" id=\"progress-track\"><div class=\"progress-bar\" id=\"progress-bar\"><\/div><\/div>\n  <div class=\"question-card\"><div class=\"question-number\" id=\"question-number\"><\/div><div class=\"question-text\" id=\"question-text\"><\/div><div class=\"options\" id=\"options\" role=\"group\"><\/div><\/div>\n  <div class=\"quiz-nav\"><button class=\"secondary\" id=\"previous-button\" type=\"button\"><\/button><button class=\"primary\" id=\"next-button\" type=\"button\" disabled><\/button><\/div>\n  <div class=\"quiz-note\" id=\"quiz-note\"><\/div>\n <\/section>\n <section id=\"result-screen\" class=\"screen\" data-new-attempt=\"false\">\n  <div class=\"result-hero\" id=\"result-hero\"><div class=\"result-code type-code\" id=\"result-code\"><\/div><h2 id=\"result-title\"><\/h2><p id=\"result-subtitle\"><\/p><\/div>\n  <div class=\"scores\" id=\"scores\"><\/div>\n  <div class=\"result-note\" id=\"result-note\"><\/div>\n  <div class=\"button-row\"><button class=\"primary\" id=\"retest-button\" type=\"button\"><\/button><button class=\"secondary\" id=\"return-button\" type=\"button\"><\/button><\/div>\n  <details class=\"method\"><summary id=\"result-method-title\"><\/summary><div id=\"result-method-body\"><\/div><div class=\"source-list\"><a href=\"https://www.ipip.ori.org/New_IPIP-50-item-scale.htm\" target=\"_blank\" rel=\"noopener\" id=\"result-source-ipip\"><\/a><a href=\"https://www.ipip.ori.org/newScoringInstructions.htm\" target=\"_blank\" rel=\"noopener\" id=\"result-source-scoring\"><\/a><\/div><\/details>\n <\/section>\n <div class=\"footer\" id=\"footer-copy\"><\/div>\n<\/main>\n<script>\nconst ITEMS=[\n{id:1,key:'E',dir:1,zh:'我是派對中的靈魂人物。',th:'ฉันเป็นจุดเด่นของงานเลี้ยง'},\n{id:2,key:'A',dir:-1,zh:'我覺得自己很少關心別人。',th:'ฉันไม่ค่อยใส่ใจผู้อื่น'},\n{id:3,key:'C',dir:1,zh:'我隨時做好準備。',th:'ฉันเตรียมพร้อมอยู่เสมอ'},\n{id:4,key:'S',dir:-1,zh:'我容易感到壓力過大。',th:'ฉันเครียดได้ง่าย'},\n{id:5,key:'I',dir:1,zh:'我詞彙豐富。',th:'ฉันมีคลังคำศัพท์มากมาย'},\n{id:6,key:'E',dir:-1,zh:'我話不多。',th:'ฉันไม่ค่อยพูด'},\n{id:7,key:'A',dir:1,zh:'我對人感興趣。',th:'ฉันสนใจผู้คน'},\n{id:8,key:'C',dir:-1,zh:'我總是丟三落四。',th:'ฉันมักวางข้าวของทิ้งไว้ตามที่ต่าง ๆ'},\n{id:9,key:'S',dir:1,zh:'我大多時候是放鬆的。',th:'ฉันรู้สึกผ่อนคลายเกือบตลอดเวลา'},\n{id:10,key:'I',dir:-1,zh:'我對於理解抽象概念有困難。',th:'ฉันเข้าใจแนวคิดเชิงนามธรรมได้ยาก'},\n{id:11,key:'E',dir:1,zh:'我和其他人在一起時感覺自在。',th:'ฉันรู้สึกสบายใจเมื่ออยู่กับผู้คน'},\n{id:12,key:'A',dir:-1,zh:'我會侮辱別人。',th:'ฉันพูดดูหมิ่นผู้อื่น'},\n{id:13,key:'C',dir:1,zh:'我經常注意細節。',th:'ฉันใส่ใจรายละเอียด'},\n{id:14,key:'S',dir:-1,zh:'我時常為事擔心。',th:'ฉันกังวลเรื่องต่าง ๆ'},\n{id:15,key:'I',dir:1,zh:'我有生動的想像力。',th:'ฉันมีจินตนาการที่แจ่มชัด'},\n{id:16,key:'E',dir:-1,zh:'我是個低調的人。',th:'ฉันมักไม่แสดงตัว'},\n{id:17,key:'A',dir:1,zh:'我會同情他人的感受。',th:'ฉันเห็นอกเห็นใจความรู้สึกของผู้อื่น'},\n{id:18,key:'C',dir:-1,zh:'我常把事物弄得一團糟。',th:'ฉันมักทำสิ่งต่าง ๆ ยุ่งเหยิง'},\n{id:19,key:'S',dir:1,zh:'我很少感到鬱悶。',th:'ฉันแทบไม่รู้สึกเศร้าหมอง'},\n{id:20,key:'I',dir:-1,zh:'我對抽象概念不感興趣。',th:'ฉันไม่สนใจแนวคิดเชิงนามธรรม'},\n{id:21,key:'E',dir:1,zh:'我總是主動開始談話。',th:'ฉันเป็นฝ่ายเริ่มบทสนทนา'},\n{id:22,key:'A',dir:-1,zh:'我對別人的問題不感興趣。',th:'ฉันไม่สนใจปัญหาของผู้อื่น'},\n{id:23,key:'C',dir:1,zh:'我會立即將日常家務做完。',th:'ฉันรีบทำงานบ้านให้เสร็จ'},\n{id:24,key:'S',dir:-1,zh:'我容易受擾亂。',th:'ฉันถูกรบกวนความรู้สึกได้ง่าย'},\n{id:25,key:'I',dir:1,zh:'我常有絕佳的點子。',th:'ฉันมีความคิดที่ยอดเยี่ยม'},\n{id:26,key:'E',dir:-1,zh:'我沒什麼話說。',th:'ฉันไม่ค่อยมีอะไรจะพูด'},\n{id:27,key:'A',dir:1,zh:'我有顆柔軟的心。',th:'ฉันเป็นคนใจอ่อน'},\n{id:28,key:'C',dir:-1,zh:'我常忘記物歸原處。',th:'ฉันมักลืมเก็บของกลับเข้าที่'},\n{id:29,key:'S',dir:-1,zh:'我容易感到悶悶不樂。',th:'ฉันรู้สึกไม่สบายใจได้ง่าย'},\n{id:30,key:'I',dir:-1,zh:'我想像力欠佳。',th:'ฉันมีจินตนาการไม่ค่อยดี'},\n{id:31,key:'E',dir:1,zh:'在聚會中我會跟許多不同的人說話。',th:'ในงานเลี้ยง ฉันพูดคุยกับผู้คนหลากหลาย'},\n{id:32,key:'A',dir:-1,zh:'我對別人沒什麼興趣。',th:'ฉันไม่ค่อยสนใจผู้อื่นจริง ๆ'},\n{id:33,key:'C',dir:1,zh:'我喜歡井然有序。',th:'ฉันชอบความเป็นระเบียบ'},\n{id:34,key:'S',dir:-1,zh:'我的心情變化很大。',th:'อารมณ์ของฉันเปลี่ยนแปลงบ่อย'},\n{id:35,key:'I',dir:1,zh:'我可以很快理解事物。',th:'ฉันเข้าใจสิ่งต่าง ๆ ได้อย่างรวดเร็ว'},\n{id:36,key:'E',dir:-1,zh:'我不喜歡引起別人對自己的注意。',th:'ฉันไม่ชอบดึงความสนใจมาที่ตัวเอง'},\n{id:37,key:'A',dir:1,zh:'我總會為別人抽出時間。',th:'ฉันแบ่งเวลาให้ผู้อื่นเสมอ'},\n{id:38,key:'C',dir:-1,zh:'我會推卸責任。',th:'ฉันมักหลีกเลี่ยงหน้าที่ของตัวเอง'},\n{id:39,key:'S',dir:-1,zh:'我的心情時常起伏不定。',th:'ฉันมีอารมณ์ขึ้นลงบ่อย'},\n{id:40,key:'I',dir:1,zh:'我常使用艱澀的字彙。',th:'ฉันใช้คำศัพท์ยาก ๆ'},\n{id:41,key:'E',dir:1,zh:'我不介意成為注目的焦點。',th:'ฉันไม่รังเกียจที่จะเป็นจุดสนใจ'},\n{id:42,key:'A',dir:1,zh:'我能感受他人的情緒。',th:'ฉันรับรู้อารมณ์ของผู้อื่นได้'},\n{id:43,key:'C',dir:1,zh:'我總是按照預定計畫行事。',th:'ฉันทำตามตารางเวลา'},\n{id:44,key:'S',dir:-1,zh:'我容易感到煩躁。',th:'ฉันหงุดหงิดได้ง่าย'},\n{id:45,key:'I',dir:1,zh:'我會花時間反思事物。',th:'ฉันใช้เวลาทบทวนเรื่องต่าง ๆ'},\n{id:46,key:'E',dir:-1,zh:'我和陌生人相處時顯得安靜。',th:'ฉันเงียบเมื่ออยู่กับคนแปลกหน้า'},\n{id:47,key:'A',dir:1,zh:'我能使人感到自在。',th:'ฉันทำให้ผู้คนรู้สึกสบายใจ'},\n{id:48,key:'C',dir:1,zh:'我對我的工作要求嚴謹。',th:'ฉันทำงานอย่างพิถีพิถัน'},\n{id:49,key:'S',dir:-1,zh:'我常感到鬱悶。',th:'ฉันรู้สึกเศร้าหมองบ่อย'},\n{id:50,key:'I',dir:1,zh:'我總是充滿想法。',th:'ฉันเต็มไปด้วยไอเดีย'}\n];\nconst DOMAIN_ORDER=['E','A','C','S','I'];\nfunction seededRandom(seed){let n=seed>>>0;return function(){n+=0x6D2B79F5;let t=n;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}\nfunction shuffled(items,rng){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction buildInterleavedForm(seed){const rng=seededRandom(seed),groups={};for(const key of DOMAIN_ORDER)groups[key]=shuffled(ITEMS.filter(x=>x.key===key).map(x=>x.id-1),rng);const domainOrder=shuffled(DOMAIN_ORDER,rng),out=[];for(let row=0;row<10;row++){for(let col=0;col<5;col++)out.push(groups[domainOrder[(col+row)%5]][row])}return out}\nconst FORM_ORDERS=[Array.from({length:50},(_,i)=>i),buildInterleavedForm(230517),buildInterleavedForm(918273)];\nfunction scoreAnswers(answers){const missing=ITEMS.filter(x=>!Number.isInteger(Number(answers[x.id]))||Number(answers[x.id])<1||Number(answers[x.id])>5).map(x=>x.id);if(missing.length)return{complete:false,missing};const scores={};for(const key of DOMAIN_ORDER){const items=ITEMS.filter(x=>x.key===key);const sum=items.reduce((total,item)=>{const raw=Number(answers[item.id]);return total+(item.dir===1?raw:6-raw)},0);scores[key]={sum,mean:sum/items.length}}return{complete:true,scores}}\nfunction chooseForm(previous,random){const rng=random||Math.random;const choices=[0,1,2].filter(x=>x!==previous);return choices[Math.min(choices.length-1,Math.floor(rng()*choices.length))]}\nwindow.BIGFIVE_TEST_API={ITEMS:ITEMS,DOMAIN_ORDER:DOMAIN_ORDER,FORM_ORDERS:FORM_ORDERS,scoreAnswers:scoreAnswers,chooseForm:chooseForm};\nconst COPY={\nzh:{\n pageTitle:'大五人格探索｜IPIP-50',brand:'大五人格探索',brandSub:'IPIP 公開 50 題量表',languageLabel:'語言切換',progressAria:'作答進度',rangeAria:'平均分範圍 1 至 5',eyebrow:'公開題庫 · 有來源的自我探索',title:'Big Five 大五人格測驗',intro:'透過 50 個日常描述，觀察你在五個連續人格向度上的自我評估。依據 IPIP 公開題項與 Goldberg 的 Big-Five markers 表述；這是自我探索工具，不是診斷或職務評估。',\n itemBadge:'50 題 · 5 個向度',scaleBadge:'1–5 分 · 五點作答',formBadge:'三種隨機題序 · 同一套題目',\n howTitle:'測驗方式與計分',howCopy:'請依照「目前一般狀況中的自己」作答，而不是希望成為的樣子。每個向度各有 10 題。正向題依 1–5 計分；反向題以 6 − 作答分數轉換，再加總為 10–50 分，並提供 1.0–5.0 的題目平均分。',\n domainPreview:[['E｜外向性','社交活躍、健談與在人群中的自在程度。'],['A｜宜人性','對他人的關心、體諒與友善互動。'],['C｜盡責性','準備、秩序、細節與履行責任的傾向。'],['ES｜情緒穩定性','本量表按穩定方向計分，與常稱的神經質方向相反。'],['I｜智性／想像力','詞彙、抽象思考、想像與點子；與開放性相關但不等同完整開放性量表。']],\n validity:'題序 A／B／C 只改變同一組 50 題的呈現順序，不是三份經獨立驗證的等值試卷。此頁採用繁體中文公開翻譯；泰文為本頁翻譯，尚未完成泰語心理計量驗證。',\n start:'開始 50 題測驗',resume:'繼續未完成測驗',retest:'再測一次（隨機抽另一題序）',statusName:'測驗者：',statusResume:'已保存未完成作答，會從尚未回答的題目繼續。',statusDone:'已有完成結果；開始後會抽取不同題序。',statusNew:'每題選擇最符合你目前一般狀況的選項。',methodTitle:'題目來源、計分與限制',methodBody:'<p>本測驗使用 <b>50-item IPIP representation of Goldberg’s Big-Five Factor Markers<\/b>，不是一份名為「官方 Big Five」的唯一標準測驗。IPIP 官方說明題項屬公領域，並允許翻譯與調整；官方示例使用五個作答選項，按各題的正向或反向鍵值計分。<\/p><ul><li>反向計分：新分數 = 6 − 原作答（1↔5、2↔4、3不變）。<\/li><li>每個向度有 10 題；顯示原始總分 10–50 與平均分 1.0–5.0。<\/li><li>IPIP 官方沒有替個人設定通用的高、中、低切點。沒有本地代表性常模時，不應把分數說成百分位或人口排名；因此本頁不產生類型標籤、總人格分或診斷結論。<\/li><li>題序版本僅為方便重測的呈現方式；題目與計分鍵維持相同，不宣稱為經驗證的等值形式。<\/li><li>繁體中文題目採 IPIP 網站公布的翻譯；泰文題目是本頁翻譯。泰語研究中，另一套 IPIP-NEO 泰文 50 題版本在原五因素模型的適配度不佳，研究者另行修訂短版；該研究不驗證本頁這套泰文翻譯。<\/li><\/ul><p>僅供成人自我反思或培訓討論；不能用於心理診斷、招募或職務適任判斷。<\/p>',\n quizTitle:'請描述你目前一般狀況中的自己',formPrefix:'題序版本',progress:'題目',question:'第',of:'／50 題',prev:'上一題',next:'下一題',finish:'完成並查看分數',quizNote:'請依照目前一般狀況作答。沒有對錯答案；每題都必須完成才能計分。',anchors:['非常不貼切','有些不貼切','普通','有些貼切','非常貼切'],\n resultTitle:'五個向度的作答分數',resultSubtitle:'每個分數代表本次作答在該向度的平均反應方向；五個向度彼此獨立，不加總成單一人格分數。',resultNote:'解讀方式：1.0–5.0 是本題組內的平均分，總分範圍為 10–50。較靠近 1 或 5 表示在這 10 題上較常選擇該方向的描述；這不是和人口常模比較的高低，也不是好壞排名。',observed:'題項涵蓋',scaleWords:'平均分',ends:['1.0｜較少符合題目描述','5.0｜較多符合題目描述'],\n retake:'再做一次',returnHome:'返回標題',resultMethodTitle:'計分與量表依據',sourceIpip:'IPIP 50 題原始版與題序說明',sourceChinese:'IPIP 繁體中文題目翻譯',sourceScoring:'IPIP 官方計分說明',sourceThai:'泰文 IPIP-NEO 研究（非本頁量表）',footer:'離線可用 · 作答與個人結果保存在本機瀏覽器。泰文版是本頁翻譯，未完成語言效度驗證。',\n domains:{\n  E:{name:'E｜外向性',desc:'主要涉及社交活躍、健談、主動開始談話，以及在人群中感到自在。較高平均分表示更常認同這組外向與社交描述。'},\n  A:{name:'A｜宜人性',desc:'主要涉及關心他人、體諒情緒、願意付出時間與讓人自在。分數只描述自我回報傾向，不代表道德或人品。'},\n  C:{name:'C｜盡責性',desc:'主要涉及準備、注意細節、維持秩序、及時完成事情與遵守計畫。較低分也不等於能力不足。'},\n  S:{name:'ES｜情緒穩定性',desc:'此量表的高分方向代表較少自陳壓力、煩躁與情緒波動；它是以情緒穩定性方向計分，與神經質（Neuroticism）方向相反。'},\n  I:{name:'I｜智性／想像力',desc:'主要涉及抽象概念、豐富詞彙、反思、想像與點子。這是原 IPIP marker 的構面名稱，與開放性（Openness）有關，但不能直接當成完整的開放性分量表。'}\n }},\nth:{\n pageTitle:'สำรวจบุคลิกภาพห้าปัจจัย｜IPIP-50',brand:'สำรวจบุคลิกภาพ Big Five',brandSub:'IPIP สาธารณะ · แบบ 50 ข้อ',languageLabel:'เปลี่ยนภาษา',progressAria:'ความคืบหน้าการตอบ',rangeAria:'ช่วงค่าเฉลี่ย 1 ถึง 5',eyebrow:'คลังข้อคำถามสาธารณะ · สำรวจตนเองอย่างมีที่มา',title:'แบบสำรวจบุคลิกภาพ Big Five',intro:'ใช้ข้อความเกี่ยวกับชีวิตประจำวัน 50 ข้อเพื่อสังเกตการประเมินตนเองในห้ามิติบุคลิกภาพแบบต่อเนื่อง อ้างอิงข้อคำถาม IPIP สาธารณะและ Big-Five markers ของ Goldberg เครื่องมือนี้ใช้สำรวจตนเอง ไม่ใช่การวินิจฉัยหรือประเมินความเหมาะสมกับงาน',\n itemBadge:'50 ข้อ · 5 มิติ',scaleBadge:'คะแนน 1–5 · 5 ระดับ',formBadge:'สุ่มลำดับ 3 แบบ · ใช้ข้อคำถามชุดเดียวกัน',\n howTitle:'รูปแบบและการให้คะแนน',howCopy:'ตอบตามลักษณะทั่วไปของคุณในปัจจุบัน ไม่ใช่แบบที่อยากเป็น แต่ละมิติมี 10 ข้อ ข้อที่ให้คะแนนทิศทางบวกใช้คะแนน 1–5 ส่วนข้อกลับทิศคำนวณเป็น 6 − คะแนนคำตอบ แล้วรวมเป็นคะแนน 10–50 พร้อมค่าเฉลี่ยรายข้อ 1.0–5.0',\n domainPreview:[['E｜การแสดงออกทางสังคม','การเข้าสังคม พูดคุย และรู้สึกสบายใจเมื่ออยู่กับผู้คน'],['A｜การคำนึงถึงผู้อื่น','ความใส่ใจ เห็นอกเห็นใจ และปฏิสัมพันธ์อย่างเป็นมิตร'],['C｜ความมีระเบียบและรับผิดชอบ','การเตรียมพร้อม ใส่ใจรายละเอียด เป็นระเบียบ และทำหน้าที่'],['ES｜ความมั่นคงทางอารมณ์','ฉบับนี้ให้คะแนนไปทางความมั่นคง ซึ่งตรงข้ามกับทิศทาง Neuroticism'],['I｜ความคิดและจินตนาการ','คำศัพท์ ความคิดนามธรรม จินตนาการ และไอเดีย เกี่ยวข้องกับ Openness แต่ไม่ใช่มาตรวัด Openness ฉบับเต็ม']],\n validity:'แบบลำดับ A/B/C เปลี่ยนเฉพาะลำดับการแสดงข้อคำถาม 50 ข้อชุดเดิม ไม่ใช่แบบทดสอบคู่ขนานที่ผ่านการตรวจสอบแยกกัน ภาษาไทยเป็นคำแปลในหน้านี้ ยังไม่ได้ตรวจสอบคุณสมบัติทางจิตมิติในภาษาไทย',\n start:'เริ่มตอบ 50 ข้อ',resume:'ทำต่อจากที่บันทึกไว้',retest:'ทำอีกครั้ง (สุ่มลำดับใหม่)',statusName:'ผู้ทำแบบสำรวจ: ',statusResume:'บันทึกคำตอบที่ยังไม่เสร็จแล้ว จะเริ่มจากข้อที่ยังไม่ได้ตอบ',statusDone:'มีผลการทำครั้งก่อนแล้ว เริ่มใหม่จะสุ่มลำดับที่ต่างออกไป',statusNew:'เลือกคำตอบที่ตรงกับลักษณะทั่วไปของคุณในปัจจุบันมากที่สุด',methodTitle:'ที่มาของข้อคำถาม การให้คะแนน และข้อจำกัด',methodBody:'<p>แบบสำรวจนี้ใช้ <b>50-item IPIP representation of Goldberg’s Big-Five Factor Markers<\/b> ไม่ใช่แบบทดสอบมาตรฐานสากลเพียงฉบับเดียวที่เรียกว่า “Official Big Five” เว็บไซต์ IPIP ระบุว่าข้อคำถามเป็นสาธารณสมบัติและอนุญาตให้แปลหรือปรับรูปแบบได้ ตัวอย่างทางการใช้ตัวเลือก 5 ระดับและให้คะแนนตามทิศทางบวกหรือกลับทิศของแต่ละข้อ<\/p><ul><li>ข้อกลับทิศ: คะแนนใหม่ = 6 − คะแนนเดิม (1↔5, 2↔4, 3 คงเดิม)<\/li><li>แต่ละมิติมี 10 ข้อ แสดงคะแนนรวมดิบ 10–50 และค่าเฉลี่ย 1.0–5.0<\/li><li>IPIP ไม่มีจุดตัดสากลสำหรับจัดบุคคลเป็นสูง ปานกลาง หรือต่ำ หากไม่มีค่ามาตรฐานที่เป็นตัวแทนของประชากรท้องถิ่น ก็ไม่ควรอ้างเปอร์เซ็นไทล์หรืออันดับประชากร หน้านี้จึงไม่สร้างประเภทบุคลิกภาพ คะแนนรวมเดียว หรือข้อสรุปเพื่อการวินิจฉัย<\/li><li>แบบลำดับมีไว้เพื่อความสะดวกในการทำซ้ำ โดยใช้ข้อคำถามและกุญแจคะแนนเดิม ไม่อ้างว่าเป็นแบบคู่ขนานที่ผ่านการตรวจสอบ<\/li><li>ภาษาไทยเป็นคำแปลในหน้านี้ งานวิจัยภาษาไทยเกี่ยวกับ IPIP-NEO อีกฉบับพบว่าแบบ 50 ข้อเดิมมีความสอดคล้องกับโมเดลห้าปัจจัยต่ำ และผู้วิจัยได้ปรับเป็นแบบสั้น งานดังกล่าวไม่ได้ตรวจสอบคำแปลภาษาไทยในหน้านี้<\/li><\/ul><p>ใช้เพื่อสะท้อนตนเองหรือการพูดคุยในการอบรมสำหรับผู้ใหญ่เท่านั้น ไม่ใช้วินิจฉัยทางจิตวิทยา คัดเลือกบุคลากร หรือประเมินความเหมาะสมของตำแหน่ง<\/p>',\n quizTitle:'โปรดอธิบายลักษณะทั่วไปของคุณในปัจจุบัน',formPrefix:'ลำดับแบบ',progress:'ข้อ',question:'ข้อที่',of:'/50 ข้อ',prev:'ข้อก่อนหน้า',next:'ข้อถัดไป',finish:'เสร็จและดูคะแนน',quizNote:'ตอบตามลักษณะทั่วไปของคุณในปัจจุบัน ไม่มีคำตอบถูกหรือผิด ต้องตอบครบทุกข้อจึงจะคิดคะแนนได้',anchors:['ไม่ตรงกับฉันมาก','ไม่ค่อยตรงกับฉัน','ปานกลาง','ค่อนข้างตรงกับฉัน','ตรงกับฉันมาก'],\n resultTitle:'คะแนนจากคำตอบทั้งห้ามิติ',resultSubtitle:'แต่ละคะแนนแสดงแนวโน้มคำตอบเฉลี่ยในมิตินั้น ห้ามิติเป็นอิสระต่อกันและไม่นำมารวมเป็นคะแนนบุคลิกภาพเดียว',resultNote:'การอ่านคะแนน: 1.0–5.0 คือค่าเฉลี่ยภายในข้อคำถามชุดนี้ คะแนนรวมอยู่ระหว่าง 10–50 ค่าที่ใกล้ 1 หรือ 5 หมายถึงคุณเลือกคำบรรยายในทิศทางนั้นบ่อยกว่าใน 10 ข้อนี้ ไม่ใช่การเปรียบเทียบกับประชากรหรือการจัดอันดับว่าดีหรือไม่ดี',observed:'หัวข้อคำถาม',scaleWords:'ค่าเฉลี่ย',ends:['1.0｜ตรงกับคำบรรยายน้อยกว่า','5.0｜ตรงกับคำบรรยายมากกว่า'],\n retake:'ทำอีกครั้ง',returnHome:'กลับหน้าแรก',resultMethodTitle:'ที่มาการให้คะแนนและมาตรวัด',sourceIpip:'IPIP 50 ข้อและคำอธิบายลำดับ',sourceChinese:'คำแปลภาษาจีนตัวเต็มจาก IPIP',sourceScoring:'คำแนะนำการให้คะแนนของ IPIP',sourceThai:'งานวิจัย IPIP-NEO ภาษาไทย (ไม่ใช่มาตรวัดในหน้านี้)', Each(x=>x.classList.remove('active'));document.getElementById(next+'-screen').classList.add('active')}\nfunction setLabels(){\n const c=copy();document.documentElement.lang=lang==='zh'?'zh-Hant':'th';document.title=c.pageTitle;\n document.getElementById('brand-title').textContent=c.brand;document.getElementById('brand-subtitle').textContent=c.brandSub;document.getElementById('language-switch').setAttribute('aria-label',c.languageLabel);document.getElementById('eyebrow').textContent=c.eyebrow;document.getElementById('main-title').textContent=c.title;document.getElementById('intro-copy').textContent=c.intro;\n document.getElementById('item-badge').textContent=c.itemBadge;document.getElementById('scale-badge').textContent=c.scaleBadge;document.getElementById('form-badge').textContent=c.formBadge;\n document.getElementById('how-title').textContent=c.howTitle;document.getElementById('how-copy').textContent=c.howCopy;document.getElementById('validity-note').textContent=c.validity;\n document.getElementById('start-button').textContent=state?(state.completed?c.retest:c.resume):c.start;\n const detail=document.getElementById('domain-preview');detail.innerHTML=c.domainPreview.map(x=>'<div class=\"info-card\"><b>'+x[0]+'<\/b><span>'+x[1]+'<\/span><\/div>').join('');\n document.getElementById('method-title').textContent=c.methodTitle;document.getElementById('method-body').innerHTML=c.methodBody;\n document.getElementById('source-ipip').textContent=c.sourceIpip;document.getElementById('source-chinese').textContent=c.sourceChinese;document.getElementById('source-scoring').textContent=c.sourceScoring;document.getElementById('source-thai').textContent=c.sourceThai;\n document.getElementById('home-button').textContent=c.returnHome;document.getElementById('home-button').setAttribute('aria-label',c.returnHome);\n document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));\n document.getElementById('footer-copy').textContent=c.footer;document.getElementById('result-method-title').textContent=c.resultMethodTitle;document.getElementById('result-source-ipip').textContent=c.sourceIpip;document.getElementById('result-source-scoring').textContent=c.sourceScoring;\n if(mode==='quiz'&&state)renderQuestion();if(mode==='result'&&state&&state.scores)renderResults(state.scores,document.getElementById('result-screen').dataset.newAttempt==='true');\n}\nfunction updateStatus(){\n const c=copy(),el=document.getElementById('status');\n if(!testName){el.textContent=c.statusNew;return}\n if(!state){el.textContent=c.statusName+testName+' · '+c.statusNew;return}\n const answered=Object.keys(state.answers||{}).length;\n if(state.completed){el.textContent=c.statusName+testName+' · '+c.statusDone;return}\n if(answered){el.textContent=c.statusName+testName+' · '+c.statusResume+' ('+answered+'/50)';return}\n el.textContent=c.statusName+testName+' · '+c.statusNew;\n}\nfunction beginOrResume(){\n if(!testName){document.getElementById('status').textContent=copy().statusNew;return}\n if(state&&state.completed){const previous=state.lastForm===undefined?state.formIndex:state.lastForm;state={formIndex:chooseForm(previous),answers:{},completed:false,lastForm:previous};}\n else if(!state){state={formIndex:chooseForm(null),answers:{},completed:false,lastForm:null};}\n saveState();\n if(state.completed&&state.scores){renderResults(state.scores,false);return}\n const rows=orderItems();questionIndex=rows.findIndex(x=>!Number.isInteger(Number(state.answers[x.id])));if(questionIndex<0)questionIndex=rows.length-1;\n document.getElementById('result-screen').dataset.newAttempt='false';showMode('quiz');renderQuestion();\n}\nfunction renderQuestion(){\n if(!state||!testName)return;\n const c=copy(),rows=orderItems(),item=rows[questionIndex];if(!item)return;\n document.getElementById('quiz-title').textContent=c.quizTitle;document.getElementById('form-label').textContent=currentFormLabel();\n document.getElementById('progress-track').setAt  助人者',th:'T2 ผู้ช่วยเหลือ',shortZh:'連結、支持、被需要',shortTh:'ความผูกพัน การสนับสนุน การเป็นที่ต้องการ',descZh:'重視關係與支持他人，也可能把自己的需要放到後面。自我觀察：你是否容易先注意別人的需要，再想到自己？',descTh:'ให้ความสำคัญกับความสัมพันธ์และการช่วยเหลือผู้อื่น บางครั้งอาจวางความต้องการของตนไว้ทีหลัง ลองสังเกตว่าคุณมักเห็นความต้องการของคนอื่นก่อนของตนเองหรือไม่'},\n{id:3,zh:'T3 成就者',th:'T3 ผู้มุ่งความสำเร็จ',shortZh:'成果、效率、肯定',shortTh:'ผลลัพธ์ ประสิทธิภาพ การยอมรับ',descZh:'重視目標、成果與有效行動，也可能在意他人如何看待自己的表現。自我觀察：成功是否常成為衡量自我價值的方式？',descTh:'ให้ความสำคัญกับเป้าหมาย ผลลัพธ์ และการลงมืออย่างมีประสิทธิภาพ อีกทั้งอาจใส่ใจว่าผู้อื่นมองผลงานอย่างไร ลองสังเกตว่าความสำเร็จมักเป็นตัววัดคุณค่าของตนหรือไม่'},\n{id:4,zh:'T4 個人風格者',th:'T4 ผู้แสวงหาเอกลักษณ์',shortZh:'真實、獨特、情感深度',shortTh:'ความจริงแท้ เอกลักษณ์ ความลึกซึ้งทางอารมณ์',descZh:'重視真實感、個人意義與獨特性，較常深入感受自己的情緒。自我觀察：你是否在意自己的經驗能否被真實表達？',descTh:'ให้ความสำคัญกับความจริงแท้ ความหมายส่วนตัว และเอกลักษณ์ มักสำรวจความรู้สึกของตนอย่างลึกซึ้ง ลองสังเกตว่าคุณใส่ใจว่าประสบการณ์ของตนได้แสดงออกอย่างจริงแท้หรือไม่'},\n{id:5,zh:'T5 探索者',th:'T5 นักสำรวจความรู้',shortZh:'理解、能力、界線',shortTh:'ความเข้าใจ ความสามารถ ขอบเขตส่วนตัว',descZh:'傾向先觀察與理解，再投入行動；也會保留時間與精力。自我觀察：你是否需要先弄懂事情，才覺得準備好參與？',descTh:'มักสังเกตและทำความเข้าใจก่อนลงมือ พร้อมรักษาเวลาและพลังงานของตน ลองสังเกตว่าคุณต้องเข้าใจเรื่องนั้นก่อนจึงรู้สึกพร้อมเข้าร่วมหรือไม่'},\n{id:6,zh:'T6 忠誠者',th:'T6 ผู้ภักดี',shortZh:'安全、可靠、預先考量',shortTh:'ความปลอดภัย ความไว้วางใจ การคาดการณ์ล่วงหน้า',descZh:'重視可靠關係與準備，會留意風險並確認支持來源。自我觀察：面對不確定時，你是否會先想可能出現的問題？',descTh:'ให้ความสำคัญกับความสัมพันธ์ที่ไว้ใจได้และการเตรียมพร้อม มักสังเกตความเสี่ยงและแหล่งสนับสนุน ลองสังเกตว่าเมื่อไม่แน่ใจ คุณคิดถึงปัญหาที่อาจเกิดขึ้นก่อนหรือไม่'},\n{id:7,zh:'T7 熱情者',th:'T7 ผู้กระตือรือร้น',shortZh:'可能性、選擇、愉悅',shortTh:'ความเป็นไปได้ ทางเลือก ความเพลิดเพลิน',descZh:'喜歡探索可能性與保留選擇，也可能較快把注意力轉向令人期待的事。自我觀察：你是否常用新計畫或新點子離開不舒服的感受？',descTh:'ชอบสำรวจความเป็นไปได้และเก็บทางเลือกไว้ อาจเปลี่ยนความสนใจไปหาสิ่งที่น่าตื่นเต้นได้เร็ว ลองสังเกตว่าคุณใช้แผนหรือไอเดียใหม่เพื่อหลีกจากความรู้สึกไม่สบายใจบ่อยหรือไม่'},\n{id:8,zh:'T8 挑戰者',th:'T8 ผู้ท้าทาย',shortZh:'自主、直接、保護界線',shortTh:'อิสระ การสื่อสารตรงไปตรงมา การปกป้องขอบเขต',descZh:'重視自主與直接表達，遇到越界時傾向採取行動，也可能保護較弱勢的人。自我觀察：你是否會迅速介入，避免自己或他人受控制？',descTh:'ให้ความสำคัญกับอิสระและการสื่อสารตรงไปตรงมา เมื่อมีการล้ำเส้นมักลงมือ และอาจปกป้องผู้ที่เปราะบางกว่า ลองสังเกตว่าคุณเข้าแทรกแซงเร็วเพื่อไม่ให้ตนหรือผู้อื่นถูกควบคุมหรือไม่'},\n{id:9,zh:'T9 和平者',th:'T9 ผู้รักความสงบ',shortZh:'和諧、穩定、接納',shortTh:'ความกลมกลืน ความมั่นคง การยอมรับ',descZh:'重視平和、穩定與接納他人，也可能延後自己的優先事項。自我觀察：為了維持和諧，你是否常把自己的意見放到後面？',descTh:'ให้ความสำคัญกับความสงบ ความมั่นคง และการยอมรับผู้อื่น บางครั้งอาจเลื่อนสิ่งสำคัญของตนออกไป ลองสังเกตว่าคุณมักเก็บความเห็นไว้ทีหลังเพื่อรักษาความกลมกลืนหรือไม่'}\n];\nconst ITEMS=[\n{id:1,t:1,d:1,zh:'我常注意一件事還能怎樣做得更正確或完善。',th:'ฉันมักสังเกตว่าสิ่งต่าง ๆ จะทำให้ถูกต้องหรือสมบูรณ์ขึ้นได้อย่างไร'},\n{id:2,t:1,d:1,zh:'即使沒有人監督，我也會依照自己認為正確的原則行事。',th:'แม้ไม่มีใครตรวจสอบ ฉันก็ทำตามหลักการที่คิดว่าถูกต้อง'},\n{id:3,t:1,d:1,zh:'犯錯時，我容易在心裡反覆檢討自己。',th:'เมื่อทำผิด ฉันมักทบทวนและตำหนิตนเองซ้ำ ๆ'},\n{id:4,t:1,d:-1,zh:'成果不夠完美時，我通常也能接受並停止修正。',th:'เมื่อผลงานยังไม่สมบูรณ์แบบ ฉันมักยอมรับได้และหยุดแก้ไข'},\n{id:5,t:1,d:-1,zh:'比起遵守固定標準，我更常彈性調整做法。',th:'ฉันมักปรับวิธีการอย่างยืดหยุ่น มากกว่ายึดมาตรฐานเดิม'},\n{id:6,t:1,d:-1,zh:'我很少因為表現不夠好而責備自己。',th:'ฉันแทบไม่ตำหนิตนเองเพราะทำได้ไม่ดีพอ'},\n{id:7,t:2,d:1,zh:'看到別人需要幫忙時，我通常會很快注意到。',th:'เมื่อเห็นผู้อื่นต้องการความช่วยเหลือ ฉันมักสังเกตเห็นได้เร็ว'},\n{id:8,t:2,d:1,zh:'能支持別人，會讓我覺得自己對關係很重要。',th:'การได้ช่วยเหลือผู้อื่นทำให้ฉันรู้สึกว่าตนมีความสำคัญต่อความสัมพันธ์'},\n{id:9,t:2,d:1,zh:'忙著照顧別人時，我有時會忽略自己真正需要什麼。',th:'เมื่อยุ่งกับการดูแลผู้อื่น บางครั้งฉันละเลยความต้องการที่แท้จริงของตน'},\n{id:10,t:2,d:-1,zh:'我能自在地請別人幫忙，不覺得這會降低自己的價值。',th:'ฉันขอความช่วยเหลือจากผู้อื่นได้อย่างสบายใจ โดยไม่รู้สึกว่าคุณค่าของตนลดลง'},\n{id:11,t:2,d:-1,zh:'即使別人可能失望，我也能直接拒絕不適合自己的請求。',th:'แม้อีกฝ่ายอาจผิดหวัง ฉันก็ปฏิเสธคำขอที่ไม่เหมาะกับตนได้ตรงไปตรงมา'},\n{id:12,t:2,d:-1,zh:'即使沒有人需要我，我仍然覺得自己有價值。',th:'แม้ไม่มีใครต้องการความช่วยเหลือจากฉัน ฉันก็ยังรู้สึกว่าตนมีคุณค่า'},\n{id:13,t:3,d:1,zh:'我習慣設定明確目標，並留意自己是否達成。',th:'ฉันมักตั้งเป้าหมายที่ชัดเจนและติดตามว่าตนทำได้หรือไม่'},\n{id:14,t:3,d:1,zh:'為了讓事情成功，我會調整自己的呈現方式來符合情境。',th:'เพื่อให้งานสำเร็จ ฉันปรับวิธีนำเสนอตนเองให้เหมาะกับสถานการณ์'},\n{id:15,t:3,d:1,zh:'當成果不理想時，我容易懷疑自己的價值或能力。',th:'เมื่อผลลัพธ์ไม่ดี ฉันมักสงสัยในคุณค่าหรือความสามารถของตน'},\n{id:16,t:3,d:-1,zh:'即使沒有人看見成果，我仍能感受到自己的價值。',th:'แม้ไม่มีใครเห็นผลงาน ฉันก็ยังรับรู้คุณค่าของตนได้'},\n{id:17,t:3,d:-1,zh:'我更在意做事的過程，不太需要別人肯定成果。',th:'ฉันใส่ใจกระบวนการมากกว่า และไม่ค่อยต้องการให้ผู้อื่นยืนยันผลสำเร็จ'},\n{id:18,t:3,d:-1,zh:'即使不符合他人的期待，我通常也不會改變自己的形象。',th:'แม้ไม่ตรงกับความคาดหวังของผู้อื่น ฉันมักไม่เปลี่ยนภาพลักษณ์ของตน'},\n{id:19,t:4,d:1,zh:'我很在意自己的生活是否呈現出獨特而真實的樣子。',th:'ฉันใส่ใจว่าชีวิตของตนสะท้อนความเป็นเอกลักษณ์และความจริงแท้หรือไม่'},\n{id:20,t:4,d:1,zh:'我常深入感受情緒，並思考它對我代表什麼。',th:'ฉันมักสัมผัสอารมณ์อย่างลึกซึ้งและคิดว่าอารมณ์นั้นมีความหมายอย่างไร'},\n{id:21,t:4,d:1,zh:'我有時會特別留意自己缺少了什麼，或與別人有何不同。',th:'บางครั้งฉันใส่ใจเป็นพิเศษว่าตนขาดอะไรหรือแตกต่างจากผู้อื่นอย่างไร'},\n{id:22,t:4,d:-1,zh:'我通常能接受平凡日常，不需要特別與眾不同。',th:'ฉันมักยอมรับชีวิตประจำวันธรรมดาได้ โดยไม่จำเป็นต้องแตกต่างเป็นพิเศษ'},\n{id:23,t:4,d:-1,zh:'我不太需要透過外表或作品表達自己的獨特性。',th:'ฉันไม่ค่อยจำเป็นต้องแสดงเอกลักษณ์ของตนผ่านภาพลักษณ์หรือผลงาน'},\n{id:24,t:4,d:-1,zh:'情緒出現後，我通常能讓它自然過去，不反覆沉浸其中。',th:'เมื่ออารมณ์เกิดขึ้น ฉันมักปล่อยให้ผ่านไปโดยไม่จมอยู่กับมันซ้ำ ๆ'},\n{id:25,t:5,d:1,zh:'投入一件事前，我通常想先弄清楚它如何運作。',th:'ก่อนลงมือทำสิ่งหนึ่ง ฉันมักอยากเข้าใจว่ามันทำงานอย่างไร'},\n{id:26,t:5,d:1,zh:'我會保留獨處時間，讓自己恢復精力並整理想法。',th:'ฉันจัดเวลาอยู่คนเดียวเพื่อฟื้นพลังและจัดระเบียบความคิด'},\n{id:27,t:5,d:1,zh:'面對新任務時，我會擔心自己是否具備足夠知識或能力。',th:'เมื่อเจองานใหม่ ฉันกังวลว่าตนมีความรู้หรือความสามารถเพียงพอหรือไม่'},\n{id:28,t:5,d:-1,zh:'即使資訊不完整，我通常也能先投入並邊做邊學。',th:'แม้ข้อมูลยังไม่ครบ ฉันก็มักเริ่มลงมือและเรียนรู้ระหว่างทางได้'},\n{id:29,t:5,d:-1,zh:'長時間與人互動通常會讓我更有精神。',th:'การมีปฏิสัมพันธ์กับผู้คนเป็นเวลานานมักทำให้ฉันมีพลังมากขึ้น'},\n{id:30,t:5,d:-1,zh:'我很少需要預先保留時間、精力或個人空間。',th:'ฉันแทบไม่จำเป็นต้องสำรองเวลา พลังงาน หรือพื้นที่ส่วนตัวไว้ล่วงหน้า'},\n{id:31,t:6,d:1,zh:'面對不確定情況時，我會先想想可能出現的風險。',th:'เมื่อเผชิญสถานการณ์ไม่แน่นอน ฉันมักคิดถึงความเสี่ยงที่อาจเกิดขึ้นก่อน'},\n{id:32,t:6,d:1,zh:'重要決定做下去前，我常會向信任的人確認想法。',th:'ก่อนตัดสินใจเรื่องสำคัญ ฉันมักตรวจสอบความคิดกับคนที่ไว้ใจ'},\n{id:33,t:6,d:1,zh:'我很重視可靠的團隊，也會努力履行對團隊的承諾。',th:'ฉันให้ความสำคัญกับทีมที่ไว้ใจได้และพยายามรักษาคำมั่นที่ให้ไว้'},\n{id:34,t:6,d:-1,zh:'即使無法確定所有細節，我通常也能相信自己的判斷。',th:'แม้ยังไม่แน่ใจทุกรายละเอียด ฉันก็มักเชื่อการตัดสินใจของตนได้'},\n{id:35,t:6,d:-1,zh:'我很少預先想像事情可能出錯的情況。',th:'ฉันแทบไม่คิดล่วงหน้าถึงสิ่งที่อาจผิดพลาด'},\n{id:36,t:6,d:-1,zh:'比起尋找支持與確認，我更習慣獨自承擔風險。',th:'ฉันมักรับความเสี่ยงด้วยตนเอง มากกว่ามองหาการสนับสนุนหรือการยืนยัน'},\n{id:37,t:7,d:1,zh:'遇到限制時，我會很快想到其他可能的選擇。',th:'เมื่อเจอข้อจำกัด ฉันมักคิดถึงทางเลือกอื่นได้อย่างรวดเร็ว'},\n{id:38,t:7,d:1,zh:'我喜歡安排讓人期待的新活動或新計畫。',th:'ฉันชอบวางแผนกิจกรรมหรือโครงการใหม่ที่ทำให้อยากตั้งตารอ'},\n{id:39,t:7,d:1,zh:'感到難受時，我容易轉移注意力去想更愉快的事。',th:'เมื่อรู้สึกไม่สบายใจ ฉันมักเปลี่ยนความสนใจไปคิดถึงสิ่งที่เพลิดเพลินกว่า'},\n{id:40,t:7,d:-1,zh:'遇到難受情緒時，我願意先停下來感受，不急著轉移注意。',th:'เมื่อมีอารมณ์ไม่สบายใจ ฉันยอมพักเพื่อรับรู้อารมณ์นั้นโดยไม่รีบเปลี่ยนความสนใจ'},\n{id:41,t:7,d:-1,zh:'我能安心接受選項有限、短期內不會改變的安排。',th:'ฉันยอมรับแผนที่มีตัวเลือกจำกัดและไม่เปลี่ยนแปลงในระยะสั้นได้อย่างสบายใจ'},\n{id:42,t:7,d:-1,zh:'即使事情重複或不有趣，我也能持續做到完成。',th:'แม้งานจะซ้ำหรือไม่น่าสนใจ ฉันก็ทำต่อเนื่องจนเสร็จได้'},\n{id:43,t:8,d:1,zh:'有人越過我的界線時，我通常會直接說明並採取行動。',th:'เมื่อมีคนล้ำเส้น ฉันมักชี้แจงตรง ๆ และลงมือจัดการ'},\n{id:44,t:8,d:1,zh:'看到重要的人受到不公平對待，我會想介入保護他們。',th:'เมื่อเห็นคนสำคัญถูกปฏิบัติอย่างไม่เป็นธรรม ฉันอยากเข้าไปปกป้อง'},\n{id:45,t:8,d:1,zh:'我很在意自己能否掌握影響自身生活的決定。',th:'ฉันใส่ใจว่าตนควบคุมการตัดสินใจที่ส่งผลต่อชีวิตของตนได้หรือไม่'},\n{id:46,t:8,d:-1,zh:'即使界線被越過，我也常選擇不提，以免發生衝突。',th:'แม้มีคนล้ำเส้น ฉันก็มักไม่พูดเพื่อหลีกเลี่ยงความขัดแย้ง'},\n{id:47,t:8,d:-1,zh:'即使不同意，我通常也願意讓別人替我做重要決定。',th:'แม้ไม่เห็นด้วย ฉันก็มักยอมให้ผู้อื่นตัดสินใจเรื่องสำคัญแทน'},\n{id:48,t:8,d:-1,zh:'我會壓下自己的需要，避免被看成太強勢。',th:'ฉันเก็บกดความต้องการของตนเพื่อไม่ให้ถูกมองว่าแข็งกร้าวเกินไป'},\n{id:49,t:9,d:1,zh:'意見不一致時，我會先想辦法維持彼此的和諧。',th:'เมื่อความคิดเห็นไม่ตรงกัน ฉันมักหาทางรักษาความกลมกลืนระหว่างกันก่อน'},\n{id:50,t:9,d:1,zh:'我很容易配合別人的步調，有時忘了自己原本想做什麼。',th:'ฉันปรับตามจังหวะของผู้อื่นได้ง่าย บางครั้งจึงลืมสิ่งที่ตนตั้งใจทำ'},\n{id:51,t:9,d:1,zh:'為了避免爭執，我可能會把自己的優先事項往後延。',th:'เพื่อหลีกเลี่ยงการโต้เถียง ฉันอาจเลื่อนสิ่งสำคัญของตนออกไปก่อน'},\n{id:52,t:9,d:-1,zh:'即使可能引起不同意見，我也會清楚說出自己的偏好。',th:'แม้อาจทำให้เกิดความเห็นต่าง ฉันก็พูดความต้องการของตนให้ชัดเจน'},\n{id:53,t:9,d:-1,zh:'遇到需要處理的分歧，我通常會儘快提出來討論。',th:'เมื่อมีความเห็นต่างที่ต้องจัดการ ฉันมักหยิบยกขึ้นมาคุยโดยเร็ว'},\n{id:54,t:9,d:-1,zh:'比起維持和諧，我更常優先追求自己的目標。',th:'ฉันมักให้เป้าหมายของตนสำคัญกว่าการรักษาความกลมกลืน'}\n];\nfunction seededRandom(seed){let n=seed>>>0;return function(){n+=0x6D2B79F5;let t=n;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}\nfunction shuffled(a,rng){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}\nfunction buildOrder(seed){const rng=seededRandom(seed),groups={};for(let t=1;t<=9;t++)groups[t]=shuffled(ITEMS.filter(x=>x.t===t).map(x=>x.id-1),rng);const types=shuffled(Array.from({length:9},(_,i)=>i+1),rng),out=[];for(let row=0;row<6;row++)for(let col=0;col<9;col++)out.push(groups[types[(col+row)%9]][row]);return out}\nconst FORM_ORDERS=[buildOrder(5931),buildOrder(20116),buildOrder(82025)];\nfunction scoreAnswers(a){const missing=ITEMS.filter(x=>!Number.isInteger(Number(a[x.id]))||Number(a[x.id])<1||Number(a[x.id])>5).map(x=>x.id);if(missing.length)return{complete:false,missing};const scores={};for(let t=1;t<=9;t++){const group=ITEMS.filter(x=>x.t===t),sum=group.reduce((z,x)=>z+(x.d===1?Number(a[x.id]):6-Number(a[x.id])),0);scores[t]={sum,mean:sum/group.length}}return{complete:true,scores}}\nfunction chooseForm(previous,random){const rng=random||Math.random,choices=[0,1,2].filter(x=>x!==previous);return choices[Math.min(choices.length-1,Math.floor(rng()*choices.length))]}\nfunction summaryFor(scores,formIndex){const ordered=Array.from({length:9},(_,i)=>({type:i+1,...scores[i+1]})).sort((a,b)=>b.mean-a.mean||a.type-b.type),top=ordered[0].mean,leaders=ordered.filter(x=>x.mean===top).map(x=>x.type),second=ordered.find(x=>x.mean<top),gap=second?top-second.mean:0,profile=Array.from({length:9},(_,i)=>(i+1)+'='+scores[i+1].mean.toFixed(2)).join(',');return 'F'+(formIndex+1)+' T'+leaders.join('/')+' Δ'+gap.toFixed(2)+' '+profile}\nwindow.ENNEAGRAM_TEST_API={TYPES:TYPES,ITEMS:ITEMS,FORM_ORDERS:FORM_ORDERS,scoreAnswers:scoreAnswers,chooseForm:chooseForm,summaryFor:summaryFor};\nconst COPY={\nzh:{\n pageTitle:'九型人格自我探索',brand:'九型人格自我探索',brandSub:'原創反思題組 · 9 個分數',languageLabel:'語言切換',progressAria:'作答進度',rangeAria:'平均分範圍 1 至 5',eyebrow:'類型學反思 · 不是診斷工具',title:'九型人格探索',intro:'以 54 個原創自我描述，回顧九種常見的動機與應對模式。完成後會顯示九個向度的分數、領先候選與分差，請再對照自己的長期經驗。',\n itemBadge:'54 題 · 9 個向度',formBadge:'3 種隨機題序 · 同一題庫',scaleBadge:'每型 6 題 · 1–5 分',\n howTitle:'作答方式與計分',howCopy:'請根據過去一段時間反覆出現的習慣作答，不要以理想中的自己為準。每型有 6 題，其中 3 題反向計分；反向題使用 6 − 作答分數。每型顯示 6–30 原始總分及 1.0–5.0 平均分，九型等量計分。',\n typePreview:TYPES.map(x=>[x.zh,x.shortZh]),\n validity:'重要說明：沒有一份全球通用的九型人格「官方試卷」。這是原創自我反思題組，並非 RHETI、ETASI 或經驗證的中泰文量表。三套只改題目順序，不是三份已驗證的平行試卷。',\n start:'開始 54 題',resume:'繼續未完成測驗',retest:'重新測驗（抽另一題序）',statusNew:'請依照通常而非理想中的自己作答。',statusName:'測驗者：',statusResume:'已儲存未完成作答，將從未答題繼續。',statusDone:'已有完成結果；重新測驗會抽取另一題序。',\n methodTitle:'量表來源、計分與證據限制',methodBody:'<p>現代九型人格有多種傳統與量表，沒有統一的官方題庫或計分法。常見的 Riso-Hudson RHETI 是 Enneagram Institute 的註冊商品測驗，採 144 組配對敘述；本頁沒有複製 RHETI 題目或宣稱等同其結果。<\/p><ul><li>本頁題目為原創整理，參照九型常用的核心動機描述；每型 6 題、3 正向鍵及 3 反向鍵，計分鍵在程式中固定並可檢查。<\/li><li>正向題按 1–5 計分；反向題以 6 − 原作答換算；每型總分 6–30，平均分 1.0–5.0。<\/li><li>三個隨機題本只改變同一題庫的呈現次序。題目與分數定義不變，仍未構成心理計量上等值的平行題本。<\/li><li>2021 系統性回顧涵蓋 104 個獨立樣本，指出信效度結果混合、常見因素分析得到少於九個因素，翼型與型態移動的證據較少。<\/li><li>已發表的土耳其 ETASI 研究使用 69 題型別與 30 題副型題本；其結果只適用該工具與樣本，不能驗證本頁自編中泰文字。< &&state)try{localStorage.setItem(storageKey(),JSON.stringify(state))}catch{}}\nfunction orderItems(){return FORM_ORDERS[state.formIndex].map(i=>ITEMS[i])}\nfunction formName(){return copy().formPrefix+' '+(state.formIndex+1)+'/3'}\nfunction showMode(next){mode=next;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(next+'-screen').classList.add('active')}\nfunction setLabels(){\n const c=copy();document.documentElement.lang=lang==='zh'?'zh-Hant':'th';document.title=c.pageTitle;\n document.getElementById('brand-title').textContent=c.brand;document.getElementById('brand-sub').textContent=c.brandSub;document.getElementById('language-switch').setAttribute('aria-label',c.languageLabel);document.getElementById('eyebrow').textContent=c.eyebrow;document.getElementById('main-title').textContent=c.title;document.getElementById('intro-copy').textContent=c.intro;\n document.getElementById('item-badge').textContent=c.itemBadge;document.getElementById('form-badge').textContent=c.formBadge;document.getElementById('scale-badge').textContent=c.scaleBadge;document.getElementById('how-title').textContent=c.howTitle;document.getElementById('how-copy').textContent=c.howCopy;document.getElementById('validity-note').textContent=c.validity;\n document.getElementById('type-preview').innerHTML=c.typePreview.map(x=>'<div class=\"type-chip\"><b>'+x[0]+'<\/b><span>'+x[1]+'<\/span><\/div>').join('');\n document.getElementById('method-title').textContent=c.methodTitle;document.getElementById('method-body').innerHTML=c.methodBody;\n document.getElementById('source-types').textContent=c.sourceTypes;document.getElementById('source-rheti').textContent=c.sourceRheti;document.getElementById('source-review').textContent=c.sourceReview;document.getElementById('source-etasi').textContent=c.sourceEtasi;\n document.getElementById('home-button').textContent=c.returnHome;document.getElementById('home-button').setAttribute('aria-label',c.returnHome);document.getElementById('footer-copy').textContent=c.footer;\n document.getElementById('result-source-types').textContent=c.sourceTypes;document.getElementById('result-source-review').textContent=c.sourceReview;document.getElementById('result-method-title').textContent=c.resultMethod;\n document.getElementById('start-button').textContent=state?(state.completed?c.retest:c.resume):c.start;\n document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));\n if(mode==='quiz'&&state)renderQuestion();if(mode==='result'&&state&&state.scores)renderResults(state.scores,document.getElementById('result-screen').dataset.newAttempt==='true');\n}\nfunction updateStatus(){const c=copy(),el=document.getElementById('status');if(!testName){el.textContent=c.statusNew;return}if(!state){el.textContent=c.statusName+testName+' · '+c.statusNew;return}const n=Object.keys(state.answers||{}).length;if(state.completed){el.textContent=c.statusName+testName+' · '+c.statusDone;return}el.textContent=c.statusName+testName+' · '+(n?c.statusResume+' ('+n+'/54)':c.statusNew)}\nfunction beginOrResume(){if(!testName)return;if(state&&state.completed){const prev=state.lastForm===undefined?state.formIndex:state.lastForm;state={formIndex:chooseForm(prev),answers:{},completed:false,lastForm:prev}}else if(!state){state={formIndex:chooseForm(null),answers:{},completed:false,lastForm:null}}saveState();const rows=orderItems();questionIndex=rows.findIndex(x=>!Number.isInteger(Number(state.answers[x.id])));if(questionIndex<0)questionIndex=rows.length-1;document.getElementById('result-screen').dataset.newAttempt='false';showMode('quiz');renderQuestion()}\nfunction renderQuestion(){if(!state||!testName)return;const c=copy(),rows=orderItems(),item=rows[questionIndex];document.getElementById('quiz-title').textContent=c.quizTitle;document.getElementById('form-label').textContent=formName();document.getElementById('progress-track').setAttribute('aria-label',c.progressAria);document.getElementById('progress-label').textContent=c.progress+' '+(questionIndex+1)+c.of;document.getElementById('question-number').textContent=c.question+' '+(questionIndex+1)+' / 54';document.getElementById('question-text').textContent=item[lang];document.getElementById('progress-bar').style.width=(Object.keys(state.answers).length/54*100)+'%';const selected=Number(state.answers[item.id]||0),options=document.getElementById('options');options.innerHTML=c.anchors.map((label,i)=>'<button class=\"option'+(selected===i+1?' selected':'')+'\" type=\"button\" data-answer=\"'+(i+1)+'\" aria-pressed=\"'+String(selected===i+1)+'\"><span class=\"num\">'+(i+1)+'<\/span><small>'+label+'<\/small><\/button>').join('');options.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{state.answers[item.id]=Number(b.dataset.answer);saveState();renderQuestion()}));const prev=document.getElementById('previous-button'),next=document.getElementById('next-button');prev.textContent=c.prev;prev.disabled=questionIndex===0;next.textContent=questionIndex===53?c.finish:c.next;next.disabled=!selected;document.getElementById('quiz-note').textContent=c.quizNote}\nfunction currentSummary(scores,form){return summaryFor(scores,form)}\nfunction renderResults(scores,newAttempt){const c=copy(),ordered=Array.from({length:9},(_,i)=>({type:i+1,...scores[i+1]})).sort((a,b)=>b.mean-a.mean||a.type-b.type),top=ordered[0].mean,leaders=ordered.filter(x=>x.mean===top),second=ordered.find(x=>x.mean<top),gap=second?top-second.mean:0;showMode('result');document.getElementById('result-screen').dataset.newAttempt=newAttempt?'true':'false';document.getElementById('result-code').textContent=currentSummary(scores,state.formIndex);document.getElementById('result-title').textContent=leaders.length>1?c.leadTie+': '+leaders.map(x=>TYPES[x.type-1][lang]).join(' / '):c.leadOne+': '+TYPES[leaders[0].type-1][lang];document.getElementById('result-subtitle').textContent=c.gapLabel+' '+gap.toFixed(1)+' · '+(second let lang='zh',active='';const frames=Object.fromEntries(ORDER.map(key=>[key,document.getElementById('frame-'+key)]));const frameLoading=Object.fromEntries(ORDER.map(key=>[key,false]));
function setLang(next,notify=true){lang=next==='th'?'th':'zh';document.documentElement.lang=lang==='zh'?'zh-Hant':'th';document.title=lang==='zh'?'Austin陪你探索性格｜CET QA':'Austin พาสำรวจบุคลิกภาพ｜CET QA';document.querySelector('.lang-switch').setAttribute('aria-label',lang==='zh'?'語言切換':'เลือกภาษา');document.getElementById('austin-desc').textContent=lang==='zh'?'Austin，友善微胖的男性品管經理，戴眼鏡、平頭，穿白色短袖襯衫、西裝褲與皮鞋。':'Austin ผู้จัดการคุณภาพชายรูปร่างท้วมเล็กน้อย สวมแว่นตา ผมสั้น เสื้อเชิ้ตแขนสั้นสีขาว กางเกงสแลค และรองเท้าหนัง';const c=COPY[lang];document.querySelectorAll('[data-home-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.homeLang===lang)));document.getElementById('brand-sub').textContent=c.brand;document.getElementById('welcome').innerHTML=c.welcome;document.getElementById('caption').textContent=c.caption;document.getElementById('eyebrow').textContent=c.eyebrow;document.getElementById('headline').innerHTML=c.headline;document.getElementById('lead').textContent=c.lead;document.getElementById('learning-title').textContent=c.learningTitle;document.getElementById('history-lens').textContent=c.historyLens;document.getElementById('history-card-title').textContent=c.historyTitle;document.getElementById('history-card-copy').textContent=c.historyCopy;document.getElementById('history-reset').textContent=c.historyReset;document.getElementById('offline-label').textContent=c.offline;document.getElementById('version-label').textContent=c.version;ORDER.forEach((key,i)=>{document.getElementById('lens-'+key).textContent=c.lens[key];document.getElementById('name-'+key).textContent=c.name[key];document.getElementById('copy-'+key).textContent=c.copy[key];document.getElementById('edu-title-'+(i+1)).textContent=c.eduTitle[i];document.getElementById('edu-copy-'+(i+1)).textContent=c.eduCopy[i]});if(notify)for(const f of Object.values(frames))f.contentWindow?.postMessage({austinExplorer:'set-language',lang},'*');}
const HISTORY_KEY='austin-personality-history-v1',NAME_KEY='austin-personality-name-v1';let pendingModel='',currentTestName='',memoryHistory=[],lastCapturedSignature='';
function getHistory(){try{const raw=localStorage.getItem(HISTORY_KEY);if(raw){const rows=JSON.parse(raw);if(Array.isArray(rows)){memoryHistory=rows.slice(0,20);return memoryHistory}}}catch{}return memoryHistory.slice(0,20)}
function saveHistory(rows){memoryHistory=rows.slice(0,20);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(memoryHistory))}catch{}}
function recordTestResult(model,result,name=currentTestName){const value=String(result||'').trim().slice(0,100);if(!value)return;const signature=model+'|'+String(name||'')+'|'+value;if(signature===lastCapturedSignature)return;lastCapturedSignature=signature;const rows=getHistory();rows.unshift({name:String(name||''),model,result:value,date:new Intl.DateTimeFormat(lang==='zh'?'zh-TW':'th-TH',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())});saveHistory(rows);refreshHistory()}
function pollCurrentResult(){if(!active||frameLoading[active])return;let doc;try{doc=frames[active].contentDocument}catch{return}if(!doc)return;if((active==='bigfive'||active==='enneagram'||active==='riasec')&&doc.querySelector('#result-screen.active')?.dataset.newAttempt!=='true')return;let summary='';if(active==='zodiac'){const result=doc.querySelector('#result.show');summary=result?.querySelector('.titleline h2')?.textContent?.trim()||result?.querySelector('h2')?.textContent?.trim()||''}else{const screen=doc.querySelector('#result-screen.active'),hero=screen?.querySelector('#result-hero');summary=hero?.querySelector('.type-code,.primary-code')?.textContent?.trim()||hero?.querySelector('.type-title,.primary-title')?.textContent?.trim()||''}if(!summary){lastCapturedSignature='';return}recordTestResult(active,summary,currentTestName);if(active==='bigfive'||active==='enneagram'||active==='riasec'){const screen=doc.querySelector('#result-screen.active');if(screen)screen.dataset.newAttempt='false'}}
window.setInterval(pollCurrentResult,500);
function readName(){try{return localStorage.getItem(NAME_KEY)||''}catch{return ''}}
function saveName(value){try{localStorage.setItem(NAME_KEY,value)}catch{}}
function refreshHistory(){document.getElementById('history-status').textContent='';const rows=getHistory();document.getElementById('history-count').textContent=String(rows.length);const c=COPY[lang],target=document.getElementById('history-content');if(!rows.length){target.innerHTML='<div class="history-empty">'+c.historyEmpty+'</div>';return}const headers=c.historyHeaders.map(x=>'<th>'+escapeHtml(x)+'</th>').join('');const body=rows.map(x=>'<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(c.models[x.model]||x.model)+'</td><td><b>'+escapeHtml(x.result)+'</b></td><td>'+escapeHtml(x.date)+'</td></tr>').join('');target.innerHTML='<div class="history-table-wrap"><table class="history-table"><thead><tr>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div>'}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showNameDialog(key){pendingModel=key;const c=COPY[lang];document.getElementById('name-dialog-title').textContent=c.nameTitle;document.getElementById('name-dialog-copy').textContent=c.nameCopy;document.getElementById('name-label').textContent=c.nameLabel;document.getElementById('test-name').placeholder=c.namePlaceholder;document.getElementById('name-cancel').textContent=c.nameCancel;document.getElementById('name-submit').textContent=c.nameStart;document.getElementById('name-error').textContent='';document.getElementById('test-name').value='';document.getElementById('name-dialog').hidden=false;setTimeout(()=>document.getElementById('test-name').focus(),20)}
function openApp(key,name){active=key;currentTestName=name;lastCapturedSignature='';frameLoading[key]=true;setGlobalReturnLabel();document.getElementById('home-view').hidden=true;document.getElementById('app-view').classList.add('active');for(const [model,f] of Object.entries(frames))f.classList.toggle('active',model===key);frames[key].title=COPY[lang].name[key];frames[key].srcdoc=PAGES[key]}
function returnHome(){pollCurrentResult();active='';document.getElementById('app-view').classList.remove('active');document.getElementById('home-view').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
const globalReturn=document.getElementById('global-return');
function setGlobalReturnLabel(){globalReturn.textContent=lang==='th'?'กลับหน้าแรก':'返回標題';globalReturn.setAttribute('aria-label',globalReturn.textContent)}
function syncGlobalReturn(){if(!active)return;const frame=frames[active],button=globalReturn;let left=null;try{const doc=frame.contentDocument;const languageControl=doc?.querySelector('.lang')||doc?.getElementById('language-button');if(languageControl){const r=languageControl.getBoundingClientRect(),w=button.getBoundingClientRect().width;left=r.left-w-12;if(left<8)left=r.right+12;left=Math.max(8,Math.min(left,window.innerWidth-w-8))}}catch{}if(left===null){button.style.left='auto';button.style.right='12px'}else{button.style.left=left+'px';button.style.right='auto'}button.style.top='12px'}
globalReturn.addEventListener('click',returnHome);window.addEventListener('resize',syncGlobalReturn);
document.querySelectorAll('[data-home-lang]').forEach(b=>b.addEventListener('click',()=>{setLang(b.dataset.homeLang);refreshHistory()}));
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>showNameDialog(b.dataset.open)));
document.getElementById('name-cancel').addEventListener('click',()=>{document.getElementById('name-dialog').hidden=true;pendingModel=''});
document.getElementById('name-form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('test-name').value.trim();if(!name){document.getElementById('name-error').textContent=COPY[lang].nameRequired;return}saveName(name);document.getElementById('name-dialog').hidden=true;openApp(pendingModel,name);pendingModel=''});
document.getElementById('open-history').addEventListener('click',()=>{refreshHistory();document.getElementById('history-title').textContent=COPY[lang].historyTitle;document.getElementById('history-close').textContent=COPY[lang].historyClose;document.getElementById('history-reset').textContent=COPY[lang].historyReset;document.getElementById('history-dialog').hidden=false});
document.getElementById('history-close').addEventListener('click',()=>document.getElementById('history-dialog').hidden=true);
document.getElementById('history-reset').addEventListener('click',()=>{try{localStorage.removeItem(HISTORY_KEY)}catch{}memoryHistory=[];lastCapturedSignature='';refreshHistory();document.getElementById('history-status').textContent=COPY[lang].historyResetDone});
document.getElementById('history-dialog').addEventListener('click',e=>{if(e.target.id==='history-dialog')e.currentTarget.hidden=true});
window.addEventListener('message',event=>{const key=Object.keys(frames).find(k=>frames[k].contentWindow===event.source);if(!key||!event.data||!event.data.austinExplorer)return;if(event.data.austinExplorer==='return-title')returnHome();if(event.data.austinExplorer==='language-change'){setLang(event.data.lang);refreshHistory();setGlobalReturnLabel();syncGlobalReturn()}if(event.data.austinExplorer==='test-result'&&event.data.model===key)recordTestResult(key,event.data.result,currentTestName||event.data.name||'')});
for(const key of ORDER){const f=frames[key];f.addEventListener('load',()=>{frameLoading[key]=false;f.contentWindow.postMessage({austinExplorer:'set-language',lang},'*');if(active===key)f.contentWindow.postMessage({austinExplorer:'set-test-name',name:currentTestName},'*');setTimeout(syncGlobalReturn,100)});f.srcdoc=PAGES[key]}
setLang('zh',false);refreshHistory();
</script>
</body></html>
