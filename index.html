ฒนธรรม)\"),\nsubmit:B(\"查看我的星象性格\",\"ดูโปรไฟล์นิสัยของฉัน\"),privacy:B(\"只在本機瀏覽器運算，不會送出或儲存輸入資料。\",\"ประมวลผลในเบราว์เซอร์นี้เท่านั้น ไม่มีการส่งหรือบันทึกข้อมูลที่กรอก\"),\nheroFoot:B(\"✧ 十二星座的象徵圖譜 · 離線也能探索 ✧\",\"✧ แผนภาพสัญลักษณ์จักรราศีทั้ง 12 · สำรวจได้แม้ออฟไลน์ ✧\"),\nnoteTitle:B(\"先說清楚：這是文化型自我探索內容。\",\"โปรดทราบ: เนื้อหานี้เป็นการสำรวจตัวเองผ่านวัฒนธรรม\"),\nnoteText:B(\"星座與血型可提供有趣的敘事角度，但研究沒有證明它們能可靠判斷個人性格。日期區間與每日提示是傳統占星的娛樂性整理，不是經驗測量值。\",\"ราศีและกรุ๊ปเลือดเป็นมุมมองเล่าเรื่องที่สนุกได้ แต่งานวิจัยยังไม่ยืนยันว่าใช้ระบุนิสัยได้อย่างน่าเชื่อถือ ช่วงวันและคำใบ้รายวันเรียบเรียงเพื่อความบันเทิง ไม่ใช่ค่าจากการทดลอง\"),\nsourcesTitle:B(\"內容來源與可信度界線\",\"แหล่งข้อมูลและขอบเขตความน่าเชื่อถือ\"),\nsourcesIntro:B(\"星座段落整理自常見西洋熱帶黃道的象徵描述；血型段落呈現流行文化印象。網站沒有蒐集個人資料，也沒有聲稱建立統計模型。\",\"คำบรรยายราศีเรียบเรียงจากสัญลักษณ์จักรราศีเขตร้อนแบบตะวันตก ส่วนกรุ๊ปเลือดสะท้อนภาพจำในวัฒนธรรม เว็บไซต์ไม่ได้เก็บข้อมูลส่วนบุคคลหรืออ้างว่าสร้างแบบจำลองสถิติ\"),\nsourcesFoot:B(\"Joshanloo（2024）使用美國全國代表性資料 N=12,791，未發現星座與多項幸福感指標的穩健關聯。Kang 與 Park（2014）分析日本與美國超過一萬人的調查，68 個人格題項中 65 項差異不顯著，血型解釋人格變異低於 0.3%。這些研究不是對每個個人的判決，但不支持把星座或血型當成有效人格預測工具。\",\"Joshanloo (2024) ใช้ข้อมูลตัวแทนระดับประเทศของสหรัฐฯ N=12,791 และไม่พบความสัมพันธ์มั่นคงระหว่างราศีกับตัวชี้วัดความเป็นอยู่หลายด้าน Kang และ Park (2014) วิเคราะห์แบบสำรวจญี่ปุ่นและสหรัฐฯ มากกว่า 10,000 คน พบว่า 65 จาก 68 ข้อไม่แตกต่างอย่างมีนัยสำคัญ และกรุ๊ปเลือดอธิบายความแปรปรวนบุคลิกภาพได้น้อยกว่า 0.3% งานเหล่านี้ไม่ใช่คำตัดสินรายบุคคล แต่ไม่สนับสนุนให้ใช้ราศีหรือกรุ๊ปเลือดทำนายนิสัยอย่างแม่นยำ\"),\nwallTitle:B(\"十二星座圖鑑\",\"คู่มือจักรราศีทั้ง 12\"),wallSub:B(\"採常見西洋熱帶星座範圍；交界日會因年份與出生時間略有差異。\",\"ใช้ช่วงวันตามราศีเขตร้อนแบบตะวันตก วันคาบเกี่ยวอาจต่างกันตามปีและเวลาเกิด\"),footer:B(\"做個有趣的參考，最後仍由你定義自己。\",\"ใช้เป็นมุมมองสนุกๆ และให้คุณเป็นผู้กำหนดตัวตนของตัวเอง\"),\nreport:B(\"你的星象性格探索報告\",\"รายงานสำรวจนิสัยจากดวงดาว\"),core:B(\"核心氣質\",\"แก่นบุคลิก\"),strengths:B(\"閃光優勢\",\"จุดแข็ง\"),growth:B(\"成長盲點\",\"จุดที่พัฒนาได้\"),values:B(\"價值觀與內在驅動\",\"คุณค่าและแรงขับภายใน งออก และการสำรวจอย่างเปิดกว้าง\",\"descZh\":\"偏好創作、表達想法，或在開放情境中嘗試不同做法。這描述活動喜好，不代表藝術天分。\",\"descTh\":\"สนใจสร้างสรรค์ ถ่ายทอดความคิด หรือทดลองวิธีต่าง ๆ ในสถานการณ์ที่เปิดกว้าง คำอธิบายนี้หมายถึงความชอบ ไม่ใช่พรสวรรค์ทางศิลปะ\"},{\"code\":\"S\",\"zh\":\"S 社會型\",\"th\":\"S แบบช่วยเหลือและทำงานกับผู้คน\",\"shortZh\":\"教學、協助與合作\",\"shortTh\":\"การสอน การช่วยเหลือ และความร่วมมือ\",\"descZh\":\"偏好協助、教導、分享資訊與和人合作，重視互動本身。這描述活動喜好，不代表人際能力高低。\",\"descTh\":\"สนใจช่วยเหลือ สอน แบ่งปันข้อมูล และทำงานร่วมกับผู้อื่น โดยให้ความสำคัญกับการมีปฏิสัมพันธ์ คำอธิบายนี้หมายถึงความชอบ ไม่ใช่ระดับทักษะด้านมนุษยสัมพันธ์\"},{\"code\":\"E\",\"zh\":\"E 企業／進取型\",\"th\":\"E แบบริเริ่มและชักจูง\",\"shortZh\":\"倡議、領導與推動\",\"shortTh\":\"การริเริ่ม การนำ และการผลักดัน\",\"descZh\":\"偏好提出主張、影響決策、組織人力或推動計畫。這描述活動喜好，不代表職位適任性或管理能力。\",\"descTh\":\"สนใจเสนอแนวคิด โน้มน้าวการตัดสินใจ จัดทีม หรือผลักดันโครงการ คำอธิบายนี้หมายถึงความชอบ ไม่ใช่ความเหมาะสมกับตำแหน่งหรือความสามารถในการบริหาร\"},{\"code\":\"C\",\"zh\":\"C 事務／組織型\",\"th\":\"C แบบจัดระบบและข้อมูล\",\"shortZh\":\"資料、程序與細節\",\"shortTh\":\"ข้อมูล ขั้นตอน และรายละเอียด\",\"descZh\":\"偏好整理資料、依循清楚程序與檢查細節，讓工作有秩序地完成。這描述活動喜好，不代表僵化或行政能力。\",\"descTh\":\"สนใจจัดข้อมูล ทำตามขั้นตอนที่ชัดเจน และตรวจรายละเอียดเพื่อให้งานเสร็จอย่างเป็นระบบ คำอธิบายนี้หมายถึงความชอบ ไม่ได้แปลว่ายึดติดหรือมีความสามารถงานธุรการ\"}];\nconst ITEMS=[{\"id\":1,\"t\":\"R\",\"zh\":\"我喜歡使用工具或設備，把一件實物修好或組裝完成。\",\"th\":\"ฉันชอบใช้เครื่องมือหรืออุปกรณ์เพื่อซ่อมหรือประกอบสิ่งของให้เสร็จ\"},{\"id\":2,\"t\":\"I\",\"zh\":\"我喜歡找出資料中的規律，並查明問題可能從哪裡來。\",\"th\":\"ฉันชอบค้นหารูปแบบในข้อมูลและตรวจสอบว่าปัญหาอาจเกิดจากอะไร\"},{\"id\":3,\"t\":\"A\",\"zh\":\"我喜歡用文字、圖像、聲音或其他方式創作自己的表達。\",\"th\":\"ฉันชอบสร้างสรรค์และถ่ายทอดความคิดด้วยข้อความ ภาพ เสียง หรือวิธีอื่น\"},{\"id\":4,\"t\":\"S\",\"zh\":\"我喜歡把自己了解的事情說明給別人，幫助對方學會。\",\"th\":\"ฉันชอบอธิบายเรื่องที่ตนเข้าใจเพื่อช่วยให้ผู้อื่นเรียนรู้\"},{\"id\":5,\"t\":\"E\",\"zh\":\"我喜歡提出想法並說服他人一起支持一個計畫。\",\"th\":\"ฉันชอบเสนอแนวคิดและชักชวนให้ผู้อื่นร่วมสนับสนุนโครงการ\"},{\"id\":6,\"t\":\"C\",\"zh\":\"我喜歡把紀錄與資料整理得清楚、完整而容易查找。\",\"th\":\"ฉันชอบจัดระเบียบบันทึกและข้อมูลให้ชัดเจน ครบถ้วน และค้นหาได้ง่าย\"},{\"id\":7,\"t\":\"R\",\"zh\":\"我喜歡操作機器或器材，觀察不同設定會帶來什麼實際變化。\",\"th\":\"ฉันชอบใช้งานเครื่องจักรหรืออุปกรณ์และสังเกตว่าการตั้งค่าต่างกันทำให้เกิดผลอย่างไร\"},{\"id\":8,\"t\":\"I\",\"zh\":\"我喜歡比較多種解釋，找出哪一種最符合證據。\",\"th\":\"ฉันชอบเปรียบเทียบคำอธิบายหลายแบบเพื่อหาว่าแบบใดสอดคล้องกับหลักฐานมากที่สุด\"},{\"id\":9,\"t\":\"A\",\"zh\":\"遇到沒有單一標準答案的任務時，我喜歡發展新做法。\",\"th\":\"เมื่องานไม่มีคำตอบมาตรฐานเพียงแบบเดียว ฉันชอบพัฒนาวิธีใหม่ ๆ\"},{\"id\":10,\"t\":\"S\",\"zh\":\"我喜歡傾聽別人遇到的困難，並陪對方找出可行的下一步。\",\"th\":\"ฉันชอบรับฟังปัญหาของผู้อื่นและช่วยกันหาขั้นตอนถัดไปที่ทำได้จริง\"},{\"id\":11,\"t\":\"E\",\"zh\":\"我喜歡在團隊中設定方向、分配任務並推動進度。\",\"th\":\"ฉันชอบกำหนดทิศทาง แบ่งงาน และผลักดันความคืบหน้าในทีม\"},{\"id\":12,\"t\":\"C\",\"zh\":\"我喜歡依照明確流程處理工作，並確認每個步驟都有完成。\",\"th\":\"ฉันชอบทำงานตามขั้นตอนที่ชัดเจนและตรวจสอบว่าทำครบทุกขั้นตอน\"},{\"id\":13,\"t\":\"R\",\"zh\":\"我喜歡在現場實際檢查材料、產品或設備狀況。\",\"th\":\"ฉันชอบตรวจสอบสภาพวัสดุ ผลิตภัณฑ์ หรืออุปกรณ์ ณ หน้างานด้วยตนเอง\"},{\"id\":14,\"t\":\"I\",\"zh\":\"我喜歡設計簡單的測試，看看哪個因素造成結果差異。\",\"th\":\"ฉันชอบออกแบบการทดสอบง่าย ๆ เพื่อดูว่าปัจจัยใดทำให้ผลลัพธ์แตกต่างกัน\"},{\"id\":15,\"t\":\"A\",\"zh\":\"我喜歡設計簡報、版面或視覺內容，讓訊息更有特色。\",\"th\":\"ฉันชอบออกแบบงานนำเสนอ เลย์เอาต์ หรือสื่อภาพให้ข้อมูลมีเอกลักษณ์\"},{\"id\":16,\"t\":\"S\",\"zh\":\"我喜歡帶領小組討論，讓每個人都能參與並理解重點。\",\"th\":\"ฉันชอบนำการพูดคุยกลุ่มเพื่อให้ทุกคนมีส่วนร่วมและเข้าใจประเด็นสำคัญ\"},{\"id\":17,\"t\":\"E\",\"zh\":\"我喜歡協商資源或條件，讓一項提案能夠開始執行。\",\"th\":\"ฉันชอบเจรจาเรื่องทรัพยากรหรือเงื่อนไขเพื่อให้ข้อเสนอเริ่มดำเนินการได้\"},{\"id\":18,\"t\":\"C\",\"zh\":\"我喜歡把日期、數字與文件核對一致，減少遺漏。\",\"th\":\"ฉันชอบตรวจวันที่ ตัวเลข และเอกสารให้ตรงกันเพื่อลดข้อผิดพลาด\"},{\"id\":19,\"t\":\"R\",\"zh\":\"我喜歡參與需要移動、安裝或維護實體設備的工作。\",\"th\":\"ฉันชอบทำงานที่ต้องเคลื่อนย้าย ติดตั้ง หรือบำรุงรักษาอุปกรณ์จริง\"},{\"id\":20,\"t\":\"I\",\"zh\":\"我喜歡深入研究一個主題，直到能用證據解釋它。\",\"th\":\"ฉันชอบศึกษาหัวข้อหนึ่งอย่างลึกซึ้งจนสามารถอธิบายด้วยหลักฐานได้\"},{\"id\":21,\"t\":\"A\",\"zh\":\"我喜歡為一個主題想出不同的呈現方式或新點子。\",\"th\":\"ฉันชอบคิดวิธีนำเสนอหัวข้อหนึ่งในรูปแบบที่แตกต่างหรือสร้างแนวคิดใหม่\"},{\"id\":22,\"t\":\"S\",\"zh\":\"我喜歡教練或指導別人，看到對方逐漸掌握一項技能。\",\"th\":\"ฉันชอบฝึกสอนหรือแนะนำผู้อื่นและเห็นเขาค่อย ๆ ทำทักษะได้\"},{\"id\":23,\"t\":\"E\",\"zh\":\"我喜歡代表團隊介紹成果，並爭取他人認同或合作。\",\"th\":\"ฉันชอบเป็นตัวแทนทีมเพื่อนำเสนอผลงานและขอการยอมรับหรือความร่วมมือ\"},{\"id\":24,\"t\":\"C\",\"zh\":\"我喜歡安排清單、時程與工作順序，讓事情按計畫完成。\",\"th\":\"ฉันชอบจัดรายการตรวจสอบ กำหนดเวลา และลำดับงานเพื่อให้งานเสร็จตามแผน\"},{\"id\":25,\"t\":\"R\",\"zh\":\"我喜歡透過實際操作，而不只是閱讀說明，來學習新器材。\",\"th\":\"ฉันชอบเรียนรู้อุปกรณ์ใหม่ด้วยการลงมือใช้จริง ไม่ใช่อ่านคำอธิบายอย่างเดียว\"},{\"id\":26,\"t\":\"I\",\"zh\":\"我喜歡拆解複雜的問題，逐一檢查各部分如何互相影響。\",\"th\":\"ฉันชอบแยกปัญหาซับซ้อนออกเป็นส่วน ๆ และตรวจสอบว่าแต่ละส่วนส่งผลต่อกันอย่างไร\"},{\"id\":27,\"t\":\"A\",\"zh\":\"我喜歡把抽象的想法轉化成具體且有創意的作品或內容。\",\"th\":\"ฉันชอบเปลี่ยนแนวคิดนามธรรมให้เป็นผลงานหรือเนื้อหาที่สร้างสรรค์และจับต้องได้\"},{\"id\":28,\"t\":\"S\",\"zh\":\"我喜歡協助不同背景的人溝通，找到彼此都能接受的做法。\",\"th\":\"ฉันชอบช่วยให้ผู้คนที่มีพื้นฐานต่างกันสื่อสารและหาวิธีที่ยอมรับร่วมกันได้\"},{\"id\":29,\"t\":\"E\",\"zh\":\"我喜歡主動開啟一項活動，並鼓勵大家朝共同目標前進。\",\"th\":\"ฉันชอบเริ่มกิจกรรมด้วยตนเองและสนับสนุนให้ทุกคนเดินหน้าไปสู่เป้าหมายร่วมกัน\"},{\"id\":30,\"t\":\"C\",\"zh\":\"我喜歡管理分類清單或數位資料，讓資訊保持正確且有條理。\",\"th\":\"ฉันชอบดูแลรายการจัดหมวดหมู่หรือข้อมูลดิจิทัลให้ถูกต้องและเป็นระเบียบ\"}];\nconst COPY={\"zh\":{\"pageTitle\":\"RIASEC 職業興趣探索\",\"brand\":\"Holland / RIASEC 職業興趣探索\",\"brandSub\":\"六個興趣向度 · 自我探索\",\"languageLabel\":\"語言切換\",\"home\":\"返回標題\",\"eyebrow\":\"職涯興趣探索 · 不是能力測驗\",\"title\":\"探索你喜歡的工作活動\",\"intro\":\"請依照「我有多喜歡做這件事」評分。完成後查看六個興趣向度與前三候選代碼；它描述活動偏好，不會替你決定職業。\",\"badge\":\"30 題 · 6 個向度\",\"formBadge\":\"3 種隨機題序 · 同一題庫\",\"scaleBadge\":\"每向度 5 題 · 喜好評分\",\"howTitle\":\"作答方式\",\"howCopy\":\"依照你真實的興趣作答，而不是你擅長或認為應該喜歡的事情。選擇「非常不喜歡、不喜歡、不確定、喜歡、非常喜歡」；完成後呈現 R、I、A、S、E、C 六向度的完整分數與高點輪廓。\",\"validity\":\"重要說明：RIASEC 是職業興趣分類架構，不是單一官方試卷。這是以 Holland 六向度自編的中泰文探索題組，並非 O*NET Mini-IP 或 SDS 原版，尚未完成中泰文信效度與常模驗證。結果只反映本題組中的自我回報興趣。\",\"methodTitle\":\"計分依據與研究限制\",\"methodBody\":\"<p>Holland RIASEC 將職業興趣分為實作 R、研究 I、藝術 A、社會 S、企業 E、事務 C 六類。O*NET® Interest Profiler 是由美國勞工部就業與訓練署（USDOL/ETA）贊助、以 RIASEC 為基礎的職涯探索工具；其 Mini-IP 公開技術手冊採 30 題、每向度 5 題，喜好反應依 0–4 加總成每向度 0–20 分，並查看最高興趣區域。<\/p><ul><li>本頁的 30 個活動敘述為原創中泰文題目，不是 O*NET Mini-IP 或 SDS 題目；計分借鑑 Mini-IP 公開結構，不等同該工具的分數、常模或職業配對結果。USDOL/ETA 未認可、核准或測試本頁。<\/li><li>介面選項為 1–5，程式轉為 0–4 再加總；每一向度 5 題，分數範圍 0–20。分數越高，只代表本次較喜歡該類活動。<\/li><li>依六向度分數由高至低形成高點輪廓，通常查看前三向度。第三名若同分，會一併列出所有同分候選；結果頁仍呈現六個分數。<\/li><li>三套題本只是同一題庫的不同隨機題序，並非三份平行或等值量表；同一向度的題目順序變化不會改變計分。<\/li><li>本頁未使用經驗證的中泰文題本，也沒有台灣或泰國常模，不能推論職能、勝任度或適合某一職業；職業選擇仍需結合能力、價值觀、教育與實際工作條件。<\/li><\/ul><p>適合自我探索與職涯討論，不作為招聘、升遷、淘汰或心理診斷依據。<\/p>\",\"sourceManual\":\"O*NET Interest Profiler 技術手冊（2021）\",\"sourceMini\":\"O*NET Mini-IP 30 題技術文件\",\"sourceLicense\":\"O*NET 工具授權與使用說明\",\"start\":\"開始 30 題\",\"resume\":\"繼續未完成測驗\",\"retake\":\"重新測驗（抽另一題序）\",\"statusNew\":\"請依照真實興趣作答，沒有對錯答案。\",\"statusName\":\"測驗者：\",\"statusResume\":\"已儲存作答，會從尚未完成的題目繼續。\",\"statusDone\":\"已有完成結果；重新測驗會隨機抽取不同題序。\",\"quizTitle\":\"你有多喜歡做以下活動？\",\"formPrefix\":\"題序版本\",\"progress\":\"題目\",\"question\":\"第\",\"of\":\"／30 題\",\"prev\":\"上一題\",\"next\":\"下一題\",\"finish\":\"完成並查看結果\",\"quizNote\":\"評估「喜不喜歡」，不要用擅長程度代替興趣。\",\"anchors\":[\"非常不喜歡\",\"不喜歡\",\"不確定\",\"喜歡\",\"非常喜歡\"],\"profileLabel\":\"高點興趣輪廓候選\",\"highestLabel\":\"目前最高向度\",\"candidateNote\":\"代碼依本題組分數排序；若第三名位置同分，會收錄所有並列候選，因此可能超過三個字母。它不是固定人格類型或職業錄取機率。\",\"cutGap\":\"第三名門檻差\",\"scoreLabel\":\"分數\",\"outOf\":\"/20\",\"scoreScale\":\"每向度 5 題 · 喜好分數 0–20\",\"lowLabel\":\"較少喜歡\",\"highLabel\":\"較喜歡\",\"tieNote\":\"如果第三名位置同分，所有同分向度都會列入候選；請同時查看六向度分數。分差不是信心值或人群百分位。\",\"resultMethod\":\"分數計算與解讀限制\",\"returnResult\":\"返回標題\",\"footer\":\"RIASEC 自我探索 · 六項分數依本機作答計算；未驗證中泰文版，不等同官方量表。\"},\"th\":{\"pageTitle\":\"สำรวจความสนใจในอาชีพ RIASEC\",\"brand\":\"สำรวจความสนใจในอาชีพ Holland / RIASEC\",\"brandSub\":\"ความสนใจ 6 ด้าน · สำรวจตนเอง\",\"languageLabel\":\"เปลี่ยนภาษา\",\"home\":\"กลับหน้าแรก\",\"eyebrow\":\"สำรวจความสนใจในอาชีพ · ไม่ใช่แบบทดสอบความสามารถ\",\"title\":\"สำรวจกิจกรรมการทำงานที่คุณชอบ\",\"intro\":\"ให้คะแนนตามความชอบที่มีต่อกิจกรรมแต่ละอย่าง หลังทำครบจะแสดงคะแนนความสนใจทั้ง 6 ด้านและรหัสผู้สมัคร 3 อันดับแรก ผลสะท้อนความชอบต่อกิจกรรม ไม่ได้ตัดสินอาชีพแทนคุณ\",\"badge\":\"30 ข้อ · 6 มิติ\",\"formBadge\":\"สุ่มลำดับ 3 แบบ · ใช้คลังข้อคำถามเดียวกัน\",\"scaleBadge\":\"มิติละ 5 ข้อ · ให้คะแนนความชอบ\",\"howTitle\":\"วิธีตอบ\",\"howCopy\":\"ตอบตามความสนใจจริง ไม่ใช่สิ่งที่คุณทำเก่งหรือคิดว่าควรชอบ เลือก “ไม่ชอบมาก ไม่ชอบ ไม่แน่ใจ ชอบ ชอบมาก” เมื่อทำครบจะแสดงคะแนนครบทั้ง R, I, A, S, E และ C พร้อมโปรไฟล์ความสนใจเด่น\",\"validity\":\"ข้อควรรู้: RIASEC เป็นกรอบจำแนกความสนใจในอาชีพ ไม่ใช่แบบทดสอบทางการเพียงฉบับเดียว นี่คือชุดคำถามจีนและไทยที่เขียนขึ้นใหม่ตามหกมิติของ Holland ไม่ใช่ O*NET Mini-IP หรือ SDS ฉบับต้นฉบับ และยังไม่ได้ตรวจสอบความเที่ยงตรง ความตรง หรือค่ามาตรฐานประชากรในภาษาไทยและจีน ผลสะท้อนเฉพาะความสนใจที่รายงานในชุดคำถามนี้\",\"methodTitle\":\"หลักการให้คะแนนและข้อจำกัดของงานวิจัย\",\"methodBody\":\"<p>Holland RIASEC แบ่งความสนใจในอาชีพเป็น 6 ด้าน ได้แก่ Realistic (R), Investigative (I), Artistic (A), Social (S), Enterprising (E) และ Conventional (C) O*NET® Interest Profiler ได้รับการสนับสนุนจากกระทรวงแรงงานสหรัฐฯ Employment and Training Administration (USDOL/ETA) และใช้กรอบ RIASEC; คู่มือเทคนิคสาธารณะของ Mini-IP ใช้ 30 ข้อ ด้านละ 5 ข้อ รวมคำตอบความชอบ 0–4 เป็นคะแนนด้านละ 0–20 แล้วพิจารณาด้านที่ได้คะแนนสูง<\/p><ul><li>ข้อความกิจกรรมทั้ง 30 ข้อในหน้านี้เขียนขึ้นใหม่เป็นภาษาจีนและไทย ไม่ใช่ข้อคำถามของ O*NET Mini-IP หรือ SDS; รูปแบบการให้คะแนนอ้างอิงโครงสร้างสาธารณะของ Mini-IP แต่คะแนน ค่ามาตรฐาน และการจับคู่อาชีพไม่เทียบเท่าเครื่องมือนั้น USDOL/ETA ไม่ได้รับรอง อนุมัติ หรือทดสอบหน้านี้<\/li><li>ตัวเลือกในหน้าจอใช้ 1–5 และโปรแกรมแปลงเป็น 0–4 ก่อนรวมคะแนน แต่ละมิติมี 5 ข้อ ช่วงคะแนน 0–20 คะแนนสูงหมายถึงชอบกิจกรรมประเภทนั้นมากกว่าในการตอบครั้งนี้<\/li><li>จัดลำดับหกมิติตามคะแนนเพื่อแสดงโปรไฟล์ความสนใจเด่น โดยทั่วไปพิจารณาสามอันดับแรก หากคะแนนเสมอกันตรงอันดับสาม จะแสดงผู้สมัครที่เสมอกันทั้งหมด และยังแสดงคะแนนครบทั้งหกด้าน<\/li><li>แบบทั้งสามเปลี่ยนเฉพาะลำดับข้อจากคลังเดียวกัน ไม่ใช่แบบคู่ขนานหรือแบบวัดที่มีความเท่าเทียมกันที่ผ่านการทดสอบ ลำดับที่เปลี่ยนไม่เปลี่ยนวิธีคิดคะแนน<\/li><li>หน้านี้ไม่ได้ใช้ข้อคำถามภาษาจีนหรือไทยที่ผ่านการตรวจสอบ และไม่มีค่ามาตรฐานประชากรไทยหรือไต้หวัน จึงใช้สรุปทักษะ ความเหมาะสมกับงาน หรือความเหมาะกับอาชีพใดอาชีพหนึ่งไม่ได้ การเลือกอาชีพควรพิจารณาความสามารถ ค่านิยม การศึกษา และเงื่อนไขการทำงานจริงร่วมด้วย<\/li><\/ul><p>เหมาะสำหรับสำรวจตนเองและพูดคุยเรื่องอาชีพ ไม่ใช้คัดเลือก เลื่อนตำแหน่ง ตัดสิทธิ์ หรือวินิจฉัยทางจิตวิทยา<\/p>\",\"sourceManual\":\"คู่มือเทคนิค O*NET Interest Profiler (2021)\",\"sourceMini\":\"เอกสารทางเทคนิค O*NET Mini-IP 30 ข้อ\",\"sourceLicense\":\"เงื่อนไขการใช้เครื่องมือ O*NET\",\"start\":\"เริ่มตอบ 30 ข้อ\",\"resume\":\"ทำต่อจากที่บันทึกไว้\",\"retake\":\"ทำอีกครั้ง (สุ่มลำดับใหม่)\",\"statusNew\":\"ตอบตามความสนใจจริง ไม่มีคำตอบถูกหรือผิด\",\"statusName\":\"ผู้ทำแบบสำรวจ: \",\"statusResume\":\"บันทึกคำตอบไว้แล้ว จะเริ่มต่อจากข้อที่ยังไม่ได้ตอบ\",\"statusDone\":\"มีผลครั้งก่อนแล้ว เริ่มใหม่จะสุ่มลำดับอื่น\",\"quizTitle\":\"คุณชอบทำกิจกรรมต่อไปนี้มากแค่ไหน?\",\"formPrefix\":\"ลำดับแบบ\",\"progress\":\"ข้อ\",\"question\":\"ข้อที่\",\"of\":\"/30 ข้อ\",\"prev\":\"ข้อก่อนหน้า\",\"next\":\"ข้อถัดไป\",\"finish\":\"เสร็จและดูผล\",\"quizNote\":\"ประเมินว่า “ชอบหรือไม่” อย่าใช้ความถนัดแทนความสนใจ\",\"anchors\":[\"ไม่ชอบมาก\",\"ไม่ชอบ\",\"ไม่แน่ใจ\",\"ชอบ\",\"ชอบมาก\"],\"profileLabel\":\"โปรไฟล์ความสนใจเด่นที่เป็นผู้สมัคร\",\"highestLabel\":\"มิติที่ได้คะแนนสูงสุดขณะนี้\",\"candidateNote\":\"รหัสเรียงตามคะแนนของชุดคำถามนี้ หากคะแนนเสมอกันตรงอันดับสาม จะรวมผู้สมัครที่เสมอกันทั้งหมด จึงอาจมีมากกว่าสามตัวอักษร ไม่ใช่ประเภทบุคลิกภาพถาวรหรือโอกาสผ่านงาน\",\"cutGap\":\"ส่วนต่างที่เกณฑ์อันดับสาม\",\"scoreLabel\":\"คะแนน\",\"outOf\":\"/20\",\"scoreScale\":\"มิติละ 5 ข้อ · คะแนนความชอบ 0–20\",\"lowLabel\":\"ชอบน้อยกว่า\",\"highLabel\":\"ชอบมากกว่า\",\"tieNote\":\"หากคะแนนเสมอกันตรงอันดับสาม มิติที่เสมอกันทั้งหมดจะอยู่ในรายชื่อผู้สมัคร โปรดดูคะแนนครบทั้งหกมิติ ส่วนต่างไม่ใช่ค่าความเชื่อมั่นหรือเปอร์เซ็นไทล์ประชากร\",\"resultMethod\":\"การคำนวณคะแนนและข้อจำกัด\",\"returnResult\":\"กลับหน้าแรก\",\"footer\":\"สำรวจ RIASEC · คะแนนทั้งหกคำนวณจากคำตอบในอุปกรณ์นี้ เวอร์ชันไทย/จีนยังไม่ได้รับการตรวจสอบและไม่เทียบเท่าแบบประเมินทางการ\"}};\nlet lang='zh',testName='',state=null,questionIndex=0,lastSent='';\nconst STORAGE_PREFIX='austin-ria-sec-explorer-v1-',FORMS_KEY='austin-ria-sec-form-orders-v1';\nfunction copy(){return COPY[lang]}\nfunction storageKey(){return STORAGE_PREFIX+encodeURIComponent(String(testName||'').trim().toLocaleLowerCase())}\nfunction seededRandom(seed){let n=seed>>>0;return function(){n+=0x6D2B79F5;let t=n;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}\nfunction shuffled(a,rng){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}\nfunction buildOrder(seed){const rng=seededRandom(seed),groups={};for(const code of TYPES.map(x=>x.code))groups[code]=shuffled(ITEMS.filter(x=>x.t===code).map(x=>x.id-1),rng);const types=shuffled(TYPES.map(x=>x.code),rng),out=[];for(let row=0;row<5;row++)for(let col=0;col<6;col++)out.push(groups[types[(col+row)%6]][row]);return out}\nfunction secureSeed(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]}catch{return Math.floor(Math.random()*4294967296)}}\nfunction validOrders(a){return Array.isArray(a)&&a.length===3&&a.every(f=>Array.isArray(f)&&f.length===30&&new Set(f).size===30&&f.every(x=>Number.isInteger(x)&&x>=0&&x<30))&&new Set(a.map(f=>f.join(','))).size===3}\nfunction formOrders(){try{const saved=JSON.parse(localStorage.getItem(FORMS_KEY)||'null');if(validOrders(saved))return saved}catch{}const orders=[];let tries=0;while(orders.length<3&&tries<200){tries++;const next=buildOrder(secureSeed());if(!orders.some(x=>x.join(',')===next.join(',')))orders.push(next)}if(orders.length<3){for(const seed of [761,1289,4301]){const next=buildOrder(seed);if(!orders.some(x=>x.join(',')===next.join(',')))orders.push(next)}}try{localStorage.setItem(FORMS_KEY,JSON.stringify(orders))}catch{}return orders}\nconst FORM_ORDERS=formOrders();\nfunction scoreAnswers(a){const missing=ITEMS.filter(x=>!Number.isInteger(Number(a[x.id]))||Number(a[x.id])<1||Number(a[x.id])>5).map(x=>x.id);if(missing.length)return{complete:false,missing};const scores={};for(const type of TYPES){const sum=ITEMS.filter(x=>x.t===type.code).reduce((acc,x)=>acc+(Number(a[x.id])-1),0);scores[type.code]=sum}return{complete:true,scores}}\nfunction profileFor(scores){const ranked=TYPES.map((type,index)=>({type,score:scores[type.code],index})).sort((a,b)=>b.score-a.score||a.index-b.index),cut=ranked[2].score,candidates=ranked.filter(x=>x.score>=cut),leaders=ranked.filter(x=>x.score===ranked[0].score),next=ranked.find(x=>x.score<cut),gap=next?cut-next.score:0;return{ranked,cut,candidates,leaders,code:candidates.map(x=>x.type.code).join(''),gap}}\nfunction summaryFor(scores,formIndex){const p=profileFor(scores);return 'F'+(formIndex+1)+' '+p.code+' Δ'+p.gap+' '+TYPES.map(x=>x.code+':'+scores[x.code]).join(' ')}\nfunction chooseForm(previous,rng=Math.random){const choices=[0,1,2].filter(x=>x!==previous);return choices[Math.min(choices.length-1,Math.floor(Math.max(0,Math.min(.999999999,rng()))*choices.length))]}\nwindow.RIASEC_TEST_API={TYPES,ITEMS,FORM_ORDERS,buildOrder,validOrders,scoreAnswers,profileFor,summaryFor,chooseForm};\nfunction saveState(){if(testName&&state)try{localStorage.setItem(storageKey(),JSON.stringify(state))}catch{}}\nfunction loadState(){try{const x=JSON.parse(localStorage.getItem(storageKey())||'null');if(x&&[0,1,2].includes(x.formIndex)&&x.answers&&typeof x.answers==='object')return x}catch{}return null}\nfunction orderItems(){return FORM_ORDERS[state.formIndex].map(i=>ITEMS[i])}\nfunction showMode(m){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(m+'-screen').classList.add('active')}\nfunction setLabels(){const c=copy();document.documentElement.lang=lang==='zh'?'zh-Hant':'th';document.title=c.pageTitle;document.getElementById('brand-title').textContent=c.brand;document.getElementById('brand-sub').textContent=c.brandSub;document.getElementById('language-switch').setAttribute('aria-label',c.languageLabel);document.getElementById('home-button').textContent=c.home;document.getElementById('home-button').setAttribute('aria-label',c.home);document.getElementById('eyebrow').textContent=c.eyebrow;document.getElementById('main-title').textContent=c.title;document.getElementById('intro-copy').textContent=c.intro;document.getElementById('item-badge').textContent=c.badge;document.getElementById('form-badge').textContent=c.formBadge;document.getElementById('scale-badge').textContent=c.scaleBadge;document.getElementById('how-title').textContent=c.howTitle;document.getElementById('how-copy').textContent=c.howCopy;document.getElementById('type-preview').innerHTML=TYPES.map(x=>'<div class=\"type-chip\"><b>'+x[lang]+'<\/b><span>'+x[lang==='zh'?'shortZh':'shortTh']+'<\/span><\/div>').join('');document.getElementById('validity-note').textContent=c.validity;document.getElementById('method-title').textContent=c.methodTitle;document.getElementById('method-body').innerHTML=c.methodBody;document.getElementById('source-manual').textContent=c.sourceManual;document.getElementById('source-mini').textContent=c.sourceMini;document.getElementById('source-license').textContent=c.sourceLicense;document.getElementById('start-button').textContent=state?(state.completed?c.retake:c.resume):c.start;document.getElementById('result-method-title').textContent=c.resultMethod;document.getElementById('result-method-body').innerHTML=c.methodBody;document.getElementById('footer-copy').textContent=c.footer;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));if(questionIndex>=0&&state&&document.getElementById('quiz-screen').classList.contains('active'))renderQuestion();if(state&&state.scores&&document.getElementById('result-screen').classList.contains('active'))renderResults(state.scores,document.getElementById('result-screen').dataset.newAttempt==='true')}\nfunction updateStatus(){const c=copy(),el=document.getElementById('status');if(!el)return;if(!testName){el.textContent=c.statusNew;return}if(!state){el.textContent=c.statusName+testName+' · '+c.statusNew;return}const n=Object.keys(state.answers||{}).length;if(state.completed){el.textContent=c.statusName+testName+' · '+c.statusDone;return}el.textContent=c.statusName+testName+' · '+(n?c.statusResume+' ('+n+'/30)':c.statusNew)}\nfunction currentForm(){return FORM_ORDERS[state.formIndex]}\nfunction beginOrResume(){if(!testName)return;if(state&&state.completed){const previous=state.lastForm===undefined?state.formIndex:state.lastForm;state={formIndex:chooseForm(previous),answers:{},completed:false,lastForm:previous}}else if(!state){state={formIndex:chooseForm(null),answers:{},completed:false,lastForm:null}}saveState();const rows=orderItems();questionIndex=rows.findIndex(x=>!Number.isInteger(Number(state.answers[x.id])));if(questionIndex<0)questionIndex=rows.length-1;document.getElementById('result-screen').dataset.newAttempt='false';showMode('quiz');renderQuestion()}\nfunction renderQuestion(){if(!state||!testName)return;const c=copy(),rows=orderItems(),item=rows[questionIndex];document.getElementById('quiz-title').textContent=c.quizTitle;document.getElementById('form-label').textContent=c.formPrefix+' '+(state.formIndex+1)+'/3';document.getElementById('progress-track').setAttribute('aria-label',c.progress+' '+(questionIndex+1)+c.of);document.getElementById('progress-label').textContent=c.progress+' '+(questionIndex+1)+c.of;document.getElementById('question-number').textContent=c.question+ ize:16px!important;line-height:1.6!important}\nbody :where(p,li,label,summary,small,dt,dd,.lede,.intro,.hint,.note,.notice,.privacy,.quiz-note,.quiz-hint,.status,.footer,.result-note,.score-desc,.detail-item,.method-body,.source-list,.result-caution,.option,.answer-label,.tag,.badge,.kicker){line-height:1.5!important}\nbody :where(button,input,select,textarea){font-family:inherit!important;font-size:15px!important;line-height:1.4!important}\nbody :where(input,select,textarea){font-size:16px!important;min-height:44px}\nbody :where(header.topbar,header.top,.topbar,.top){padding-right:136px!important}\n/* Reserve the upper-right corner for the fixed return control. */\n.topbar .actions>#home-button{display:none!important}\n@media(max-width:600px){body :where(header.topbar,header.top,.topbar,.top){padding-right:126px!important}}\n<\/style><\/head>\n<body>\n  <header class=\"topbar shell\">\n    <button class=\"brand\" id=\"brand-home\" type=\"button\" aria-label=\"Home\"><span class=\"brand-mark\">✦<\/span><span class=\"brand-name\"><b id=\"brand-title\">性格星球<\/b><small id=\"brand-subtitle\">Personality Explorer · 自我探索<\/small><\/span><\/button>\n    <div class=\"top-actions\"><button id=\"resume-button\" class=\"quiet-btn\" type=\"button\" hidden><\/button><button id=\"language-button\" class=\"language-btn\" type=\"button\">ภาษาไทย<\/button><\/div>\n  <\/header>\n\n  <main class=\"shell\">\n    <section id=\"home-screen\" class=\"screen active\" aria-labelledby=\"home-title\">\n      <div class=\"home-hero\">\n        <div class=\"hero-copy\">\n          <span class=\"eyebrow\" id=\"hero-eyebrow\">✦ 48 題原創自我探索 · 完全離線<\/span>\n          <h1 id=\"home-title\">認識自己的方式，<br>不只一種。<\/h1>\n          <p id=\"home-copy\">用一段輕鬆的小旅程，看看你偏好如何充電、接收訊息、做決定與安排生活。沒有好壞排名，只有更了解自己的一扇窗。<\/p>\n          <div class=\"hero-ctas\"><button id=\"start-button\" class=\"primary-btn\" type=\"button\">開始探索 <span aria-hidden=\"true\">→<\/span><\/button><button id=\"continue-button\" class=\"secondary-btn\" type=\"button\" hidden><\/button><\/div>\n          <p class=\"small-note\" id=\"home-note\">約 8–12 分鐘 · 可中途離開並在此裝置續答 · 不需註冊<\/p>\n        <\/div>\n        <div class=\"hero-art\" aria-hidden=\"true\">\n          <span class=\"orbit\"><\/span><span class=\"sparkle s1\">✦<\/span><span class=\"sparkle s2\">✧<\/span>\n          <svg viewBox=\"0 0 430 330\" role=\"img\">\n            <defs><linearGradient id=\"orb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#fff5c5\"/><stop offset=\"1\" stop-color=\"#ffb2c9\"/><\/linearGradient><linearGradient id=\"cloak\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#a9f1da\"/><stop offset=\"1\" stop-color=\"#7dbfe8\"/><\/linearGradient><\/defs>\n            <ellipse cx=\"216\" cy=\"292\" rx=\"140\" ry=\"17\" fill=\"#291d5b\" opacity=\".2\"/><path d=\"M215 34c70 0 127 57 127 127s-57 127-127 127S88 231 88 161 145 34 215 34Z\" fill=\"#fff\" opacity=\".13\"/><path d=\"M102 160c0-63 51-114 114-114s114 51 114 114-51 114-114 114-114-51-114-114Z\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".5\" stroke-dasharray=\"3 9\"/>\n            <path d=\"M145 248c6-41 30-64 70-67 44 3 65 28 72 67l-18 27H158Z\" fill=\"url(#cloak)\" stroke=\"#fff\" stroke-width=\"4\"/><path d=\"m187 190 28 22 27-22 9 69h-73Z\" fill=\"#fff4e3\"/><path d=\"m201 207 14 12 13-12-4 27h-18Z\" fill=\"#ff92b3\"/>\n            <path d=\"M170 113c0-35 20-58 48-58 30 0 50 24 50 60v29c0 37-20 59-50 59-29 0-48-22-48-59Z\" fill=\"url(#orb)\" stroke=\"#fff\" stroke-width=\"4\"/><path d=\"M167 121c-10-42 10-76 47-81 34-4 53 13 63 49l-5 27c-10-17-19-30-36-34-17 18-41 24-69 20Z\" fill=\"#382b67\"/><path d=\"M183 137c8-6 17-6 24 0m21 0c8-6 17-6 24 0\" fill=\"none\" stroke=\"#392d59\" stroke-width=\"4\" stroke-linecap=\"round\"/><ellipse cx=\"196\" cy=\"147\" rx=\"3\" ry=\"5\" fill=\"#31264e\"/><ellipse cx=\"239\" cy=\"147\" rx=\"3\" ry=\"5\" fill=\"#31264e\"/><path d=\"M205 169c7 8 18 8 25 0\" fill=\"none\" stroke=\"#d77e87\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"185\" cy=\"158\" r=\"7\" fill=\"#ffadad\" opacity=\".6\"/><circle cx=\"250\" cy=\"158\" r=\"7\" fill=\"#ffadad\" opacity=\".6\"/>\n            <path d=\"M153 242c-20-14-32-29-33-45-1-11 7-16 17-12l29 27m123 29c21-13 34-27 36-43 1-12-7-17-18-13l-29 26\" fill=\"none\" stroke=\"#f8d5ae\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"M133 145c-15-16-8-31 1-32 11-1 13 12 2 20m161 12c16-16 8-31-1-32-11-1-13 12-2 20\" fill=\"none\" stroke=\"#ffdb72\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M118 81 124 69l6 12 12 6-12 6-6 12-6-12-12-6Zm208 103 5-10 5 10 10 5-10 5-5 10-5-10-10-5Zm-189 63 4-8 4 8 8 4-8 4-4 8-4-8-8-4Z\" fill=\"#ffe482\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n      <div class=\"trust-row\" id=\"trust-row\"><\/div>\n      <section class=\"section-card\"><div class=\"section-head\"><div><h2 id=\"axis-title\">四個偏好維度，一張個人地圖<\/h2><p id=\"axis-copy\">不是能力高低，也不是固定標籤；它們描述你較常使用的方式。<\/p><\/div><\/div><div class=\"axis-preview\" id=\"axis-preview\"><\/div><\/section>\n      <section class=\"source-card\"><h2 id=\"source-title\">參考資料與使用界線<\/h2><p id=\"source-copy\">本頁為依四組偏好概念編寫的原創自我探索問卷，不是官方 MBTI® 評量。研究對官方量表的四個分數是否應被切成兩分法有不同討論；本頁題本未經信度、效度或等值性驗證。偏好不等於能力，不能用於甄選或診斷。<\/p><ul><li><a href=\"https://www.myersbriggs.org/my-mbti-personality-type/the-mbti-preferences/\" target=\"_blank\" rel=\"noopener\">Myers &amp; Briggs Foundation — MBTI Preferences<\/a><\/li><li><a href=\"https://www.myersbriggs.org/my-mbti-personality-type/my-mbti-results/home.htm\" target=\"_blank\" rel=\"noopener\">Myers &amp; Briggs Foundation — Understanding and Applying MBTI Results<\/a><\/li><li><a href=\"https://www.myersbriggs.org/using-type-as-a-professional/mbti-code-of-ethics/home.htm\" target=\"_blank\" rel=\"noopener\">Myers &amp; Briggs Foundation — Code of Ethics<\/a><\/li><li><a href=\"https://www.themyersbriggs.com/en-US/Support/MBTI-Facts\" target=\"_blank\" rel=\"noopener\">The Myers-Briggs Company — MBTI Facts<\/a><\/li><li><a href=\"https://pubmed.ncbi.nlm.nih.gov/2709300/\" target=\"_blank\" rel=\"noopener\">McCrae &amp; Costa (1989), Journal of Personality — MBTI dimensions and five-factor model<\/a><\/li><\/ul><\/section><div class=\"disclaimer\" id=\"home-disclaimer\"><\/div>\n    <\/section>\n\n    <section id=\"quiz-screen\" class=\"screen\" aria-label=\"Personality questionnaire\">\n      <div class=\"quiz-shell\">\n        <div class=\"quiz-topline\"><div><span id=\"quiz-counter\" class=\"quiz-counter\"><\/span><small id=\"quiz-counter-note\" class=\"quiz-counter-note\"><\/small><\/div><button id=\"exit-quiz\" class=\"quiet-btn\" type=\"button\"><\/button><\/div>\n        <div class=\"progress-track\" role=\"progressbar\" id=\"progress-track\" aria-valuemin=\"0\" aria-valuemax=\"48\" aria-valuenow=\"0\"><div id=\"progress-fill\" class=\"progress-fill\"><\/div><\/div>\n        <article class=\"quiz-card\">\n          <div class=\"question-tags\"><span id=\"question-number-tag\" class=\"tag\"><\/span><span id=\"question-axis-tag\" class=\"tag soft\"><\/span><\/div>\n          <h2 id=\"question-text\"><\/h2><p id=\"question-hint\" class=\"quiz-hint\"><\/p>\n          <div class=\"scale-labels\"><span id=\"scale-low\"><\/span><span id=\"scale-high\"><\/span><\/div>\n          <div id=\"answer-scale\" class=\"answer-scale\" role=\"group\"><\/div>\n          <div class=\"quiz-nav\"><button id=\"prev-button\" class=\"nav-btn\" type=\"button\"><\/button><div class=\"quiz-nav-right\"><button id=\"next-button\" class=\"nav-btn next\" type=\"button\" disabled><\/button><\/div><\/div>\n          <p id=\"privacy-hint\" class=\"progress-caption\"><\/p>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <section id=\"result-screen\" class=\"screen\" aria-label=\"Personality exploration results\">\n      <div class=\"result-wrap\">\n        <div id=\"result-hero\" class=\"result-hero\"><\/div>\n        <div class=\"result-actions\"><button id=\"retake-button\" class=\"outline-btn\" typ ,explain:{zh:'你通常先留意眼前事實，還是較快連結模式與可能性？',th:'คุณมักสังเกตข้อเท็จจริงตรงหน้า หรือเชื่อมโยงรูปแบบและความเป็นไปได้ก่อน'},side:{\n      S:{strength:{zh:'你擅長抓住具體細節、當前需求與可驗證的資訊，能把想法落到步驟，並留意實際執行品質。',th:'คุณเก่งในการจับรายละเอียด ความต้องการปัจจุบัน และข้อมูลที่ตรวจสอบได้ แปลงแนวคิดเป็นขั้นตอนและใส่ใจคุณภาพการลงมือทำ'},blind:{zh:'太聚焦眼前資料時，可能低估長期變化或未被明說的模式。偶爾退一步問「這些細節合在一起代表什麼？」',th:'หากมุ่งกับข้อมูลตรงหน้ามากเกินไป อาจมองข้ามการเปลี่ยนแปลงระยะยาวหรือรูปแบบที่ยังไม่ชัด ลองถอยมาถามว่า “รายละเอียดเหล่านี้รวมกันบอกอะไร”'},values:{zh:'重視可查證、可操作、可靠的資訊，以及投入能看見的實際成果。',th:'ให้คุณค่ากับข้อมูลที่ตรวจสอบและนำไปใช้ได้ ความน่าเชื่อถือ และผลงานที่เห็นผลจริง'},communicate:{zh:'偏好具體例子、明確定義、數據與可執行的下一步；討論新點子時先講用途會更容易聚焦。',th:'ชอบตัวอย่างที่เป็นรูปธรรม คำจำกัดความชัดเจน ข้อมูล และขั้นตอนถัดไปที่ทำได้จริง เมื่อคุยแนวคิดใหม่ การบอกประโยชน์ก่อนช่วยให้เข้าใจตรงกัน'},relationship:{zh:'你常透過實際幫忙、記住約定與穩定出現來表達關心；可留意對方有時也需要情緒上的理解。',th:'คุณมักแสดงความห่วงใยด้วยการช่วยลงมือ จำข้อตกลง และอยู่เคียงข้างอย่างสม่ำเสมอ อีกฝ่ายอาจต้องการการรับฟังความรู้สึกด้วย'},work:{zh:'適合目標清楚、標準具體、能看到進度與品質的任務。開始前先確認目的，可避免只把流程做完卻錯過真正問題。',th:'มักทำงานได้ดีเมื่อเป้าหมายและมาตรฐานชัดเจน มองเห็นความคืบหน้าและคุณภาพได้ การยืนยันเหตุผลของงานก่อนเริ่มช่วยไม่ให้ทำครบขั้นตอนแต่พลาดปัญหาจริง'},stress:{zh:'壓力大時可能鑽進細節、反覆確認，難以看見全局或接受尚未確定的方案。',th:'เมื่อเครียดอาจจมกับรายละเอียดและตรวจซ้ำ จนมองภาพรวมไม่เห็นหรือยอมรับแนวทางที่ยังไม่แน่นอนไม่ได้'},growth:{zh:'練習提出假設、留意趨勢與長期影響；在資料不完整時，先做小規模可逆的嘗試。',th:'ฝึกตั้งสมมติฐาน สังเกตแนวโน้มและผลระยะยาว เมื่อข้อมูลยังไม่ครบ ลองเริ่มจากการทดลองขนาดเล็กที่ปรับกลับได้'}},\n      N:{strength:{zh:'你容易連結看似分散的線索、提出可能性，也能想像改變方向後會發生什麼。',th:'คุณเชื่อมโยงเบาะแสที่ดูแยกจากกันได้ดี มองเห็นความเป็นไปได้ และจินตนาการผลลัพธ์เมื่อเปลี่ยนทิศทาง'},blind:{zh:'有時可能太快跳到未來、忽略現況限制，或因新點子太多而難以收尾。把洞見拆成可驗證的小步驟很有幫助。',th:'บางครั้งอาจคิดไปถึงอนาคตเร็วเกินไป มองข้ามข้อจำกัดปัจจุบัน หรือมีแนวคิดใหม่มากจนปิดงานไม่ลง การแบ่งข้อสังเกตเป็นขั้นตอนเล็ก ๆ ที่ตรวจสอบได้ช่วยได้'},values:{zh:'重視探索、創新、意義、連結，以及保有想像和改變的空間。',th:'ให้คุณค่ากับการสำรวจ นวัตกรรม ความหมาย ความเชื่อมโยง และพื้นที่สำหรับจินตนาการกับการเปลี่ยนแปลง'},communicate:{zh:'常先談概念、趨勢與背後原因；補上範例、現況和實際影響，能讓不同思考方式的人跟上。',th:'มักเริ่มจากแนวคิด แนวโน้ม และเหตุผลเบื้องหลัง การเพิ่มตัวอย่าง สถานการณ์จริง และผลกระทบช่วยให้คนที่คิดต่างตามทัน'},relationship:{zh:'你可能喜歡分享想法、深入談價值與未來；也要記得日常的小承諾和眼前需要同樣能傳達在乎。',th:'คุณอาจชอบแลกเปลี่ยนความคิดและคุยเรื่องคุณค่าหรืออนาคต อย่าลืมว่าคำมั่นเล็ก ๆ และการดูแลความต้องการตรงหน้าก็แสดงความใส่ใจได้'},work:{zh:'適合有探索、改善或設計空間的任務。為點子設定驗證標準、負責人與完成時間，能讓創意真正落地。',th:'มักทำงานได้ดีเมื่อมีพื้นที่สำรวจ ปรับปรุง หรือออกแบบ การกำหนดเกณฑ์ตรวจสอบ ผู้รับผิดชอบ และเวลาส่งมอบช่วยให้แนวคิดเกิดผลจริง'},stress:{zh:'壓力大時可能不斷推演各種可能性、對重複細節失去耐性，或頻繁改變方向。',th:'เมื่อเครียดอาจคิดความเป็นไปได้ไม่หยุด หมดความอดทนกับรายละเอียดซ้ำ ๆ หรือเปลี่ยนทิศทางบ่อย'},growth:{zh:'練習先完成一個可用版本、回到現有證據，也邀請他人協助檢視假設是否站得住腳。',th:'ฝึกทำฉบับที่ใช้งานได้ให้เสร็จก่อน กลับมาดูหลักฐานที่มี และชวนผู้อื่นช่วยตรวจสอบว่าสมมติฐานมีเหตุผลหรือไม่'}}}},\n    {id:'TF',letters:['T','F'],glyph:'⚖️',keys:{zh:['思考 T','情感 F'],th:['ใช้เหตุผล T','คำนึงถึงความรู้สึก F']},explain:{zh:'你做選擇時，較先看一致準則，還是價值與對人的影響？',th:'เมื่อตัดสินใจ คุณพิจารณาหลักเกณฑ์ที่สม่ำเสมอ หรือคุณค่าและผลกระทบต่อผู้คนก่อน'},side:{\n      T:{strength:{zh:'你常尋找一致、公平、可說明的準則，善於拆解問題、比較選項，也敢指出推理中的矛盾。',th:'คุณมักมองหาหลักเกณฑ์ที่สม่ำเสมอ เป็นธรรม และอธิบายได้ แยกปัญหา เปรียบเทียบทางเลือก และกล้าชี้ความขัดแย้งในการให้เหตุผล'},blind:{zh:'若只談結論與效率，別人可能感到感受沒有被看見。先確認對方在意什麼，再進入分析，通常更有效。',th:'หากพูดแต่ข้อสรุปและประสิทธิภาพ ผู้อื่นอาจรู้สึกว่าไม่ได้รับการเข้าใจ ลองถามก่อนว่าอีกฝ่ายให้ความสำคัญกับอะไร แล้วค่อยวิเคราะห์'},values:{zh:'重視原則一致、能力、誠實、問題被解決，以及能公開說明的決策理由。',th:'ให้คุณค่ากับหลักการที่สม่ำเสมอ ความสามารถ ความซื่อตรง การแก้ปัญหา และเหตุผลในการตัดสินใจที่อธิบายได้'},communicate:{zh:'偏好直接談事實、因果與可行方案。加上一句對他人處境的確認，可讓坦率更容易被接住。',th:'ชอบพูดตรงเกี่ยวกับข้อเท็จจริง เหตุและผล และทางเลือกที่ทำได้ การยืนยันความรู้สึกหรือสถานการณ์ของอีกฝ่ายสักประโยคช่วยให้ความตรงไปตรงมารับฟังได้ง่ายขึ้น'},relationship:{zh:'你可能以提供解法、守住承諾和共同面對問題表達關心；有時先陪伴，比立刻修理問題更重要。',th:'คุณอาจแสดงความห่วงใยด้วยการเสนอทางแก้ รักษาคำมั่น และเผชิญปัญหาร่วมกัน บางครั้งการอยู่เป็นเพื่อนสำคัญกว่าการรีบแก้ปัญหา'},work:{zh:'適合有清楚標準、能討論不同意見並以證據修正的團隊。記得先對齊決策依據，再比較結論。',th:'มักทำงานได้ดีในทีมที่มีมาตรฐานชัดเจน พูดเห็นต่างได้ และปรับความคิดตามหลักฐาน ควรตกลงเกณฑ์ตัดสินใจก่อนเปรียบเทียบข้อสรุป'},stress:{zh:'壓力大時可能變得過度挑錯、語氣尖銳，或把情緒需求看成不理性。',th:'เมื่อเครียดอาจจับผิดมากเกินไป ใช้น้ำเสียงแข็ง หรือมองความต้องการด้านความรู้สึกว่าไม่มีเหตุผล'},growth:{zh:'練習把「對事的評估」和「對人的尊重」同時放進表達；有些決定需要先聽完再分析。',th:'ฝึกสื่อสารทั้งการประเมินเรื่องงานและการเคารพคนไปพร้อมกัน การตัดสินใจบางเรื่องควรฟังให้จบก่อนวิเคราะห์'}},\n      F:{strength:{zh:'你會留意決策是否符合價值、是否顧及人，也擅長感受團隊氣氛、修復關係與建立支持。',th:'คุณใส่ใจว่าการตัดสินใจสอดคล้องกับคุณค่าและคำนึงถึงผู้คนหรือไม่ รับรู้บรรยากาศทีม ฟื้นฟูความสัมพันธ์ และสร้างแรงสนับสนุนได้ดี'},blind:{zh:'太想維持和諧時，可能難以說不、延後必要的衝突，或忽略對自己不公平的安排。',th:'หากอยากรักษาความกลมเกลียวมากเกินไป อาจปฏิเสธไม่ลง เลื่อนการพูดคุยที่จำเป็น หรือมองข้ามการจัดการที่ไม่เป็นธรรมต่อตัวเอง'},values:{zh:'重視尊重、互助、真誠、歸屬感，以及決定對相關的人是否有意義。',th:'ให้คุณค่ากับความเคารพ การเกื้อกูล ความจริงใจ ความรู้สึกเป็นส่วนหนึ่ง และความหมายของการตัดสินใจต่อผู้ที่เกี่ยวข้อง'},communicate:{zh:'常先確認感受與立場，再談如何前進。提出不同意見時，清楚說明原則與界線也能保護關係。',th:'มักทำความเข้าใจความรู้สึกและจุดยืนก่อนคุยว่าจะเดินต่ออย่างไร เมื่อเห็นต่าง การอธิบายหลักการและขอบเขตให้ชัดช่วยรักษาความสัมพันธ์ได้'},relationship:{zh:'你可能很願意投入照顧與支持；記得關係應有來有往，適時表達自己的需要而不只猜測別人的需要。',th:'คุณอาจทุ่มเทดูแลและสนับสนุนคนอื่น อย่าลืมว่าความสัมพันธ์ควรให้และรับ การบอกความต้องการของตัวเองสำคัญพอ ๆ กับการคาดเดาความต้องการของผู้อื่น'},work:{zh:'適合重視合作、公平與成員發展的環境。重大決策仍可搭配清楚數據和一致標準，減少只靠好惡。',th:'มักทำงานได้ดีในสภาพแวดล้อมที่ให้ความสำคัญกับความร่วมมือ ความเป็นธรรม และการเติบโตของสมาชิก การใช้ข้อมูลและมาตรฐานที่สม่ำเสมอช่วยลดการตัดสินจากความชอบส่วนตัว'},stress:{zh:'壓力大時可能把他人感受都扛在身上、過度迎合，或因未被理解而突然退縮。',th:'เมื่อเครียดอาจแบกรับความรู้สึกของทุกคน เอาใจผู้อื่นมากเกิน หรือถอยห่างทันทีเมื่อรู้สึกว่าไม่มีใครเข้าใจ'},growth:{zh:'練習以尊重的方式說出不同意見，分清「我能支持」與「我必須負責」，並讓事實也參與決策。',th:'ฝึกแสดงความเห็นต่างอย่างเคารพ แยกให้ออกว่าเรื่องใดช่วยสนับสนุนได้และเรื่องใดไม่ใช่ความรับผิดชอบของคุณ พร้อมเปิดพื้นที่ให้ข้อเท็จจริงร่วมในการตัดสินใจ'}}}},\n    {id:'JP',letters:['J','P'],glyph:'🗓️',keys:{zh:['判斷 J','感知 P'],th:['วางแผน J','ยืดหยุ่น P']},explain:{zh:'你比較喜歡形成計畫與結論，還是保留選項、邊做邊調整？',th:'คุณชอบกำหนดแผนและข้อสรุป หรือเก็บทางเลือกไว้แล้วปรับระหว่างทางมากกว่า'},side:{\n      J:{strength:{zh:'你擅長把事情拆成步驟、訂出優先順序並推進到完成，讓人知道接下來會發生什麼。',th:'คุณเก่งในการแบ่งงานเป็นขั้นตอน จัดลำดับความสำคัญ และผลักดันจนเสร็จ ทำให้คนรอบข้างมองเห็นสิ่งที่จะเกิดขึ้นต่อไป'},blind:{zh:'計畫太早定案時，可能對新資訊或臨時變化感到挫折，也容易把「完成」看得比「重新評估」更重要。',th:'หากกำหนดแผนเร็วเกินไป อาจหงุดหงิดกับข้อมูลใหม่หรือการเปลี่ยนแปลงกะทันหัน และให้ความสำคัญกับการปิดงานมากกว่าการประเมินใหม่'},values:{zh:'重視承諾、清楚、可預期、做事有交代，以及看得見的進度和完成感。',th:'ให้คุณค่ากับคำมั่น ความชัดเจน การคาดการณ์ได้ ความรับผิดชอบ และความคืบหน้าหรือความสำเร็จที่มองเห็นได้'},communicate:{zh:'偏好先知道目的、時程、責任與決策點。若計畫需變動，及早說明原因與新安排會讓你更安心。',th:'ชอบทราบเป้าหมาย เวลา ความรับผิดชอบ และจุดตัดสินใจล่วงหน้า หากแผนเปลี่ยน การอธิบายเหตุผลและแผนใหม่เร็วช่วยให้มั่นใจขึ้น'},relationship:{zh:'你常以守約、主動安排和可靠跟進表達在乎；也可為即興與對方的不同節奏保留空間。',th:'คุณมักแสดงความใส่ใจด้วยการรักษาคำพูด วางแผนร่วมกัน และติดตามอย่างน่าเชื่อถือ ควรเผื่อพื้นที่ให้กิจกรรมฉับพลันและจังหวะที่ต่างกันด้วย'},work:{zh:'適合目標、期限與交接清楚的任務。安排檢查點而非把每一步鎖死，能兼顧品質和彈性。',th:'มักทำงานได้ดีเมื่อเป้าหมาย กำหนดเวลา และการส่งต่องานชัดเจน การกำหนดจุดทบทวนแทนการล็อกทุกขั้นช่วยให้มีทั้งคุณภาพและความยืดหยุ่น'},stress:{zh:'壓力大時可能過度控制流程、難以放下未完成清單，或急著替所有人決定下一步。',th:'เมื่อเครียดอาจควบคุมขั้นตอนมากเกินไป วางรายการงานที่ยังไม่เสร็จไม่ลง หรือรีบกำหนดขั้นต่อไปแทนทุกคน'},growth:{zh:'練習區分「重要期限」與「偏好的做法」，預留緩衝，也允許計畫根據新證據更新。',th:'ฝึกแยกกำหนดเวลาสำคัญออกจากวิธีที่แค่ชอบ เผื่อเวลาสำรอง และยอมให้แผนปรับตามหลักฐานใหม่'}},\n      P:{strength:{zh:'你善於因應變化、保留可能性並臨場調整，在資訊更新或規則改變時常能找到替代路徑。',th:'คุณปรับตัวต่อความเปลี่ยนแปลง เก็บทางเลือกไว้ และแก้สถานการณ์เฉพาะหน้าได้ดี เมื่อข้อมูลหรือกติกาเปลี่ยนมักหาทางเลือกอื่นได้'},blind:{zh:'選項太多時可能延後決定、低估收尾時間，或讓需要確定安排的人感到不安。先做一個暫定決定會有幫助。',th:'เมื่อมีทางเลือกมากอาจเลื่อนการตัดสินใจ ประเมินเวลาปิดงานต่ำเกินไป หรือทำให้คนที่ต้องการแผนชัดเจนกังวล การกำหนดข้อสรุปชั่วคราวช่วยได้'},values:{zh:'重視自主、彈性、探索、即時回應，以及不被過早限制的空間。',th:'ให้คุณค่ากับอิสระ ความยืดหยุ่น การสำรวจ การตอบสนองต่อสถานการณ์ และพื้นที่ที่ไม่ถูกจำกัดเร็วเกินไป'},communicate:{zh:'喜歡在掌握更多資訊後再決定，也能接受邊做邊改。對需要安排的人，清楚說明目前版本和何時確認會更安心。',th:'ชอบตัดสินใจเมื่อมีข้อมูลมากขึ้น และปรับระหว่างทำได้ สำหรับคนที่ต้องวางแผน การบอกเวอร์ชันปัจจุบันและเวลาที่จะยืนยันช่วยให้สบายใจขึ้น'},relationship:{zh:'你可能用願意配合、共享新鮮體驗和不過度控制來表達在乎；也要記得穩定回應本身就是一種可靠。',th:'คุณอาจแสดงความใส่ใจด้วยการยืดหยุ่น เปิดรับประสบการณ์ใหม่ และไม่ควบคุมกันมากเกินไป การตอบกลับอย่างสม่ำเสมอก็เป็นความน่าเชื่อถือรูปแบบหนึ่ง'},work:{zh:'適合變動中需要探索、排除障礙與快速調整的任務。用小里程碑、提醒與明確交付定義，幫助自己順利收尾。',th:'มักทำงานได้ดีเมื่อต้องสำรวจ แก้สิ่งกีดขวาง และปรับตัวรวดเร็ว การกำหนดหมุดหมายย่อย การเตือน และนิยามงานส่งมอบให้ชัดช่วยให้ปิดงานได้'},stress:{zh:'壓力大時可能同時開太多支線、覺得被期限綁住，或到最後一刻才集中處理。',th:'เมื่อเครียดอาจเริ่มงานหลายทางพร้อมกัน รู้สึกถูกกำหนดเวลาจำกัด หรือเร่งทำทุกอย่างในนาทีสุดท้าย'},growth:{zh:'練習先定下一個可調整的期限與最小可交付成果，分階段收尾，再決定是否擴充。',th:'ฝึกกำหนดกำหนดเวลาที่ปรับได้และผลงานขั้นต่ำที่ส่งมอบได้ ปิดงานเป็นช่วง ๆ แล้วค่อยตัดสินใจว่าจะเพิ่มส่วนใด'}}}}\n  ];\n\n  const QUESTION_BANK=[\n    // EI: 12 statements keyed to E / I\n    {a:'EI',k:'E',zh:'在討論中，我常先把想法說出來，再透過交流把它整理清楚。',th:'ระหว่างพูดคุย ฉันมักพูดความคิดออกมาก่อน แล้วค่อยเรียบเรียงให้ชัดผ่านการแลกเปลี่ยน'},\n    {a:'EI',k:'I',zh:'我通常先在心裡整理好想法，再挑重點分享。',th:'ฉันมักจัดความคิดในใจก่อน แล้วจึงเลือกประเด็นสำคัญมาแบ่งปัน'},\n    {a:'EI',k:'E',zh:'做完一件有挑戰的事後，和人聊一聊常能讓我重新有精神。',th:'หลังทำงานที่ท้าทาย การได้พูดคุยกับคนอื่นมักช่วยให้ฉันมีพลังขึ้นอีกครั้ง'},\n    {a:'EI',k:'I',zh:'忙碌的一天後，我通常需要安靜獨處一段時間才能恢復。',th:'หลังวันที่วุ่นวาย ฉันมักต้องการเวลาเงียบ ๆ อยู่คนเดียวเพื่อฟื้นพลัง'},\n    {a:'EI',k:'E',zh:'在小組裡，我多半願意主動開啟話題或邀請大家參與。',th:'ในกลุ่ม ฉันมักพร้อมเริ่มบทสนทนาหรือชวนทุกคนมีส่วนร่วม'},\n    {a:'EI',k:'I',zh:'比起認識很多新朋友，我更享受和少數熟悉的人深入交流。',th:'ฉันเพลิดเพลินกับการคุยลึก ๆ กับคนสนิทไม่กี่คน มากกว่าการรู้จักคนใหม่จำนวนมาก'},\n    {a:'EI',k:'E',zh:'遇到不熟悉的情境時，和現場的人互動能幫我更快進入狀況。',th:'เมื่ออยู่ในสถานการณ์ที่ไม่คุ้นเคย การพูดคุยกับคนตรงหน้าช่วยให้ฉันปรับตัวได้เร็วขึ้น'},\n    {a:'EI',k:'I',zh:'臨時被點名立即回答時，我通常希望先有一點時間想一想。',th:'เมื่อถูกขอให้ตอบทันที ฉันมักอยากมีเวลาคิดสักครู่ก่อน'},\n    {a:'EI',k:'E',zh:'我常從參與活動、與人協作或外出走動中獲得活力。',th:'ฉันมักได้พลังจากการร่วมกิจกรรม ทำงานกับผู้อื่น หรือออกไปข้างนอก'},\n    {a:'EI',k:'I',zh:'我很享受一個人投入興趣或專案，不需要一直有人陪伴。',th:'ฉันชอบจดจ่อกับงานอดิเรกหรือโครงการคนเดียว โดยไม่จำเป็นต้องมีคนอยู่ด้วยตลอดเวลา'},\n    {a:'EI',k:'E',zh:'表達疑問或提出建議時，我通常不太需要很長時間暖身。',th:'เมื่อต้องถามหรือเสนอแนะ ฉันมักไม่ต้องใช้เวลานานในการเริ่มพูด'},\n    {a:'EI',k:'I',zh:'在大型社交場合裡，我傾向先觀察氣氛，再決定何時加入。',th:'ในงานสังคมที่มีคนจำนวนมาก ฉันมักสังเกตบรรยากาศก่อน แล้วค่อยเลือกเวลาที่จะเข้าไปร่วม'},\n    // SN: 12 statements keyed to S / N\n    {a:'SN',k:'S',zh:'學習新流程時，有清楚步驟和實際範例會讓我更快掌握。',th:'เมื่อเรียนรู้ขั้นตอนใหม่ การมีลำดับงานและตัวอย่างจริงช่วยให้ฉันเข้าใจเร็วขึ้น'},\n    {a:'SN',k:'N',zh:'聽到新點子時，我常立即想到它未來還能延伸成什麼。',th:'เมื่อได้ยินแนวคิดใหม่ ฉันมักคิดต่อทันทีว่าจะต่อยอดเป็นอะไรได้บ้างในอนาคต'},\n    {a:'SN',k:'S',zh:'我會留意具體事實、細節和實際發生了什麼，而不只聽推測。',th:'ฉันใส่ใจกับข้อเท็จจริง รายละเอียด และสิ่งที่เกิดขึ้นจริง ไม่ได้ฟังเพียงการคาดเดา'},\n    {a:'SN',k:'N',zh:'我常注意不同事件之間可能存在的關聯或共同模式。',th:'ฉันมักสังเกตความเชื่อมโยงหรือรูปแบบร่วมกันระหว่างเหตุการณ์ต่าง ๆ'},\n    {a:'SN',k:'S',zh:'討論問題時，我傾向先確認目前條件、證據和可用資源。',th:'เมื่อพูดถึงปัญหา ฉันมักตรวจสอบเงื่อนไข หลักฐาน และทรัพยากรที่มีอยู่ก่อน'},\n    {a:'SN',k:'N',zh:'討論問題時，我很快會思考背後原因以及可能的長期影響。',th:'เมื่อพูดถึงปัญหา ฉันมักคิดถึงสาเหตุเบื้องหลังและผลกระทบระยะยาวได้อย่างรวดเร็ว'},\n    {a:'SN',k:'S',zh:'我偏好先把眼前可行的做法做好，再考慮更遠的可能。',th:'ฉันชอบทำสิ่งที่ทำได้ตรงหน้าให้ดีก่อน แล้วค่อยพิจารณาความเป็นไปได้ที่ไกลออกไป'},\n    {a:'SN',k:'N',zh:'即使還沒有完整資料，我也喜歡先探索幾個不同方向。',th:'แม้ยังมีข้อมูลไม่ครบ ฉันก็ชอบสำรวจทิศทางที่แตกต่างกันไว้ก่อน'},\n    {a:'SN',k:'S',zh:'回想一段經驗時，我容易記得當時的具體細節和實際做法。',th:'เมื่อย้อนนึกถึงประสบการณ์ ฉันมักจำรายละเอียดและวิธีการที่ทำจริงได้'},\n    {a:'SN',k:'N',zh:'回想一段經驗時，我更容易記得它帶給我的啟發或整體意義。',th:'เมื่อย้อนนึกถึงประสบการณ์ ฉันมักจำข้อคิดหรือความหมายโดยรวมที่ได้รับได้มากกว่า'},\n    {a:'SN',k:'S',zh:'比起抽象理論，我通常更容易投入能直接觀察或操作的內容。',th:'ฉันมักสนใจเนื้อหาที่สังเกตหรือลงมือทำได้โดยตรง มากกว่าทฤษฎีนามธรรม'},\n    {a:'SN',k:'N',zh:'比起重複已知做法，我通常更有興趣探索新的解釋或方法。',th:'ฉันมักสนใจค้นหาคำอธิบายหรือวิธีใหม่ มากกว่าทำตามวิธีเดิมที่รู้อยู่แล้ว'},\n    // TF: 12 statements keyed to T / F\n    {a:'TF',k:'T',zh:'需要做決定時，我會先問：什麼準則對每個人都一致而公平？',th:'เมื่อต้องตัดสินใจ ฉันมักถามก่อนว่าเกณฑ์ใดสม่ำเสมอและเป็นธรรมกับทุกคน'},\n    {a:'TF',k:'F',zh:'做決定時，我會先想這件事對相關的人會有什麼感受和影響。',th:'เมื่อตัดสินใจ ฉันมักคิดก่อนว่าเรื่องนี้ส่งผลต่อความรู้สึกและชีวิตของผู้เกี่ยวข้องอย่างไร'},\n    {a:'TF',k:'T',zh:'別人找我討論難題時，我通常很快開始分析原因和解法。',th:'เมื่อคนอื่นมาปรึกษาปัญหา ฉันมักเริ่มวิเคราะห์สาเหตุและทางแก้ได้อย่างรวดเร็ว'},\n    {a:'TF',k:'F',zh:'別人找我討論難題時，我通常先確認他需要建議還是希望有人傾聽。',th:'เมื่อคนอื่นมาปรึกษาปัญหา ฉันมักถามก่อนว่าต้องการคำแนะนำหรืออยากให้รับฟัง'},\n    {a:'TF',k:'T',zh:'若一個決定合理而一致，即使不太受歡迎，我也願意支持它。',th:'หากการตัดสินใจมีเหตุผลและสม่ำเสมอ แม้ไม่เป็นที่ชื่นชอบ ฉันก็พร้อมสนับสนุน'},\n    {a:'TF',k:'F',zh:'決策即使有效率，如果明顯傷害了人的尊嚴，我會希望重新考慮。',th:'แม้การตัดสินใจจะมีประสิทธิภาพ หากกระทบศักดิ์ศรีของคนอย่างชัดเจน ฉันอยากให้พิจารณาใหม่'},\n    {a:'TF',k:'T',zh:'收到回饋時，我重視內容是否清楚、有根據，勝過表達是否婉轉。',th:'เมื่อได้รับข้อเสนอแนะ ฉันให้ความสำคัญกับเนื้อหาที่ชัดเจนและมีหลักฐาน มากกว่าความอ้อมค้อม'},\n    {a:'TF',k:'F',zh:'給別人回饋時，我會留意說法是否尊重對方，也能讓他願意繼續溝通。',th:'เมื่อให้ข้อเสนอแนะ ฉันใส่ใจว่าคำพูดเคารพอีกฝ่ายและทำให้เขายังอยากสื่อสารต่อหรือไม่'},\n    {a:'TF',k:'T',zh:'意見不合時，我能把「不同意一個想法」和「不喜歡一個人」分開。',th:'เมื่อเห็นไม่ตรงกัน ฉันแยกได้ว่าการไม่เห็นด้วยกับความคิดไม่เท่ากับไม่ชอบตัวบุคคล'},\n    {a:'TF',k:'F',zh:'團隊合作時，我會注意是否有人被忽略、沒有機會表達。',th:'เมื่อทำงานเป็นทีม ฉันคอยสังเกตว่ามีใครถูกมองข้ามหรือไม่มีโอกาสแสดงความคิดเห็นหรือไม่'},\n    {a:'TF',k:'T',zh:'遇到衝突時，我傾向先釐清問題、證據與各自的責任。',th:'เมื่อเกิดความขัดแย้ง ฉันมักเริ่มจากการแยกปัญหา หลักฐาน และความรับผิดชอบของแต่ละฝ่าย'},\n    {a:'TF',k:'F',zh:'遇到衝突時，我傾向先理解每個人的在意之處，再找共同方向。',th:'เมื่อเกิดความขัดแย้ง ฉันมักทำความเข้าใจสิ่งที่แต่ละคนใส่ใจก่อน แล้วจึงหาทิศทางร่วมกัน'},\n    // JP: 12 statements keyed to J / P\n    {a:'JP',k:'J',zh:'開始一項任務時，我喜歡先訂出步驟、時間和完成標準。',th:'เมื่อเริ่มงาน ฉันชอบกำหนดขั้นตอน เวลา และเกณฑ์การเสร็จงานไว้ก่อน'},\n    {a:'JP',k:'P',zh:'開始一項任務時，我通常先動手探索，再逐步決定最合適的方法。',th:'เมื่อเริ่มงาน ฉันมักลงมือสำรวจก่อน แล้วค่อยตัดสินใจเลือกวิธีที่เหมาะสม'},\n    {a:'JP',k:'J',zh:'行程或工作安排越早確定，我越能安心投入。',th:'ยิ่งกำหนดตารางหรือแผนงานได้เร็ว ฉันก็ยิ่งทุ่มเทได้อย่างสบายใจ'},\n    {a:'JP',k:'P',zh:'行程保留一些空白，讓我可以依當天情況調整，會更自在。',th:'การเว้นช่วงว่างในตารางเพื่อปรับตามสถานการณ์ของวันนั้นทำให้ฉันสบายใจกว่า'},\n    {a:'JP',k:'J',zh:'我通常喜歡先完成手上的一件事，再開始下一件。',th:'ฉันมักชอบทำงานหนึ่งชิ้นที่อยู่ตรงหน้าให้เสร็จก่อนเริ่มชิ้นถัดไป'},\n    {a:'JP',k:'P',zh:'同時有幾件事需要處理時，我能依當下狀況在任務間切換。',th:'เมื่อต้องจัดการหลายเรื่องพร้อมกัน ฉันสามารถสลับระหว่างงานตามสถานการณ์ได้'},\n    {a:'JP',k:'J',zh:'做完重要決定後，我喜歡盡快定案，讓大家知道下一步。',th:'หลังตัดสินใจเรื่องสำคัญ ฉันชอบสรุปให้เร็วเพื่อให้ทุกคนรู้ขั้นตอนถัดไป'},\n    {a:'JP',k:'P',zh:'只要還有新資訊可能改變選擇，我會想先保留調整的空間。',th:'หากยังมีข้อมูลใหม่ที่อาจเปลี่ยนทางเลือก ฉันอยากเก็บพื้นที่สำหรับปรับเปลี่ยนไว้ก่อน'},\n    {a:'JP',k:'J',zh:'有明確期限的事，我通常會提早安排，避免最後一刻匆忙。',th:'สำหรับงานที่มีกำหนดเวลา ฉันมักวางแผนล่วงหน้าเพื่อหลีกเลี่ยงความเร่งรีบในนาทีสุดท้าย'},\n    {a:'JP',k:'P',zh:'有時在期限帶來的專注感下，我反而能很有效率地完成任務。',th:'บางครั้งความรู้สึกเร่งด่วนจากกำหนดเวลาช่วยให้ฉันจดจ่อและทำงานได้มีประสิทธิภาพ'},\n    {a:'JP',k:'J',zh:'當計畫突然改變時，我通常需要一點時間重新安排優先順序。',th:'เมื่อแผนเปลี่ยนกะทันหัน ฉันมักต้องใช้เวลาสักครู่เพื่อจัดลำดับความสำคัญใหม่'},\n    {a:'JP',k:'P',zh:'當計畫突然改變時，我通常能很快把注意力轉向新的做法。',th:'เมื่อแผนเปลี่ยนกะทันหัน ฉันมักหันความสนใจไปสู่วิธีใหม่ได้อย่างรวดเร็ว'},\n  ];\n\n  const TYPE_META={\n    INTJ:{zh:['策略建築師','先看見結構，再設計下一步。','你喜歡把複雜問題拆成可理解的系統，並為長期目標規劃路徑。獨立思考與高標準是常見資源；別忘了讓計畫留有與人共同修正的空間。'],th:['นักออกแบบกลยุทธ์','มองเห็นโครงสร้าง แล้ววางก้าวถัดไป','คุณชอบแยกปัญหาซับซ้อนให้เป็นระบบที่เข้าใจได้ และวางเส้นทางสู่เป้าหมายระยะยาว การคิดอย่างอิสระและมาตรฐานสูงเป็นจุดแข็งที่พบบ่อย อย่าลืมเปิดพื้นที่ให้ผู้อื่นร่วมปรับแผน'],symbol:'⌘',color:'#8f7ae5'},\n    INTP:{zh:['好奇研究者','追問原理，享受觀念相遇。','你常被有趣的問題吸引，喜歡建立模型、推敲邏輯與保留探索空間。洞察與求知心值得珍惜；把想法整理成別人能使用的成果，會讓影響力更完整。'],th:['นักสำรวจความคิด','ตั้งคำถามถึงหลักการและสนุกกับการพบแนวคิดใหม่','คุณมักสนใจคำถามที่น่าคิด ชอบสร้างแบบจำลอง ตรวจสอบตรรกะ และเก็บพื้นที่ไว้สำรวจ ความเข้าใจลึกซึ้งและใฝ่รู้เป็นสิ่งมีค่า การสรุปแนวคิดให้ผู้อื่นนำไปใช้ได้จะทำให้ผลงานครบถ้วนขึ้น'],symbol:'⌕',color:'#6f9bdc'},\n    ENTJ:{zh:['願景領航者','把方向說清楚，帶著大家前進。','你容易看見目標、資源與決策點，喜歡推動事情取得進展。果斷與組織力能幫助團隊前進；多邀請不同聲音，能讓方向更穩、更有共識。'],th:['ผู้นำทางวิสัยทัศน์','สื่อสารทิศทางให้ชัด แล้วพาทีมเดินหน้า','คุณมักเห็นเป้าหมาย ทรัพยากร และจุดตัดสินใจ ชอบผลักดันให้งานก้าวหน้า ความเด็ดขาดและการจัดระบบช่วยทีมได้มาก การเชิญชวนเสียงที่แตกต่างจะทำให้ทิศทางมั่นคงและเกิดความเห็นร่วมกัน'],symbol:'➤',color:'#ee858f'},\n    ENTP:{zh:['點子探險家','用好奇心打開新的可能。','你喜歡試想「還能怎麼做」，也擅長在交流中碰撞想法。靈活與創新是資源；替重要點子挑選一兩個落地，能避免注意力被太多新方向分散。'],th:['นักผจญภัยทางความคิด','ใช้ความอยากรู้เปิดความเป็นไปได้ใหม่','คุณชอบถามว่า “ยังทำแบบไหนได้อีก” และแลกเปลี่ยนแนวคิดได้ดี ความยืดหยุ่นและความคิดสร้างสรรค์เป็นจุดแข็ง การเลือกแนวคิดสำคัญหนึ่งหรือสองอย่างมาลงมือช่วยไม่ให้ความสนใจกระจายไปหลายทาง'],symbol:'✧',color:'#eb9b53'},\n    INFJ:{zh:['溫柔洞察者','聽見言語背後的意義與需要。','你常同時關注長遠方向與人的內在感受，並希望行動有意義。洞察與同理能帶來深度；留意自己的界線，避免默默承擔超過能量的責任。'],th:['ผู้หยั่งรู้ด้วยความอ่อนโยน','รับฟังความหมายและความต้องการที่ซ่อนอยู่','คุณมักใส่ใจทั้งทิศทางระยะยาวและความรู้สึกภายในของผู้คน พร้อมทำสิ่งที่มีความหมาย ความเข้าใจและความเห็นอกเห็นใจสร้างความลึกซึ้งได้ ระวังขอบเขตของตัวเองและอย่าแบกรับเกินกำลังโดยไม่พูด'],symbol:'❋',color:'#8a78d6'},\n    INFP:{zh:['理想創作者','讓價值成為想像力的指南針。','你重視真誠、個人價值與內在一致，常用想像力看見不同可能。敏銳與創造力是禮物；把理想拆成可實踐的小步驟，也允許自己不必完美。'],th:['ผู้สร้างสรรค์อุดมคติ','ให้คุณค่าเป็นเข็มทิศของจินตนาการ','คุณให้ความสำคัญกับความจริงใจ คุณค่าของตัวเอง และความสอดคล้องภายใน มักใช้จินตนาการมองเห็นทางเลือกใหม่ ความละเอียดอ่อนและความคิดสร้างสรรค์เป็นของขวัญ ลองแบ่งอุดมคติเป็นขั้นเล็ก ๆ และอนุญาตให้ตัวเองไม่ต้องสมบูรณ์แบบ'],symbol:'❀',color:'#d782bc'},\n    ENFJ:{zh:['共鳴引路人','讓每個人的力量都被看見。','你容易察覺團隊氣氛與他人的潛能，也願意協助大家朝共同方向前進。鼓舞與協調是常見優勢；記得自己的需要也值得被照顧，並讓他人為自己的選擇負責。'],th:['ผู้นำทางแห่งความเข้าใจ','ช่วยให้พลังของแต่ละคนถูกมองเห็น','คุณมักสังเกตบรรยากาศทีมและศักยภาพของผู้อื่น พร้อมช่วยให้ทุกคนเดินสู่เป้าหมายร่วมกัน การสร้างแรงบันดาลใจและประสานงานเป็นจุดแข็ง อย่าลืมดูแลความต้องการของตัวเองและให้ผู้อื่นรับผิดชอบการเลือกของตน'],symbol:'♡',color:'#ec819c'},\n    ENFP:{zh:['靈感發光體','在連結與熱情中點亮新方向。','你常帶著熱情探索人、想法與機會，並能讓周圍的人感受到可能性。感染力與創意很珍貴；為重要承諾保留穩定節奏，能讓熱情走得更遠。'],th:['ผู้เปล่งประกายแรงบันดาลใจ','จุดประกายทิศทางใหม่ผ่านความเชื่อมโยงและความกระตือรือร้น','คุณมักสำรวจผู้คน แนวคิด และโอกาสด้วยความกระตือรือร้น ทำให้คนรอบข้างเห็นความเป็นไปได้ พลังดึงดูดและความคิดสร้างสรรค์มีค่า การรักษาจังหวะที่สม่ำเสมอให้กับคำมั่นสำคัญจะช่วยให้แรงบันดาลใจไปได้ไกล'],symbol:'✦',color:'#f18b83'},\n    ISTJ:{zh:['穩健守護者','讓承諾可靠，讓細節到位。','你常重視事實、責任與清楚流程，能穩定地把重要工作完成。可靠與持續力是團隊資源；面對新方法時，先小規模驗證，可能比完全拒絕更安心。'],th:['ผู้พิทักษ์ที่มั่นคง','ทำให้คำมั่นเชื่อถือได้และใส่ใจทุกรายละเอียด','คุณมักให้ความสำคัญกับข้อเท็จจริง ความรับผิดชอบ และขั้นตอนที่ชัดเจน ทำงานสำคัญให้สำเร็จอย่างสม่ำเสมอ ความน่าเชื่อถือและความต่อเนื่องเป็นทรัพยากรของทีม เมื่อลองวิธีใหม่ การทดลองขนาดเล็กอาจสบายใจกว่าการปฏิเสธทั้งหมด'],symbol:'▣',color:'#688fb7'},\n    ISFJ:{zh:['細心照料者','用踏實的關懷讓人安心。','你常留心誰需要支持，也願意以穩定、細緻的方式照顧日常。體貼與責任感很珍貴；練習提出自己的需要，讓照顧也能有來有往。'],th:['ผู้ดูแลอย่างใส่ใจ','ใช้ความห่วงใยที่มั่นคงสร้างความสบายใจ','คุณมักสังเกตว่าใครต้องการความช่วยเหลือ และดูแลเรื่องในชีวิตประจำวันอย่างสม่ำเสมอ ความเอาใจใส่และความรับผิดชอบมีค่า ฝึกบอกความต้องการของตัวเองเพื่อให้การดูแลเกิดขึ้นทั้งสองทาง'],symbol:'❀',color:'#69aa9b'},\n    ESTJ:{zh:['效率推進者','把責任、步驟與進度整理清楚。','你常擅長安排資源、釐清責任並確保事情落實。執行力與秩序感能創造安全感；遇到例外或新情況時，先聽懂脈絡再調整規則，會更有彈性。'],th:['ผู้ขับเคลื่อนอย่างมีประสิทธิภาพ','จัดความรับผิดชอบ ขั้นตอน และความคืบหน้าให้ชัดเจน','คุณมักจัดสรรทรัพยากร ระบุความรับผิดชอบ และทำให้งานเกิดขึ้นจริง ความสามารถในการลงมือและความเป็นระเบียบช่วยสร้างความมั่นใจ เมื่อพบข้อยกเว้นหรือสถานการณ์ใหม่ การเข้าใจบริบทก่อนปรับกติกาจะช่วยให้ยืดหยุ่นขึ้น'],symbol:'⚙',color:'#e4a54f'},\n    ESFJ:{zh:['暖心連結者','把關懷化成看得見的支持。','你常留意團隊成員的需要，願意促成合作與互相照顧。親和與投入能凝聚關係；不同意見不一定代表不和，清楚談界線也能保護彼此。'],th:['ผู้เชื่อมโยงด้วยความอบอุ่น','เปลี่ยนความห่วงใยให้เป็นแรงสนับสนุนที่เห็นได้','คุณมักใส่ใจความต้องการของสมาชิกและช่วยให้เกิดความร่วมมือกับการดูแลกัน ความเป็นมิตรและการมีส่วนร่วมช่วยเชื่อมความสัมพันธ์ ความเห็นต่างไม่ได้แปลว่าไม่สามัคคี การพูดขอบเขตให้ชัดช่วยปกป้องทุกฝ่าย'],symbol:'☼',color:'#e78c9b'},\n    ISTP:{zh:['冷靜解題者','先弄清運作方式，再精準出手。','你常喜歡獨立拆解問題，觀察系統如何運作，並用實際行動測試解法。冷靜與應變是優勢；過程中多同步進度，能減少夥伴不知道你在想什麼。'],th:['ผู้แก้ปัญหาอย่างใจเย็น','เข้าใจวิธีทำงานก่อน แล้วลงมืออย่างแม่นยำ','คุณมักชอบแยกปัญหาด้วยตัวเอง สังเกตระบบ และทดสอบทางแก้ด้วยการลงมือ ความใจเย็นและการรับมือเฉพาะหน้าเป็นจุดแข็ง การแจ้งความคืบหน้าระหว่างทางช่วยไม่ให้เพื่อนร่วมงานสงสัยว่าคุณกำลังคิดอะไร'],symbol:'⌁',color:'#5e9fb8'},\n    ISFP:{zh:['感官美學家','在真實體驗裡找到自己的表達。','你常敏銳感受環境、重視真誠與個人選擇，喜歡用實際作品或行動表達自己。溫和與審美是資源；重要需要及早說出，不必等到受不了才離開。'],th:['ผู้สร้างสุนทรียะจากประสบการณ์','ค้นหาการแสดงออกของตัวเองผ่านประสบการณ์จริง','คุณมักรับรู้บรรยากาศอย่างละเอียด ให้คุณค่ากับความจริงใจและการเลือกด้วยตนเอง ชอบแสดงออกผ่านผลงานหรือการกระทำ ความอ่อนโยนและรสนิยมเป็นจุดแข็ง บอกความต้องการสำคัญตั้งแต่เนิ่น ๆ ไม่ต้องรอจนทนไม่ไหว'],symbol:'❋',color:'#72b79d'},\n    ESTP:{zh:['行動玩家','把握現場訊號，快速嘗試解法。','你常能迅速讀取環境、抓住機會並採取行動。反應力與務實感很有用；重大風險可多留一步評估，也讓長期後果進入考量。'],th:['ผู้ลงมืออย่างคล่องตัว','อ่านสถานการณ์และทดลองทางแก้อย่างรวดเร็ว','คุณมักอ่านสภาพแวดล้อมได้เร็ว คว้าโอกาสและลงมือทำ การตอบสนองและความเป็นจริงมีประโยชน์มาก สำหรับความเสี่ยงสำคัญ ควรเว้นจังหวะประเมินและนำผลระยะยาวมาพิจารณาด้วย'],symbol:'⚡',color:'#e99b56'},\n    ESFP:{zh:['活力聚光者','用熱情和投入讓當下更有溫度。','你常容易投入眼前的人與體驗，也能帶來活力、親和與即時回應。享受當下是天賦；為金錢、時間或承諾安排簡單提醒，能讓自由更安心。'],th:['ผู้เติมชีวิตชีวา','ทำให้ช่วงเวลาตรงหน้าอบอุ่นด้วยพลังและการมีส่วนร่วม','คุณมักมีส่วนร่วมกับผู้คนและประสบการณ์ตรงหน้าได้ดี นำพลัง ความเป็นมิตร และการตอบสนองที่รวดเร็วมาให้ การชื่นชมปัจจุบันเป็นพรสวรรค์ การตั้งเตือนง่าย ๆ เรื่องเงิน เวลา หรือคำมั่นช่วยให้อิสระสบายใจขึ้น'],symbol:'☀',color:'#f07f86'}\n  };\n\n  const MBTI_FORMS=[\n{EI:{E:[\n['想到新點子時，與別人即時交流常讓我更有靈感。','เมื่อมีแนวคิดใหม่ การแลกเปลี่ยนกับผู้อื่นทันทีมักช่วยให้ฉันเกิดไอเดียเพิ่ม'],\n['在工作討論裡，我常主動分享還在發展中的想法。','ในการหารือเรื่องงาน ฉันมักแบ่งปันแนวคิดที่ยังพัฒนาอยู่ก่อน'],\n['我喜歡透過協作邊做邊釐清問題。','ฉันชอบทำงานร่วมกันไปพร้อมกับช่วยกันทำความเข้าใจปัญหา'],\n['加入新團隊時，我會主動找機會認識成員。','เมื่อเข้าทีมใหม่ ฉันมักหาโอกาสทำความรู้จักสมาชิกก่อน'],\n['與人分享工作成果，會讓我更有動力繼續投入。','การแบ่งปันผลงานกับผู้อื่นช่วยให้ฉันมีแรงทำงานต่อมากขึ้น'],\n['聚會中，我通常願意加入正在進行的對話。','ในงานพบปะ ฉันมักพร้อมเข้าร่วมบทสนทนาที่กำลังดำเนินอยู่']\n],I:[\n['面對新點子時，我喜歡先獨自思考，再整理成完整說法。','เมื่อพบแนวคิดใหม่ ฉันชอบคิดด้วยตัวเองก่อนแล้วค่อยเรียบเรียงให้ครบถ้วน'],\n['即使在會議中，我也較常等想法成熟後再發言。','แม้อยู่ในการประชุม ฉันมักรอให้ความคิดชัดเจนก่อนจึงพูด'],\n['長時間與人互動後，我需要安靜一段時間恢復注意力。','หลังมีปฏิสัมพันธ์กับผู้คนเป็นเวลานาน ฉันต้องการเวลาเงียบ ๆ เพื่อฟื้นสมาธิ'],\n['比起大型活動，我更喜歡一對一或小組深入交流。','ฉันชอบพูดคุยเชิงลึกแบบตัวต่อตัวหรือกลุ่มเล็กมากกว่างานใหญ่'],\n['開始新工作前，先閱讀資料會讓我更有把握。','ก่อนเริ่มงานใหม่ การอ่านข้อมูลล่วงหน้าช่วยให้ฉันมั่นใจขึ้น'],\n['在人多的場合，我通常先觀察再決定是否加入。','ในที่ที่มีคนมาก ฉันมักสังเกตก่อนแล้วค่อยตัดสินใจเข้าร่วม']\n]},SN:{S:[\n['檢討品質問題時，我先確認實際發生的缺失與數據。','เมื่อตรวจสอบปัญหาคุณภาพ ฉันเริ่มจากข้อบกพร่องและข้อมูลที่เกิดขึ้นจริง'],\n['評估改善方案時，我會先看現有設備與資源是否能執行。','เมื่อประเมินแนวทางปรับปรุง ฉันตรวจสอบก่อนว่าอุปกรณ์และทรัพยากรที่มีทำได้หรือไม่'],\n['學習新技能時，示範和實際練習最能幫助我掌握。','เมื่อเรียนทักษะใหม่ การสาธิตและฝึกปฏิบัติช่วยให้ฉันเข้าใจได้ดีที่สุด'],\n['回報工作時，我會說明已完成的步驟和具體結果。','เมื่อรายงานงาน ฉันอธิบายขั้นตอนที่ทำแล้วและผลลัพธ์ที่เป็นรูปธรรม'],\n['面對流程變更，我會先了解哪些現行作法已經證明有效。','เมื่อขั้นตอนเปลี่ยน ฉันทำความเข้าใจก่อนว่าวิธีใดที่ใช้อยู่และพิสูจน์แล้วว่าได้ผล'],\n['規劃任務時，我傾向依可取得的資料估計時程。','เมื่อวางแผนงาน ฉันมักประเมินเวลาจากข้อมูลที่มีอยู่']\n],N:[\n['檢討品質問題時，我會思考不同缺失背後是否有共同原因。','เมื่อตรวจสอบปัญหาคุณภาพ ฉันคิดว่าข้อบกพร่องต่าง ๆ อาจมีสาเหตุร่วมกันหรือไม่'],\n['評估改善方案時，我也會考慮未來可以延伸的機會。','เมื่อประเมินแนวทางปรับปรุง ฉันคำนึงถึงโอกาสที่จะต่อยอดในอนาคตด้วย'],\n['學習新技能時，我喜歡先理解原理，再探索不同用法。','เมื่อเรียนทักษะใหม่ ฉันชอบเข้าใจหลักการก่อนแล้วค่อยสำรวจวิธีใช้ที่หลากหลาย'],\n['回報工作時，我會把結果放進整體趨勢中理解。','เมื่อรายงานงาน ฉันนำผลลัพธ์ไปพิจารณาร่วมกับแนวโน้มโดยรวม'],\n['面對流程變更，我會想像它可能如何影響其他環節。','เมื่อขั้นตอนเปลี่ยน ฉันนึกถึงว่าการเปลี่ยนแปลงนั้นอาจกระทบส่วนอื่นอย่างไร'],\n['規劃任務時，我會先推想可能的變化和替代路徑。','เมื่อวางแผนงาน ฉันคิดล่วงหน้าถึงความเปลี่ยนแปลงและทางเลือกอื่น']\n]},TF:{T:[\n['比較供應商時，我會先依一致規格和證據評估。','เมื่อเปรียบเทียบผู้ขาย ฉันประเมินจากข้อกำหนดและหลักฐานเดียวกันก่อน'],\n['分配工作時，我重視責任、能力和工作量是否合理。','เมื่อแบ่งงาน ฉันให้ความสำคัญกับความรับผิดชอบ ความสามารถ และปริมาณงานที่เหมาะสม'],\n['指出問題時，我傾向直接說明事實和改善要求。','เมื่อชี้ปัญหา ฉันมักอธิบายข้อเท็จจริงและสิ่งที่ต้องปรับปรุงอย่างตรงไปตรงมา'],\n['遇到衝突時，我會先核對各方說法是否符合證據。','เมื่อเกิดความขัดแย้ง ฉันตรวจสอบก่อนว่าคำอธิบายของแต่ละฝ่ายสอดคล้องกับหลักฐานหรือไม่'],\n['時間有限時，我會比較各選項的成本和預期效果。','เมื่อเวลาจำกัด ฉันเปรียบเทียบต้นทุนและผลที่คาดหวังของแต่ละทางเลือก'],\n['做決定時，我重視規則能否公平地用在每個人身上。','เมื่อตัดสินใจ ฉันให้ความสำคัญกับการใช้กฎอย่างเป็นธรรมกับทุกคน']\n],F:[\n['比較供應商時，我也會考慮合作關係對團隊的長期影響。','เมื่อเปรียบเทียบผู้ขาย ฉันคำนึงถึงผลระยะยาวของความร่วมมือที่มีต่อทีมด้วย'],\n['分配工作時，我會留意每個人的壓力與支援需求。','เมื่อแบ่งงาน ฉันใส่ใจความกดดันและความต้องการความช่วยเหลือของแต่ละคน'],\n['指出問題時，我會想怎麼表達才能讓對方理解並願意改善。','เมื่อชี้ปัญหา ฉันคิดว่าจะสื่อสารอย่างไรให้อีกฝ่ายเข้าใจและอยากปรับปรุง'],\n['遇到衝突時，我會先聽清楚每個人真正重視的事。','เมื่อเกิดความขัดแย้ง ฉันฟังก่อนว่าแต่ละคนให้ความสำคัญกับเรื่องใดจริง ๆ'],\n['時間有限時，我會衡量各選項對相關人員的實際影響。','เมื่อเวลาจำกัด ฉันประเมินผลกระทบจริงของแต่ละทางเลือกต่อผู้เกี่ยวข้อง'],\n['做決定時，我會考慮它是否符合團隊共同重視的價值。','เมื่อตัดสินใจ ฉันพิจารณาว่าสอดคล้องกับคุณค่าที่ทีมให้ความสำคัญร่วมกันหรือไม่']\n]},JP:{J:[\n['開始專案前，我會先把里程碑和檢查點排進計畫。','ก่อนเริ่มโครงการ ฉันกำหนดหมุดหมายและจุดตรวจสอบไว้ในแผน'],\n['手上工作還沒收尾時，我較難安心轉去做另一件事。','เมื่อยังปิดงานที่ทำอยู่ไม่เสร็จ ฉันรู้สึกไม่ค่อยสบายใจที่จะไปทำงานอื่น'],\n['我喜歡提早確認行程，以減少臨時變動。','ฉันชอบยืนยันกำหนดการล่วงหน้าเพื่อลดการเปลี่ยนแปลงกะทันหัน'],\n['決策完成後，我通常樂於依既定計畫往下執行。','เมื่อตัดสินใจแล้ว ฉันมักพร้อมทำงานต่อไปตามแผนที่กำหนด'],\n['我會定期查看進度，避免期限在忙碌中被忽略。','ฉันตรวจความคืบหน้าเป็นระยะเพื่อไม่ให้ลืมกำหนดส่งระหว่างงานยุ่ง'],\n['待辦事項有清楚順序時，我通常更有效率。','เมื่อรายการงานมีลำดับชัดเจน ฉันมักทำงานได้มีประสิทธิภาพขึ้น']\n],P:[\n['開始專案時，我喜歡先試做一小段，再決定完整計畫。','เมื่อเริ่มโครงการ ฉันชอบทดลองทำส่วนเล็ก ๆ ก่อนแล้วค่อยวางแผนทั้งหมด'],\n['多項工作同時進行時，我會依最新情況調整先後次序。','เมื่อทำหลายงานพร้อมกัน ฉันปรับลำดับตามสถานการณ์ล่าสุด'],\n['我喜歡保留一些可變動時間，以應付新機會或問題。','ฉันชอบเว้นเวลาให้ปรับเปลี่ยนได้เพื่อรับมือโอกาสหรือปัญหาใหม่'],\n['即使計畫已定，發現更好的方法時我也願意改方向。','แม้กำหนดแผนแล้ว หากพบวิธีที่ดีกว่าฉันก็พร้อมเปลี่ยนทิศทาง'],\n['我通常在工作推進時逐步確定最後細節。','ฉันมักกำหนดรายละเอียดสุดท้ายไปทีละขั้นระหว่างทำงาน'],\n['面對開放式任務，我享受先探索不同做法再選擇。','เมื่อต้องทำงานที่เปิดกว้าง ฉันสนุกกับการสำรวจหลายวิธีก่อนเลือก']\n]}}\n,{EI:{E:[\n['休息時，我常想找朋友聊聊或一起做活動。','ในเวลาพัก ฉันมักอยากคุยกับเพื่อนหรือทำกิจกรรมด้วยกัน'],\n['需要協調時，我會先開啟對話，讓大家交換看法。','เมื่อต้องประสานงาน ฉันเริ่มบทสนทนาเพื่อให้ทุกคนแลกเปลี่ยนมุมมอง'],\n['多人互動常讓我感到精神被帶動。','การมีปฏิสัมพันธ์กับคนหลายคนมักช่วยกระตุ้นพลังของฉัน'],\n['我常在說明的過程中整理出自己的觀點。','ฉันมักเรียบเรียงมุมมองของตัวเองไปพร้อมกับการอธิบาย'],\n['面對陌生同事，我通常不難開口建立聯繫。','เมื่อพบเพื่อนร่วมงานที่ไม่คุ้นเคย ฉันมักเริ่มทำความรู้จักได้ไม่ยาก'],\n['團隊完成任務時，我喜歡即時和大家分享感受。','เมื่อทีมทำงานสำเร็จ ฉันชอบแบ่งปันความรู้สึกกับทุกคนทันที']\n],I:[\n['休息時，我通常選擇安靜的個人活動恢復精神。','ในเวลาพัก ฉันมักเลือกกิจกรรมเงียบ ๆ ทำคนเดียวเพื่อฟื้นพลัง'],\n['需要協調時，我會先整理重點，再提出想法。','เมื่อต้องประสานงาน ฉันจัดประเด็นสำคัญก่อนแล้วค่อยเสนอความคิด'],\n['多人互動會消耗我的精力，我需要留時間獨處。','การพบปะผู้คนหลายคนใช้พลังของฉัน จึงต้องเผื่อเวลาอยู่คนเดียว'],\n['我常先在心裡整理觀點，再用精簡方式說明。','ฉันมักเรียบเรียงมุมมองในใจก่อนแล้วค่อยอธิบายอย่างกระชับ'],\n['面對陌生同事，我需要一些時間熟悉後再互動。','เมื่อพบเพื่อนร่วมงานที่ไม่คุ้นเคย ฉันต้องใช้เวลาทำความคุ้นเคยก่อน'],\n['團隊完成任務後，我較喜歡先安靜回顧自己的感受。','หลังทีมทำงานสำเร็จ ฉันชอบทบทวนความรู้สึกของตัวเองเงียบ ๆ ก่อน']\n]},SN:{S:[\n['追查異常時，我先核對批次、站點與時間等具體資訊。','เมื่อติดตามความผิดปกติ ฉันตรวจสอบข้อมูลจริง เช่น ล็อต สถานี และเวลา'],\n['安排工作時，我依照清楚的作業步驟逐項確認。','เมื่อจัดงาน ฉันตรวจสอบทีละข้อโดยอ้างอิงขั้นตอนการทำงานที่ชัดเจน'],\n['學到新方法後，我會先找熟悉的任務實際試用。','หลังเรียนรู้วิธีใหม่ ฉันลองใช้กับงานที่คุ้นเคยก่อน'],\n['整理資料時，我較容易注意到可直接觀察的變化。','เมื่อจัดข้อมูล ฉันมักสังเกตเห็นการเปลี่ยนแปลงที่มองเห็นได้โดยตรง'],\n['回顧成果時，我先比較實際目標與已完成的數量。','เมื่อทบทวนผลงาน ฉันเปรียบเทียบเป้าหมายจริงกับปริมาณที่ทำเสร็จก่อน'],\n['解決問題時，我傾向先確認現在可採取的措施。','เมื่อแก้ปัญหา ฉันมักตรวจสอบมาตรการที่ทำได้ในตอนนี้ก่อน']\n],N:[\n['追查異常時，我會找出各批次或站點之間可能的關聯。','เมื่อติดตามความผิดปกติ ฉันมองหาความเชื่อมโยงระหว่างล็อตหรือสถานีต่าง ๆ'],\n['安排工作時，我會思考若改變步驟，整體工作會如何相互連動。','เมื่อจัดงาน ฉันคิดต่อว่าหากเปลี่ยนขั้นตอน งานทั้งหมดจะเชื่อมโยงกันอย่างไร'],\n['學到新方法後，我會先想它還能用在哪些不同情境。','หลังเรียนรู้วิธีใหม่ ฉันคิดก่อนว่ายังนำไปใช้ในสถานการณ์ใดได้อีก'],\n['整理資料時，我常留意數據暗示的長期趨勢。','เมื่อจัดข้อมูล ฉันมักใส่ใจแนวโน้มระยะยาวที่ข้อมูลบ่งชี้'],\n['回顧成果時，我會思考結果對下一步方向代表什麼。','เมื่อทบทวนผลงาน ฉันคิดว่าผลลัพธ์บอกอะไรเกี่ยวกับทิศทางถัดไป'],\n['解決問題時，我喜歡先探索幾種可能的根本原因。','เมื่อแก้ปัญหา ฉันชอบสำรวจสาเหตุรากหลายแบบที่เป็นไปได้ก่อน']\n]},TF:{T:[\n['資源不足時，我會依影響和成本排出優先次序。','เมื่อทรัพยากรไม่พอ ฉันจัดลำดับความสำคัญจากผลกระทบและต้นทุน'],\n['核准方案前，我會檢查推理是否一致且有證據支持。','ก่อนอนุมัติแนวทาง ฉันตรวจสอบว่าเหตุผลสอดคล้องกันและมีหลักฐานรองรับ'],\n['回應抱怨時，我會先釐清事實和責任範圍。','เมื่อตอบข้อร้องเรียน ฉันชี้แจงข้อเท็จจริงและขอบเขตความรับผิดชอบก่อน'],\n['遇到規則例外，我會評估同一規則用在所有人身上是否合理。','เมื่อมีข้อยกเว้น ฉันประเมินว่าการใช้กฎเดียวกันกับทุกคนยังสมเหตุสมผลหรือไม่'],\n['意見衝突時，我重視能否提出可比較的標準。','เมื่อความเห็นขัดแย้งกัน ฉันให้ความสำคัญกับการมีเกณฑ์เปรียบเทียบที่ชัดเจน'],\n['給予評價時，我會區分工作結果與對人的好惡。','เมื่อประเมินผลงาน ฉันแยกผลลัพธ์ของงานออกจากความชอบหรือไม่ชอบส่วนตัว']\n],F:[\n['資源不足時，我會先了解哪些人或需求受到最大影響。','เมื่อทรัพยากรไม่พอ ฉันทำความเข้าใจก่อนว่าใครหรือความต้องการใดได้รับผลกระทบมากที่สุด'],\n['核准方案前，我會想它將如何改變合作關係。','ก่อนอนุมัติแนวทาง ฉันคิดว่าแนวทางนั้นจะเปลี่ยนความสัมพันธ์ในการทำงานอย่างไร'],\n['回應抱怨時，我會先讓對方知道我理解他的處境。','เมื่อตอบข้อร้องเรียน ฉันทำให้อีกฝ่ายรู้ก่อนว่าฉันเข้าใจสถานการณ์ของเขา'],\n['遇到規則例外，我會考慮特殊情境和人的需要。','เมื่อมีข้อยกเว้น ฉันคำนึงถึงสถานการณ์เฉพาะและความต้องการของผู้คน'],\n['意見衝突時，我會尋找各方都能接受的共同點。','เมื่อความเห็นขัดแย้งกัน ฉันมองหาจุดร่วมที่ทุกฝ่ายยอมรับได้'],\n['給予評價時，我會留意回饋是否維護對方的尊嚴。','เมื่อให้การประเมิน ฉันใส่ใจว่าคำตอบกลับยังคงเคารพศักดิ์ศรีของอีกฝ่ายหรือไม่']\n]},JP:{J:[\n['開始工作前，我喜歡確認交付內容和負責人。','ก่อนเริ่มงาน ฉันชอบยืนยันสิ่งที่ต้องส่งมอบและผู้รับผิดชอบ'],\n['我會把大型任務拆成階段，完成後逐項確認。','ฉันแบ่งงานใหญ่เป็นช่วง ๆ แล้วตรวจสอบทีละข้อเมื่อทำเสร็จ'],\n['截止日期越清楚，我越容易安排自己的步調。','ยิ่งกำหนดส่งชัดเจน ฉันยิ่งจัดจังหวะการทำงานได้ง่าย'],\n['安排假期或外出時，我通常會提前決定主要行程。','เมื่อวางแผนวันหยุดหรือออกไปข้างนอก ฉันมักกำหนดกำหนดการหลักล่วงหน้า'],\n['遇到多個選項時，我喜歡設定期限後選定一個。','เมื่อมีหลายทางเลือก ฉันชอบกำหนดเวลาตัดสินใจแล้วเลือกหนึ่งทาง'],\n['事情告一段落後，我會整理並關閉未完成事項。','เมื่อเรื่องหนึ่งใกล้เสร็จ ฉันจัดระเบียบและปิดรายการที่ยังค้าง']\n],P:[\n['開始工作前，我喜歡先看實際情況再決定交付方式。','ก่อนเริ่มงาน ฉันชอบดูสถานการณ์จริงก่อนแล้วค่อยตัดสินใจวิธีส่งมอบ'],\n['面對大型任務，我可能先探索幾種做法再拆解步驟。','เมื่อเจองานใหญ่ ฉันอาจสำรวจหลายวิธีก่อนแล้วค่อยแบ่งเป็นขั้นตอน'],\n['我習慣依進度和新資訊調整工作步調。','ฉันมักปรับจังหวะการทำงานตามความคืบหน้าและข้อมูลใหม่'],\n['安排假期或外出時，我喜歡保留空間臨時決定。','เมื่อวางแผนวันหยุดหรือออกไปข้างนอก ฉันชอบเหลือเวลาไว้ตัดสินใจภายหลัง'],\n['面對多個選項時，我會先多收集一些資訊再決定。','เมื่อมีหลายทางเลือก ฉันรวบรวมข้อมูลเพิ่มก่อนตัดสินใจ'],\n['工作接近完成時，我仍可能依新資訊調整內容。','เมื่องานใกล้เสร็จ ฉันยังอาจปรับเนื้อหาตามข้อมูลใหม่']\n]}}\n\n];\nconst AXIS_QUESTIONS_EXPECTED=48,STORE_KEY='personalityExplorerV2Offline',REPEAT_KEY='personalityExplorerV2Previous',$=id=>document.getElementById(id);let lang='zh',order=[],answers=[],index=0,lastResult=null,previousResult=null,activeFormIndex=0,participantKey='guest';\n  function escapeHTML(value){return String(value??'').replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[char]))}\n  function t(){return UI[lang]}\n  function scopedKey(key){return key+'::'+encodeURIComponent(participantKey)}\n  function loadSaved(){try{const raw=localStorage.getItem(scopedKey(STORE_KEY));if(!raw)return null;const data=JSON.par :'คัดลอกอัตโนมัติไม่ได้ กรุณาใช้เมนูพิมพ์เพื่อบันทึก',print:'พิมพ์／บันทึก PDF',home:'กลับหน้าแรก',summary:'ผลสำรวจสไตล์ DISC ในการทำงานของฉัน',confirmReset:'เริ่มตอบใหม่จะลบคำตอบปัจจุบัน ต้องการดำเนินการหรือไม่',confirmExit:'ออกจากแบบสำรวจหรือไม่ คำตอบถูกบันทึกอัตโนมัติแล้วและกลับมาทำต่อได้'},\n};\nUI.zh.mixedTitle='多風格協作型';UI.zh.mixedIntro='這次作答中，多種風格得分接近或並列；請以分布圖和各風格解說為主，不必勉強套入單一組合。';UI.zh.topTiedLabel='並列突出的風格';UI.zh.supportTiedLabel='次高分並列';\nUI.th.mixedTitle='รูปแบบผสมที่หลากหลาย';UI.th.mixedIntro='คำตอบครั้งนี้มีหลายสไตล์ที่ได้คะแนนใกล้เคียงหรือเสมอกัน โปรดดูแผนภูมิและคำอธิบายแต่ละด้าน ไม่จำเป็นต้องฝืนจัดเข้าประเภทเดียว';UI.th.topTiedLabel='สไตล์เด่นที่คะแนนเสมอกัน';UI.th.supportTiedLabel='คะแนนรองที่เสมอกัน';\n\nconst STYLES={\n D:{color:'#ef6d69',icon:'⚡',name:{zh:'支配型 D · 果斷推進者',th:'มุ่งผลลัพธ์ D · ผู้ขับเคลื่อนอย่างเด็ดขาด'},brief:{zh:'偏好直接面對挑戰、快速決策並推動成果。',th:'ชอบเผชิญความท้าทาย ตัดสินใจรวดเร็ว และผลักดันผลงานให้เกิดขึ้น'},fields:{\n strength:{zh:'你常能迅速抓出核心問題、做出決定並承擔推進責任。在時程緊、目標清楚的場合，果斷和行動力能讓團隊不原地打轉。',th:'คุณมักจับประเด็นหลัก ตัดสินใจ และรับผิดชอบผลักดันงานได้รวดเร็ว เมื่อเวลาจำกัดและเป้าหมายชัด ความเด็ดขาดช่วยให้ทีมเดินหน้าต่อได้'},\n blind:{zh:'速度與直接若沒有確認理解，可能讓他人覺得被催促、被越過或缺少參與。也可能太快定案，漏看風險與執行細節。',th:'ความรวดเร็วและตรงไปตรงมาโดยไม่ตรวจสอบความเข้าใจ อาจทำให้ผู้อื่นรู้สึกถูกเร่งหรือไม่มีส่วนร่วม และการสรุปเร็วเกินไปอาจมองข้ามความเสี่ยงกับรายละเอียด'},\n values:{zh:'常重視成果、效率、自主權、挑戰與能看見的進展；偏好有決策空間、責任清楚的合作。',th:'มักให้คุณค่ากับผลงาน ประสิทธิภาพ อิสระ ความท้าทาย และความคืบหน้าที่มองเห็นได้ ชอบมีอำนาจตัดสินใจและความรับผิดชอบชัดเจน'},\n communication:{zh:'偏好先講結論、目標、期限與選項。若要說服你，提出重點、影響和可執行方案；也請記得詢問別人是否有關鍵資訊。',th:'ชอบฟังข้อสรุป เป้าหมาย กำหนดเวลา และทางเลือกก่อน หากต้องการโน้มน้าว ควรเสนอประเด็นสำคัญ ผลกระทบ และแนวทางที่ทำได้ พร้อมเปิดโอกาสให้ผู้อื่นให้ข้อมูลสำคัญ'},\n relationships:{zh:'常以解決問題、扛責任和替團隊清除障礙表達支持。多給肯定、聽完不同意見，能讓關係不只建立在結果上。',th:'มักแสดงการสนับสนุนด้วยการแก้ปัญหา รับผิดชอบ และขจัดอุปสรรคให้ทีม การชื่นชมและฟังความเห็นต่างให้จบช่วยให้ความสัมพันธ์ไม่ยึดติดกับผลงานเพียงอย่างเดียว'},\n work:{zh:'適合有挑戰、授權與明確成果指標的任務。把大型目標拆成檢查點，並邀請執行者共同評估可行性，通常能兼顧速度與品質。',th:'มักเหมาะกับงานที่ท้าทาย มีอำนาจตัดสินใจ และตัวชี้วัดชัดเจน การแบ่งเป้าหมายใหญ่เป็นจุดตรวจสอบและให้ผู้ปฏิบัติร่วมประเมินช่วยรักษาทั้งความเร็วและคุณภาพ'},\n pressure:{zh:'壓力下可能更強勢、急著控制進度、打斷別人，或把休息看成拖延。停下來確認風險和團隊負荷，有助避免過度推進。',th:'เมื่อเครียดอาจใช้อำนาจมากขึ้น เร่งควบคุมงาน พูดแทรก หรือมองการพักว่าเป็นการถ่วงเวลา การหยุดตรวจความเสี่ยงและภาระทีมช่วยไม่ให้ผลักดันเกินไป'},\n growth:{zh:'練習先問一個澄清問題、給團隊明確的決策理由，並區分「緊急」和「重要」。讓別人參與，不會削弱你的果斷。',th:'ฝึกถามเพื่อความชัดเจนก่อนหนึ่งคำถาม อธิบายเหตุผลในการตัดสินใจ และแยกเรื่องเร่งด่วนออกจากเรื่องสำคัญ การให้ทีมมีส่วนร่วมไม่ได้ลดความเด็ดขาดของคุณ'}}},\n I:{color:'#e9a73c',icon:'✦',name:{zh:'影響型 I · 熱情連結者',th:'ชักจูงและสร้างสัมพันธ์ I · ผู้เชื่อมโยงอย่างกระตือรือร้น'},brief:{zh:'偏好透過互動建立連結、分享想法並帶動他人。',th:'ชอบสร้างความสัมพันธ์ แลกเปลี่ยนแนวคิด และสร้างแรงกระตุ้นผ่านการปฏิสัมพันธ์'},fields:{\n strength:{zh:'你常能快速打開話題、鼓舞氣氛、解讀他人反應並建立人脈。面對需要溝通、協調或爭取支持的任務，熱情和表達力很有幫助。',th:'คุณมักเริ่มบทสนทนา สร้างบรรยากาศ อ่านปฏิกิริยาของผู้อื่น และสร้างเครือข่ายได้ดี ความกระตือรือร้นกับทักษะการสื่อสารช่วยในงานประสานงานและขอความร่วมมือ'},\n blind:{zh:'熱情有時會帶來過度承諾、話題跳轉或低估細節與後續追蹤。也可能太在意認同，而不容易提出不受歡迎但必要的事實。',th:'ความกระตือรือร้นอาจทำให้รับปากมากเกินไป เปลี่ยนประเด็นเร็ว หรือประเมินรายละเอียดและการติดตามต่ำเกินไป บางครั้งอาจกังวลกับการยอมรับจนไม่กล้าพูดข้อเท็จจริงที่จำเป็น'},\n values:{zh:'常重視人際連結、被看見、正向氣氛、創意與參與感；在有互動和回饋的環境較容易投入。',th:'มักให้คุณค่ากับความสัมพันธ์ การได้รับการยอมรับ บรรยากาศเชิงบวก ความคิดสร้างสรรค์ และการมีส่วนร่วม มักมีแรงจูงใจเมื่อได้ปฏิสัมพันธ์และรับข้อมูลตอบกลับ'},\n communication:{zh:'喜歡有溫度、能交換想法的對話。討論後用簡短清單確認誰負責、何時完成，可把共識轉成行動。',th:'ชอบบทสนทนาที่อบอุ่นและแลกเปลี่ยนความคิดได้ หลังคุยกันควรสรุปสั้น ๆ ว่าใครรับผิดชอบและเสร็จเมื่อไร เพื่อเปลี่ยนความเห็นร่วมให้เป็นการลงมือ'},\n relationships:{zh:'常透過鼓勵、關心近況、邀請參與來連結他人。留意每個人表達親近的方式不同，也尊重需要安靜和私人空間的夥伴。',th:'มักเชื่อมสัมพันธ์ด้วยการให้กำลังใจ ถามไถ่ และชวนมีส่วนร่วม ผู้คนแสดงความสนิทสนมต่างกัน ควรเคารพเพื่อนร่วมงานที่ต้องการความสงบและพื้นที่ส่วนตัว'},\n work:{zh:'適合需要協調、分享、簡報、客戶互動或激發參與的任務。為承諾建立提醒、書面紀錄和明確交付，可讓點子持續落地。',th:'มักเหมาะกับงานประสานงาน แบ่งปัน นำเสนอ ติดต่อผู้ใช้บริการ หรือกระตุ้นการมีส่วนร่วม การตั้งเตือน จดบันทึก และกำหนดสิ่งส่งมอบช่วยให้แนวคิดเกิดผลต่อเนื่อง'},\n pressure:{zh:'壓力下可能更需要他人即時回應、說得多做得少，或用樂觀掩蓋不安。把擔心具體說出來，比一直維持氣氛更有效。',th:'เมื่อเครียดอาจต้องการการตอบสนองทันที พูดมากกว่าลงมือ หรือใช้ความมองโลกในแง่ดีซ่อนความกังวล การบอกสิ่งที่กังวลอย่างชัดเจนมักได้ผลกว่าการรักษาบรรยากาศตลอดเวลา'},\n growth:{zh:'練習把承諾寫下來、一次聚焦一個下一步，也主動邀請較安靜的人發言。真誠的界線不會減少你的親和力。',th:'ฝึกจดคำมั่นให้ชัด โฟกัสขั้นตอนถัดไปทีละเรื่อง และเชิญคนที่เงียบกว่าให้แสดงความคิดเห็น ขอบเขตที่จริงใจไม่ได้ลดความเป็นมิตรของคุณ'}}},\n S:{color:'#39a993',icon:'☘',name:{zh:'穩健型 S · 團隊守護者',th:'มั่นคงและสนับสนุน S · ผู้ดูแลทีมอย่างสม่ำเสมอ'},brief:{zh:'偏好維持穩定合作、耐心支持並按步調推進。',th:'ชอบรักษาความร่วมมือที่มั่นคง สนับสนุนอย่างอดทน และเดินหน้าตามจังหวะที่เหมาะสม'},fields:{\n strength:{zh:'你常是可靠的合作夥伴：願意聽、持續跟進、留意他人需要，也能穩定完成重複而重要的工作。團隊變動時，你常能維持互相支持。',th:'คุณมักเป็นเพื่อนร่วมงานที่ไว้ใจได้ รับฟัง ติดตามงาน ใส่ใจความต้องการของคนอื่น และทำงานสำคัญที่ต้องทำซ้ำได้สม่ำเสมอ ช่วยให้ทีมสนับสนุนกันเมื่อเกิดการเปลี่ยนแปลง'},\n blind:{zh:'為了和諧可能把疑慮留在心裡、答應太多或延後面對衝突。變動若沒有說明，也可能讓你感到不安而遲遲不表態。',th:'เพื่อรักษาความกลมเกลียว คุณอาจเก็บข้อกังวลไว้ รับปากมากเกิน หรือเลื่อนการเผชิญความขัดแย้ง หากไม่มีคำอธิบายเรื่องการเปลี่ยนแปลง คุณอาจไม่มั่นใจและยังไม่แสดงจุดยืน'},\n values:{zh:'常重視信任、穩定、互相扶持、可預期的安排與團隊歸屬感；希望改變有準備、有交代。',th:'มักให้คุณค่ากับความไว้วางใจ ความมั่นคง การช่วยเหลือกัน แผนที่คาดการณ์ได้ และความรู้สึกเป็นส่วนหนึ่งของทีม ต้องการให้การเปลี่ยนแปลงมีการเตรียมตัวและชี้แจง'},\n communication:{zh:'偏好有耐心、尊重且不逼迫的交流。若需要你改變做法，先說明原因、步驟和可取得的支持，會比較容易建立信心。',th:'ชอบการสื่อสารที่อดทน ให้เกียรติ และไม่กดดัน หากต้องการให้ปรับวิธีทำงาน ควรอธิบายเหตุผล ขั้นตอน และการสนับสนุนที่จะได้รับเพื่อสร้างความมั่นใจ'},\n relationships:{zh:'常透過傾聽、記住承諾、默默補位來表達在乎。練習直接說出自己的界線和不同意見，能建立更對等的關係。',th:'มักแสดงความใส่ใจด้วยการรับฟัง จำคำมั่น และช่วยเติมเต็มงานที่ขาด การบอกขอบเขตและความเห็นต่างอย่างตรงไปตรงมาช่วยให้ความสัมพันธ์สมดุลขึ้น'},\n work:{zh:'適合目標連續、角色清楚、團隊穩定且能有充分交接的任務。面對變更時，先提供影響範圍與過渡安排，有助維持節奏。',th:'มักเหมาะกับงานที่มีเป้าหมายต่อเนื่อง บทบาทชัด ทีมมั่นคง และส่งต่องานครบถ้วน เมื่อมีการเปลี่ยนแปลง การแจ้งผลกระทบและแผนช่วงเปลี่ยนผ่านช่วยรักษาจังหวะงาน'},\n pressure:{zh:'壓力下可能沉默、避免衝突、難以拒絕，或在累積很久後突然抽離。定期檢查負荷，比等到耗盡才求助更好。',th:'เมื่อเครียดอาจเงียบ เลี่ยงความขัดแย้ง ปฏิเสธไม่ลง หรือถอยห่างหลังเก็บความรู้สึกไว้นาน การตรวจสอบภาระเป็นระยะดีกว่ารอจนหมดแรงแล้วค่อยขอความช่วยเหลือ'},\n growth:{zh:'練習及早提出疑慮、把支持他人與替他人承擔分開，並在安全的小範圍內嘗試新做法。',th:'ฝึกพูดข้อกังวลตั้งแต่เนิ่น ๆ แยกการสนับสนุนออกจากการรับภาระแทนผู้อื่น และลองวิธีใหม่ในขอบเขตเล็ก ๆ ที่ปลอดภัย'}}},\n C:{color:'#6489d7',icon:'⌕',name:{zh:'謹慎型 C · 品質分析家',th:'รอบคอบและตรวจสอบ C · นักวิเคราะห์คุณภาพ'},brief:{zh:'偏好依據資訊、標準與細節，確保結論可靠。',th:'ชอบใช้ข้อมูล มาตรฐาน และรายละเอียดเพื่อให้ข้อสรุปเชื่อถือได้'},fields:{\n strength:{zh:'你常擅長檢查資料、辨認差異、釐清規範並預先發現風險。需要品質、精確度或可追溯性的工作，細心與邏輯特別有價值。',th:'คุณมักตรวจข้อมูล แยกแยะความแตกต่าง ทำความเข้าใจข้อกำหนด และมองเห็นความเสี่ยงล่วงหน้า ความละเอียดและตรรกะมีคุณค่ามากกับงานด้านคุณภาพ ความแม่นยำ และการตรวจสอบย้อนกลับ'},\n blind:{zh:'追求正確可能讓決策拖延、過度檢查，或讓別人覺得只看錯誤、不看努力。資料不足時，先界定可接受風險和決策期限。',th:'การมุ่งความถูกต้องอาจทำให้ตัดสินใจช้า ตรวจซ้ำมากเกิน หรือทำให้ผู้อื่นรู้สึกว่ามองเห็นแต่ข้อผิดพลาดไม่เห็นความพยายาม เมื่อข้อมูลไม่ครบ ควรกำหนดความเสี่ยงที่ยอมรับได้และเวลาตัดสินใจ'},\n values:{zh:'常重視正確性、證據、一致標準、專業能力與把事情一次做好；偏好有準備、可驗證的決策。',th:'มักให้คุณค่ากับความถูกต้อง หลักฐาน มาตรฐานที่สม่ำเสมอ ความเชี่ยวชาญ และการทำงานให้ถูกต้องตั้งแต่แรก ชอบการตัดสินใจที่เตรียมพร้อมและตรวจสอบได้'},\n communication:{zh:'偏好清楚定義、背景資料、依據和具體問題。提出意見時先說結論，再列出證據與風險；也確認對方需要多少細節。',th:'ชอบคำจำกัดความ บริบท ข้อมูลอ้างอิง และคำถามที่ชัดเจน เมื่อนำเสนอความเห็น ควรบอกข้อสรุปก่อนแล้วตามด้วยหลักฐานและความเสี่ยง พร้อมตรวจสอบว่าอีกฝ่ายต้องการรายละเอียดระดับใด'},\n relationships:{zh:'常以提供可靠資訊、指出可能風險和履行專業責任來表達關心。多說明你提出修正是為了共同成果，而不是否定個人。',th:'มักแสดงความใส่ใจด้วยการให้ข้อมูลที่เชื่อถือได้ ชี้ความเสี่ยง และรับผิดชอบตามหน้าที่ การอธิบายว่าข้อเสนอให้แก้ไขมุ่งที่ผลงานร่วม ไม่ใช่การปฏิเสธตัวบุคคล ช่วยรักษาความสัมพันธ์'},\n work:{zh:'適合需要分析、標準、風險控管、文件或品質保證的任務。設定「足以決策」的資料門檻與完成期限，可兼顧嚴謹和速度。',th:'มักเหมาะกับงานวิเคราะห์ มาตรฐาน ควบคุมความเสี่ยง เอกสาร หรือประกันคุณภาพ การกำหนดเกณฑ์ข้อมูลที่เพียงพอต่อการตัดสินใจและเวลาส่งงานช่วยรักษาทั้งความรอบคอบและความเร็ว'},\n pressure:{zh:'壓力下可能退回細節、反覆檢查、避免未證實的決定，或用挑錯來降低不確定感。需要時先做暫行方案並明列假設。',th:'เมื่อเครียดอาจจมกับรายละเอียด ตรวจซ้ำ เลี่ยงการตัดสินใจที่ยังยืนยันไม่ได้ หรือจับผิดเพื่อลดความไม่แน่นอน หากจำเป็นให้ใช้แนวทางชั่วคราวพร้อมระบุสมมติฐานให้ชัด'},\n growth:{zh:'練習區分必要標準與偏好細節，接受「目前最佳可用」而非完美，也在指出問題時同步提出可行的下一步。',th:'ฝึกแยกมาตรฐานที่จำเป็นออกจากรายละเอียดที่เป็นเพียงความชอบ ยอมรับสิ่งที่ดีที่สุดและใช้ได้ในตอนนี้แทนความสมบูรณ์แบบ พร้อมเสนอขั้นตอนถัดไปที่ทำได้เมื่อชี้ปัญหา'}}},\n};\n\nconst PAIRS={\n DI:{zh:['成果開拓者','以果斷行動打開局面，再用熱情凝聚支持。'],th:['ผู้บุกเบิกผลงาน','เปิดทางด้วยการลงมืออย่างเด็ดขาด แล้วรวมแรงสนับสนุนด้วยพลังบวก']},DS:{zh:['穩健推進者','勇於承擔方向，也重視讓團隊能穩定跟上。'],th:['ผู้ขับเคลื่อนอย่างมั่นคง','รับผิดชอบทิศทางและใส่ใจให้ทีมเดินตามได้อย่างต่อเนื่อง']},DC:{zh:['精準決策者','追求成果，也用分析和標準降低風險。'],th:['ผู้ตัดสินใจอย่างแม่นยำ','มุ่งผลลัพธ์พร้อมใช้การวิเคราะห์และมาตรฐานลดความเสี่ยง']},\n ID:{zh:['魅力推動者','善於建立認同，也願意快速把共識化為行動。'],th:['ผู้ขับเคลื่อนด้วยแรงดึงดูด','สร้างการยอมรับเก่งและเปลี่ยนความเห็นร่วมให้เป็นการลงมือได้เร็ว']},IS:{zh:['溫暖連結者','用熱情建立關係，再以耐心維持信任。'],th:['ผู้เชื่อมโยงอย่างอบอุ่น','สร้างความสัมพันธ์ด้วยพลังบวกและรักษาความไว้วางใจด้วยความอดทน']},IC:{zh:['說服型協調者','懂得傳達想法，也會補上證據與細節。'],th:['ผู้ประสานงานที่โน้มน้าวได้','ถ่ายทอดแนวคิดเก่งและเสริมด้วยหลักฐานกับรายละเอียด']},\n SD:{zh:['守護型執行者','照顧合作節奏，同時在需要時果斷完成任務。'],th:['ผู้ปฏิบัติที่คอยดูแลทีม','รักษาจังหวะความร่วมมือและตัดสินใจเด็ดขาดเมื่อจำเป็น']},SI:{zh:['支持型連結者','耐心陪伴他人，也樂於創造友善互動。'],th:['ผู้สนับสนุนที่เชื่อมโยงผู้คน','อยู่เคียงข้างอย่างอดทนและสร้างปฏิสัมพันธ์ที่เป็นมิตร']},SC:{zh:['可靠品質夥伴','以穩定服務團隊，並確保細節和規範到位。'],th:['คู่หูด้านคุณภาพที่ไว้ใจได้','สนับสนุนทีมอย่างสม่ำเสมอพร้อมดูแลรายละเอียดและข้อกำหนด']},\n CD:{zh:['分析型領航者','用充分資訊建立方向，並在關鍵時刻推動決策。'],th:['ผู้นำทางด้วยการวิเคราะห์','ใช้ข้อมูลสร้างทิศทางและผลักดันการตัดสินใจในจังหวะสำคัญ']},CI:{zh:['專業溝通者','把複雜資訊說清楚，讓人理解並願意採取行動。'],th:['ผู้สื่อสารอย่างมืออาชีพ','อธิบายข้อมูลซับซ้อนให้เข้าใจและชวนให้ลงมือทำ']},CS:{zh:['謹慎支持者','以準確和耐心提供穩定、可信賴的協作。'],th:['ผู้สนับสนุนอย่างรอบคอบ','ร่วมงานอย่างมั่นคงและน่าเชื่อถือด้วยความแม่นยำและอดทน']}\n};\n\nconst QUESTION_BANK=[\n{s:'D',zh:'遇到時間緊迫的工作，我會先抓住目標並決定最直接的行動。',th:'เมื่อเวลาทำงานกระชั้นชิด ฉันจะจับเป้าหมายและตัดสินใจลงมือในทางที่ตรงที่สุดก่อน'},\n{s:'D',zh:'團隊討論停滯時，我願意提出結論或建議，讓事情往前走。',th:'เมื่อการหารือของทีมชะงัก ฉันพร้อมเสนอข้อสรุปหรือแนวทางเพื่อให้งานเดินหน้าต่อ'},\n{s:'D',zh:'我喜歡對有挑戰性的目標負責，並能清楚衡量結果。',th:'ฉันชอบรับผิดชอบเป้าหมายที่ท้าทายและสามารถวัดผลลัพธ์ได้ชัดเจน'},\n{s:'D',zh:'意見不同時，我傾向直接說明立場，而不是等別人猜。',th:'เมื่อมีความเห็นต่าง ฉันมักอธิบายจุดยืนตรง ๆ แทนการรอให้คนอื่นคาดเดา'},\n{s:'D',zh:'我能在資訊還不完整時，先做可調整的決定並承擔責任。',th:'เมื่อข้อมูลยังไม่ครบ ฉันสามารถตัดสินใจเบื้องต้นที่ปรับได้และรับผิดชอบผลตามมา'},\n{s:'D',zh:'如果流程妨礙成果，我會主動提出縮短或改善的方法。',th:'หากขั้นตอนขัดขวางผลงาน ฉันจะเสนอวิธีลดขั้นตอนหรือปรับปรุงด้วยตนเอง'},\n{s:'D',zh:'我做事時會清楚確認負責人、期限與要達成的成果。',th:'เมื่อทำงาน ฉันจะยืนยันผู้รับผิดชอบ กำหนดเวลา และผลลัพธ์ที่ต้องการให้ชัดเจน'},\n{s:'D',zh:'面對突發狀況，我通常願意先採取行動，再依結果修正。',th:'เมื่อต้องรับมือเหตุการณ์ไม่คาดคิด ฉันมักลงมือก่อนแล้วค่อยปรับตามผลที่เกิดขึ้น'},\n{s:'D',zh:'我會主動爭取完成工作所需的資源或決策權限。',th:'ฉันจะขอทรัพยากรหรืออำนาจตัดสินใจที่จำเป็นต่องานด้วยตนเอง'},\n{s:'D',zh:'當團隊需要方向時，我願意提出優先順序並推動執行。',th:'เมื่อทีมต้องการทิศทาง ฉันพร้อมกำหนดลำดับความสำคัญและผลักดันให้ปฏิบัติ'},\n{s:'D',zh:'我可以接受合理的競爭，並把它當成提升成果的動力。',th:'ฉันยอมรับการแข่งขันที่เหมาะสมและใช้เป็นแรงผลักดันเพื่อยกระดับผลงาน'},\n{s:'D',zh:'我會以問題是否解決、目標是否達成來檢視工作進展。',th:'ฉันประเมินความคืบหน้าจากการแก้ปัญหาและการบรรลุเป้าหมาย'},\n{s:'I',zh:'在新團隊中，我通常能自然地開啟話題、認識夥伴。',th:'เมื่ออยู่ในทีมใหม่ ฉันมักเริ่มบทสนทนาและทำความรู้จักเพื่อนร่วมงานได้อย่างเป็นธรรมชาติ'},\n{s:'I',zh:'我喜歡用故事、例子或熱情的表達，讓別人理解一個想法。',th:'ฉันชอบใช้เรื่องเล่า ตัวอย่าง หรือการสื่อ
